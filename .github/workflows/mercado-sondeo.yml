name: Mercado · sondeo de fuentes
# Descarga una vez los archivos de cada fuente y los guarda en mercado/muestras para revisar su formato.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          mkdir -p mercado/muestras
          cd mercado/muestras
          ua="Mozilla/5.0 (compatible; CaobaMercado/1.0)"
          get() { code=$(curl -sSL -A "$ua" -o "$1" -w '%{http_code} %{content_type} %{size_download}' --max-time 90 "$2" || echo "error"); echo "$1 | $code | $2" >> resultado.txt; }
          rm -f resultado.txt
          while read -r n u; do [ -n "$n" ] && get "$n" "$u"; done < ../sondeo.txt
          ls -la >> resultado.txt
          cat resultado.txt
      - name: Guardar muestras
        run: |
          git config user.name "caoba-mercado"
          git config user.email "actions@users.noreply.github.com"
          git add mercado/muestras
          git commit -m "Mercado: muestras del sondeo de fuentes" || echo "sin cambios"
          git push
