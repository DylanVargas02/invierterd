const GOOGLE_CLIENT_ID='841813943891-ue07m6inn374ki8gch2uj3ktaq0jij12.apps.googleusercontent.com';
const MAIL_DEFAULT={clientId:GOOGLE_CLIENT_ID,connected:false,lastScan:0,seen:{},minRate:'',keepCed:false,
  cardQ:'newer_than:60d (consumo OR compra OR transacción OR transaccion OR cargo OR "fue utilizada") (tarjeta OR débito OR crédito)',
  brokerQ:'newer_than:365d ("puesto de bolsa" OR valores OR "casa de bolsa") (confirmación OR confirmacion OR operación OR operacion OR liquidación OR colocación OR colocacion OR reporto)'};
const GSI_SRC='https://accounts.google.com/gsi/client', GAPI='https://gmail.googleapis.com/gmail/v1/users/me/';
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let gTok=null,gTokExp=0,cedSession='',pdfReady=null;
const dtFmt=new Intl.DateTimeFormat('es-DO',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return}const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar un componente necesario. Revisa tu conexión.'));document.head.appendChild(s)})}
function loadPdf(){
  if(!pdfReady)pdfReady=(async()=>{await loadScript(PDFJS+'pdf.worker.min.js');await loadScript(PDFJS+'pdf.min.js');const L=window.pdfjsLib;L.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';return L})().catch(e=>{pdfReady=null;throw e});
  return pdfReady;
}
function getCed(){if(cedSession)return cedSession;try{return localStorage.getItem(KEY+'.ced')||''}catch(e){return ''}}
function setCed(v,keep){cedSession=v;try{if(keep&&v)localStorage.setItem(KEY+'.ced',v);else localStorage.removeItem(KEY+'.ced')}catch(e){}}
function cedVariants(){const c=getCed(),d=c.replace(/\D/g,'');if(!d)return [];return [...new Set([d,d.replace(/^(\d{3})(\d{7})(\d)$/,'$1-$2-$3'),c.trim()])]}
/* Abre un PDF; si está protegido prueba la cédula (con y sin guiones). Todo ocurre en el teléfono. */
async function pdfText(bytes,pwds){
  const L=await loadPdf();
  for(const pw of [undefined,...pwds]){
    try{const doc=await L.getDocument({data:bytes.slice(0),password:pw,isEvalSupported:false}).promise;let out='';
      for(let i=1;i<=Math.min(doc.numPages,8);i++){const p=await doc.getPage(i);const tc=await p.getTextContent();out+=tc.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('')+'\n'}
      await doc.destroy();return out}
    catch(e){if(e&&e.name==='PasswordException')continue;throw e}
  }
  const err=new Error(pwds.length?'La cédula no abre este PDF.':'Este PDF está protegido. Escribe tu cédula para abrirlo.');err.code='pw';throw err;
}
async function gToken(interactive=true){
  if(gTok&&Date.now()<gTokExp-60e3)return gTok;
  if(!S.mail.clientId)throw new Error('Falta el ID de cliente de Google. Sigue la guía de instalación y pégalo en Configuración avanzada.');
  await loadScript(GSI_SRC);
  if(!window.google||!google.accounts)throw new Error('Google no respondió. Esta función trabaja en la app instalada desde tu propio enlace.');
  return new Promise((res,rej)=>{
    const c=google.accounts.oauth2.initTokenClient({client_id:S.mail.clientId,scope:'https://www.googleapis.com/auth/gmail.readonly',
      callback:r=>{if(r.error)return rej(new Error('Google no dio permiso ('+r.error+').'));gTok=r.access_token;gTokExp=Date.now()+(+r.expires_in||3600)*1000;S.mail.connected=true;save();res(gTok)},
      error_callback:e=>rej(new Error(e&&e.type==='popup_closed'?'Cerraste la ventana de Google antes de terminar.':'No se pudo abrir la ventana de Google. Permite ventanas emergentes e inténtalo de nuevo.'))});
    c.requestAccessToken({prompt:S.mail.connected?'':'consent'});
  });
}
async function gGet(path){const t=await gToken();const r=await fetch(GAPI+path,{headers:{Authorization:'Bearer '+t}});if(r.status===401){gTok=null;throw new Error('El permiso de Google venció. Toca «Revisar correo ahora» otra vez.')}if(!r.ok)throw new Error('Gmail respondió con un error ('+r.status+').');return r.json()}
const b64u=s=>{const bin=atob(s.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
const htmlText=h=>{try{const d=new DOMParser().parseFromString(h,'text/html');d.querySelectorAll('br,p,div,tr,li').forEach(n=>n.append('\n'));return d.body?d.body.textContent:''}catch(e){return h.replace(/<[^>]+>/g,' ')}};
function walk(p,acc){
  if(p.parts)p.parts.forEach(x=>walk(x,acc));
  else if(p.filename&&/\.pdf$/i.test(p.filename)&&p.body&&p.body.attachmentId)acc.pdfs.push(p.body.attachmentId);
  else if(p.body&&p.body.data){const txt=new TextDecoder().decode(b64u(p.body.data));if(p.mimeType==='text/plain')acc.plain+=txt;else if(p.mimeType==='text/html')acc.html+=txt}
  return acc;
}
async function gMessage(id){
  const m=await gGet('messages/'+id+'?format=full');
  const h=Object.fromEntries((m.payload.headers||[]).map(x=>[x.name.toLowerCase(),x.value]));
  const acc=walk(m.payload,{plain:'',html:'',pdfs:[]});
  return {id,from:h.from||'',subject:h.subject||'',date:+m.internalDate||Date.now(),text:acc.plain||htmlText(acc.html),pdfs:acc.pdfs};
}
const senderName=f=>{const m=f.match(/^\s*"?([^"<]+?)"?\s*</);if(m)return m[1].trim();const d=f.match(/@([\w.-]+)/);return d?d[1]:'Puesto de bolsa'};
function cardPending(r,date,src){
  const card=r.last4?S.cards.find(c=>c.last4===r.last4):null,acc=!card&&r.last4?S.savings.find(s=>s.last4===r.last4):null;
  return {acctId:acc?acc.id:null,id:'m'+(src||uid()),desc:r.merchant||(r.kind==='retiro'?'Retiro con tarjeta':'Consumo con tarjeta'),amt:r.amt,cur:r.cur,cat:guessCat(r.merchant),cardId:card?card.id:null,last4:r.last4,date:date||Date.now(),src:'correo'};
}
function invPending(r,date,src){return {id:'i'+(src||uid()),name:r.name,entity:r.entity,issuer:r.issuer,rate:r.rate,amt:r.amt,cur:r.cur,start:r.start||date||Date.now(),end:r.end,months:r.months,date:date||Date.now()}}
async function scanMail(step){
  const M=S.mail,seen=M.seen||(M.seen={});let nc=0,ni=0,locked=0,hits=[];
  const list=async q=>((await gGet('messages?maxResults=40&q='+encodeURIComponent(q))).messages||[]);
  step('Buscando consumos…');
  for(const {id} of await list(M.cardQ)){if(seen[id])continue;const m=await gMessage(id);seen[id]=1;const r=parseCardAlert(m.subject+'\n'+m.text);if(r&&!S.pending.some(p=>p.id==='m'+id)){S.pending.push(cardPending(r,m.date,id));nc++}}
  step('Leyendo acuerdos de inversión…');
  for(const {id} of await list(M.brokerQ)){
    if(seen[id])continue;const m=await gMessage(id);let text=m.subject+'\n'+m.text,lockedHere=false;
    for(const aid of m.pdfs.slice(0,4)){try{const a=await gGet('messages/'+id+'/attachments/'+aid);text+='\n'+await pdfText(b64u(a.data),cedVariants())}catch(e){if(e.code==='pw'){locked++;lockedHere=true}}}
    const r=parseBroker(text,senderName(m.from));
    if(r&&!S.pendingInv.some(p=>p.id==='i'+id)){S.pendingInv.push(invPending(r,m.date,id));ni++;if(+M.minRate&&r.rate>=+M.minRate)hits.push(r)}
    if(r||!lockedHere)seen[id]=1;
  }
  M.lastScan=Date.now();save();return {nc,ni,locked,hits};
}

}

function openOnboarding(restart){
  if(restart||!W)W=(!restart&&S.onbDraft&&S.onbDraft.W&&S.onbDraft.W.v===3&&S.onbDraft.W)||newDraft();
  oStep=restart?0:Math.min((S.onbDraft&&S.onbDraft.W&&S.onbDraft.W.v===3&&S.onbDraft.step)||0,OSTEPS.length-1);
  document.documentElement.classList.add('onb-open');renderOnb();

function leaveOnb(){collectOnb();S.onbDraft={step:oStep,W};S.onbDismissed=true;save();$('#onbLayer').innerHTML='';document.documentElement.classList.remove('onb-open');render()}
function monthlyIncome(){return dop(W.inc.amt,W.inc.cur)*(W.inc.src==='salario'&&W.inc.freq==='quincenal'?2:1)+W.other.reduce((a,o)=>a+dop(o.amt,o.cur),0)}
function fixedByCat(){const o={};FIXED.forEach(([k,,c])=>{const f=W.fixed[k];if(f&&f.on&&num(f.amt))o[c]=(o[c]||0)+num(f.amt)});(W.customFixed||[]).forEach(f=>{if(num(f.amt))o[f.cat||'otros']=(o[f.cat||'otros']||0)+num(f.amt)});return o}
function debtMonthly(){
  let d=0;if(W.has.loans)W.loans.forEach(l=>{if(num(l.amt)&&num(l.months))d+=dop(cuota(num(l.amt),rate(l.rate)||0,num(l.months)),l.cur)});
  if(W.has.cards)W.cards.forEach(c=>{const b=num(c.balance);if(b)d+=dop(Math.max(b*.05,c.cur==='DOP'?500:10),c.cur)});return d;
}
function suggestBudget(){
  const inc=monthlyIncome(),fx=fixedByCat(),fixed=Object.values(fx).reduce((a,b)=>a+b,0),debt=debtMonthly();
  let saveAmt=Math.round(inc*.2/500)*500,free=inc-fixed-debt-saveAmt;
  if(free<inc*.15){saveAmt=Math.max(0,saveAmt-(inc*.15-free));free=Math.max(inc*.15,inc-fixed-debt-saveAmt)}
  const wts={comida:.42,transporte:.22,salud:.08,ocio:.12,educacion:.04,otros:.12},b={};
  Object.keys(CATS).forEach(c=>{const v=(fx[c]||0)+(wts[c]?free*wts[c]:0);if(v>0)b[c]=Math.round(v/100)*100});
  return {b,inc,fixed,debt,save:Math.max(0,Math.round(saveAmt))};
}

/* ---------- Cobros fijos (salario): «¿Ya cobraste?» ---------- */
function payOccs(p){
  const n=new Date(),sod=new Date(n.getFullYear(),n.getMonth(),n.getDate()),L=[];
  for(const mo of [-1,0]){const y=n.getFullYear(),m=n.getMonth()+mo,last=new Date(y,m+1,0).getDate();
    p.days.forEach(d=>{const dt=new Date(y,m,Math.min(d,last),12);if(dt<=new Date(+sod+DAY-1)&&dt.getTime()>=(p.start||0)-DAY&&!p.done[isoLocal(dt)])L.push(dt)})}
  return L.sort((a,b)=>a-b);
}
function pendingPays(){const t=today();return (S.paydays||[]).flatMap(p=>(p.snooze&&p.snooze>t)?[]:payOccs(p).map(d=>({p,d})))}

    <button type="button" class="link-btn payq-skip" id="paySkip" data-pd="${p.id}" data-dt="${isoLocal(d)}">Este no lo voy a cobrar</button>${L.length>1?`<p class="hint">Y ${L.length-1} ${L.length===2?'cobro más':'cobros más'} por confirmar.</p>`:''}</section>`;
}

/* ---------- Retiro de efectivo y transferencias entre cuentas ---------- */
function applyTr(x,sign){const a=viaObj(x.from),b=viaObj(x.to);if(a)a.o.principal-=x.amt*sign;if(b)b.o.principal+=conv(x.amt,x.cur,b.o.cur)*sign}
function openTransfer(id,pre={}){
  const ed=id?(S.transfers||[]).find(x=>x.id===id):null,A=accts(),cash=A.find(s=>s.type==='Efectivo');
  const bank=A.filter(s=>s.type!=='Efectivo');

  <div class="err" id="err"></div><button class="btn" type="submit">${ed?'Guardar cambios':'Guardar'}</button>
  ${ed?`<button type="button" class="link-btn danger del-link" id="cDel">Eliminar tarjeta</button>`:''}</form>`,'var(--brand)');
  if(ed)$('#cDel').onclick=()=>confirmDel(ed.name,delDetail('cards',ed),()=>removeItem('cards',ed.id));
  $('#f').onsubmit=ev=>{ev.preventDefault();const lim=money($('#cLim').value),bal=money($('#cBal').value||'0'),r=rate($('#cRate').value),day=parseInt($('#cDay').value,10),name=$('#cName').value.trim();
    if(!name)return $('#err').textContent='Ponle un nombre a la tarjeta.';if(!(lim>0))return $('#err').textContent='Escribe el límite en números, por ejemplo 50000.';if(!(bal>=0))return $('#err').textContent='Lo consumido no puede ser negativo.';if(bal>lim)return $('#err').textContent='Lo consumido no puede ser mayor que el límite.';if(!(r>=0&&r<200))return $('#err').textContent='Revisa la tasa anual.';if(!(day>=1&&day<=31))return $('#err').textContent='El día de pago va de 1 a 31.';

    if(ed)Object.assign(ed,x);else S.cards.push({id:uid(),...x});
    save();close();if(view==='prestamos')credSeg='tarjetas';render();toast(ed?'Cambios guardados':'Tarjeta guardada')};
}

  <div class="two"><div class="field"><label for="lAmt">Monto prestado</label><input id="lAmt" data-money="lCur" inputmode="decimal" placeholder="0.00"></div><div class="field"><label for="lCur">Moneda</label>${curSel('lCur','DOP')}</div></div>
  <div class="two"><div class="field"><label for="lRate">Tasa anual %</label><input id="lRate" inputmode="decimal" placeholder="12.00"></div><div class="field"><label for="lMon">Plazo (meses)</label><input id="lMon" inputmode="numeric" placeholder="60"></div></div>

    S.loans.push({id:uid(),name,entity:readEnt('lEnt')||'Sin entidad',type:$('#lType').value,cur:$('#lCur').value,principal:P,rate:r,months:mo,start:parseDate($('#lStart').value)});

/* ---------- Confirmación fuerte: mantener presionado 5 s y luego confirmar ---------- */
const HOLD_MS=5000;
function hasRealData(){return !S.example&&['savings','expenses','incomes','cards','loans','recurring','goals','transfers','paydays'].some(k=>(S[k]||[]).length)}
function lossList(){const n=k=>(S[k]||[]).length,p=(c,a,b)=>c+' '+(c===1?a:b);const L=[];
  if(n('savings'))L.push(p(n('savings'),'cuenta o inversión','cuentas e inversiones'));
  if(n('expenses')+n('incomes'))L.push(p(n('expenses')+n('incomes'),'movimiento','movimientos')+' (gastos e ingresos)');
  if(n('cards'))L.push(p(n('cards'),'tarjeta de crédito','tarjetas de crédito'));
  if(n('loans'))L.push(p(n('loans'),'préstamo','préstamos'));
  if(n('recurring'))L.push(p(n('recurring'),'pago fijo','pagos fijos'));
  return L}
function holdConfirm(o){
  const L=lossList();
  sheet(`<div class="hc"><span class="hc-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg></span>
    <h3>${o.title}</h3><p class="lead-s">${o.detail}</p>
    ${L.length?`<ul class="hc-list">${L.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    <div id="hcStage"><button type="button" class="hc-hold" id="hcHold" aria-describedby="hcHint"><i class="hc-fill" aria-hidden="true"></i><span id="hcTxt">Mantén presionado para confirmar</span></button>
    <p class="hint hc-hint" id="hcHint">Deja el dedo sobre el botón 5 segundos. Si lo sueltas antes, no pasa nada.</p></div>
    <button type="button" class="btn ghost hc-no" id="hcNo">No, conservar mis datos</button></div>`,'var(--spend)');
  const b=$('#hcHold'),fill=b.querySelector('.hc-fill'),txt=$('#hcTxt');let t0=0,raf=0,done=false;
  const reset=()=>{if(done)return;cancelAnimationFrame(raf);t0=0;fill.style.transform='scaleX(0)';txt.textContent='Mantén presionado para confirmar';b.classList.remove('on')};
  const step=()=>{const p=Math.min(1,(performance.now()-t0)/HOLD_MS);fill.style.transform=`scaleX(${p})`;
    txt.textContent=p<1?`Sigue presionando… ${Math.ceil((1-p)*HOLD_MS/1000)}`:'';if(p<1)raf=requestAnimationFrame(step);else ready()};
  const start=e=>{if(done||t0)return;if(e&&e.cancelable)e.preventDefault();t0=performance.now();b.classList.add('on');raf=requestAnimationFrame(step)};
  const ready=()=>{done=true;try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
    $('#hcStage').innerHTML=`<p class="hc-last" role="alert">Último paso. Esto no se puede deshacer después de unos segundos.</p><button type="button" class="btn hc-yes" id="hcYes">${o.confirm||'Sí, borrar todo'}</button>`;
    $('#hcYes').focus();$('#hcYes').onclick=()=>{close();o.onConfirm()}};
  b.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,reset));
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)start(e)});b.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')reset()});
  b.onclick=e=>e.preventDefault();
  $('#hcNo').onclick=close;
}
/* Reemplaza los datos guardando una copia para «Deshacer» */
function replaceData(next,msg){const prev=JSON.parse(JSON.stringify(S));S=next;save();render();undoToast(msg,()=>{S=prev;save();render();toast('Tus datos volvieron')})}
function eraseAll(){holdConfirm({title:'¿Borrar todos tus datos?',detail:'Se borrará todo lo que has anotado en la app. Tu nombre, tu moneda y tu apariencia se conservan.',
  onConfirm:()=>replaceData(blank(),'Se borró todo')})}

/* ---------- Ajustes ---------- */
const SET_IC={user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/>',guide:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',chev:'<path d="M9 6l6 6-6 6"/>'};
const sic=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${SET_IC[k]}</svg>`;
const seg=(name,opts,val)=>`<div class="seg" role="radiogroup">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}" ${v===val?'checked':''}><span>${l}</span></label>`).join('')}</div>`;
const setRow=(id,ic,title,sub,cls)=>`<button type="button" class="set-row ${cls||''}" id="${id}"><span class="set-ic">${sic(ic)}</span><span class="set-t"><b>${title}</b>${sub?`<small>${sub}</small>`:''}</span><span class="set-go">${sic('chev')}</span></button>`;
function openSettings(){
  const who=sbUser&&sbUser.email;
  sheet(`<h3>Ajustes</h3>
  <section class="set-g"><h4>Tu cuenta</h4><div class="set-card">
    ${setRow('aAcc','user',who?esc(who):'Iniciar sesión',who?'Tus datos se guardan en la nube':'Guarda tus datos y úsalos en otro teléfono')}</div></section>
  <section class="set-g"><h4>Preferencias</h4><div class="set-card set-form">
    <div class="set-f"><label for="aName">Tu nombre</label><input id="aName" value="${esc(S.name||'')}" maxlength="30" placeholder="Para saludarte" autocomplete="given-name"></div>
    <div class="set-f"><span class="set-l" id="lBase">Moneda principal</span><div aria-labelledby="lBase">${seg('aBase',[['DOP','Pesos · RD$'],['USD','Dólares · US$']],S.base==='USD'?'USD':'DOP')}</div></div>
    <div class="set-f"><label for="aUsd">Tasa del dólar</label><div class="set-rate"><span>US$1 =</span><span class="set-rd">RD$</span><input id="aUsd" inputmode="decimal" value="${S.rates.USD}"></div><small class="set-msg" id="aUsdMsg" aria-live="polite">Se usa para convertir tus montos en dólares.</small></div>
    <div class="set-f"><span class="set-l" id="lTheme">Apariencia</span><div aria-labelledby="lTheme">${seg('aTheme',[['','Automática'],['light','Clara'],['dark','Oscura']],S.theme||'')}</div></div>
    <div class="set-f"><label class="set-sw"><span><b>Hogar compartido</b><small>Divide gastos con tu pareja o con quien vives.</small></span><input type="checkbox" role="switch" id="aHome" ${S.home.on?'checked':''}><i aria-hidden="true"></i></label>
      <div id="aPartnerF" ${S.home.on?'':'hidden'}><label for="aPartner" class="sr">Nombre de esa persona</label><input id="aPartner" value="${esc(S.home.partner||'')}" maxlength="24" placeholder="Nombre de esa persona"></div></div>
  </div></section>
  <section class="set-g"><h4>Más opciones</h4><div class="set-card">
    ${setRow('aMail','mail','Correo y documentos','Lee estados de cuenta y avisos del banco')}
    ${setRow('aPrv','shield','Privacidad','Qué guardamos y cómo')}
    ${setRow('aOnb','guide','Repetir la guía inicial','Vuelve a contestar las preguntas del inicio')}
    ${setRow('aEx','eye','Ver datos de ejemplo','Explora la app con una familia de muestra')}
  </div></section>
  <section class="set-g"><h4>Zona de cuidado</h4><div class="set-card">
    ${setRow('aBlank','trash','Borrar todos mis datos','Te pediremos confirmarlo dos veces','danger')}
  </div></section>
  <p class="set-ver">InvierteRD ${APP_VER} · los cambios se guardan solos</p>`,'var(--brand)');
  const live=()=>{save();render()};
  $('#aName').onchange=()=>{S.name=$('#aName').value.trim();live();toast('Nombre guardado')};
  document.querySelectorAll('[name=aBase]').forEach(r=>r.onchange=()=>{S.base=r.value;live();toast(r.value==='USD'?'Ahora ves todo en dólares':'Ahora ves todo en pesos')});
  document.querySelectorAll('[name=aTheme]').forEach(r=>r.onchange=()=>{S.theme=r.value||null;
    if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme');live()});
  const usd=$('#aUsd'),msg=$('#aUsdMsg');
  usd.onchange=()=>{const u=rate(usd.value);if(!(u>1&&u<1000)){msg.textContent='Escribe un número válido, por ejemplo 60.90.';msg.classList.add('bad');usd.value=S.rates.USD;return}
    S.rates=Object.assign({},S.rates,{USD:u});msg.classList.remove('bad');msg.textContent='Guardado. US$1 = '+fmt(u,'DOP');live()};
  $('#aHome').onchange=()=>{S.home.on=$('#aHome').checked;$('#aPartnerF').hidden=!S.home.on;if(S.home.on)$('#aPartner').focus();live()};
  $('#aPartner').onchange=()=>{S.home.partner=$('#aPartner').value.trim();live()};
  $('#aMail').onclick=()=>{close();openMail()};
  $('#aAcc').onclick=()=>{close();openAccount()};
  $('#aPrv').onclick=()=>{close();openPrivacy()};
  $('#aOnb').onclick=()=>{if(!hasRealData()){close();return openOnboarding(true)}
    holdConfirm({title:'¿Repetir la guía inicial?',detail:'Al terminar la guía, tus datos actuales se reemplazan por lo que contestes.',confirm:'Sí, empezar la guía',onConfirm:()=>openOnboarding(true)})};
  $('#aEx').onclick=()=>{const ex=()=>{const keep={base:S.base,rates:S.rates,theme:S.theme,mail:S.mail,name:S.name};return Object.assign(sample(),keep)};
    if(!hasRealData()){close();S=ex();save();render();return toast('Datos de ejemplo cargados')}
    holdConfirm({title:'¿Cambiar tus datos por el ejemplo?',detail:'Los datos de ejemplo reemplazan todo lo que has anotado.',confirm:'Sí, ver el ejemplo',onConfirm:()=>replaceData(ex(),'Datos de ejemplo cargados')})};
  {const h=$('#layer h3');h.tabIndex=-1;h.focus({preventScroll:true})}
  $('#aBlank').onclick=()=>{if(!hasRealData()&&!S.example){close();return toast('No tienes datos que borrar')}eraseAll()};
}
let tt;function undoToast(m,fn,label){clearTimeout(tt);let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.innerHTML='<span>'+esc(m)+'</span><button type="button" id="undoBtn">'+(label||'Deshacer')+'</button>';$('#undoBtn').onclick=()=>{clearTimeout(tt);el.remove();fn()};tt=setTimeout(()=>el.remove(),5000)}
function toast(m){clearTimeout(tt);let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;tt=setTimeout(()=>el.remove(),2200)}

/* ---------- Bucles en vivo ---------- */
let last=0;
function fitBig(){document.querySelectorAll('.deep .big').forEach(el=>{const n=el.textContent.length;el.style.setProperty('--bs',n>13?`max(22px, calc(min(9vw, 40px) * ${(13/n).toFixed(3)}))`:'clamp(30px,9vw,40px)')})}
let lastLen=0;
function tickLive(){
  const t=Date.now();
  if(view==='resumen'){const F=snapshot(t),nb=$('#netBig');if(nb){nb.innerHTML=split(netValue(F),S.base,2);if(nb.textContent.length!==lastLen){lastLen=nb.textContent.length;fitBig()}$('#netA').textContent=fmt(F.assets,S.base,0);const nd=$('#netD');if(nd)nd.textContent=fmt(accts().reduce((a,s)=>a+conv(savValue(s,t),s.cur,S.base),0),S.base,0);S.savings.forEach(s=>{const a=document.querySelector(`[data-sv="${s.id}"]`);if(a)a.textContent=fmt(savValue(s,t),s.cur,2)})}return}
  if(view==='ingresos'&&intR){const it=$('#intTot');if(it){let sum=0;S.savings.forEach(s=>{const v=intOf(s,intR[0],intR[1]);sum+=conv(v,s.cur,S.base);const e=document.querySelector(`[data-int="${s.id}"]`);if(e)e.textContent=fmt(v,s.cur,4)});
    it.textContent=fmt(sum,S.base,2);const bt=$('#bdnTot');if(bt){if(bt.dataset.b===undefined)bt.dataset.b=String(S.incomes.filter(x=>inR(x,intR)).reduce(sumB,0));bt.textContent=fmt(+bt.dataset.b+sum,S.base,0)}}return}
  if(view!=='ahorros')return;
  const T=totals(t), lt=$('#liveTotal'); if(!lt)return;
  lt.innerHTML=split(T.v,S.base,4);
  $('#liveGain').textContent=fmt(T.v-T.p,S.base,0);
  const wS=$('#wgS'),wM=$('#wgM');if(wS)wS.firstChild.nodeValue=fmt(T.v,S.base,0);if(wM)wM.firstChild.nodeValue=fmt(T.v,S.base,4);
  S.savings.forEach(s=>{const v=savValue(s,t),a=document.querySelector(`[data-sv="${s.id}"]`),b=document.querySelector(`[data-si="${s.id}"]`);if(a)a.textContent=fmt(v,s.cur,2);if(b)b.textContent='+'+fmt(v-s.principal,s.cur,2)});
}
function loop(ts){if(ts-last>(reduce?1000:100)){last=ts;tickLive()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
setInterval(()=>{
  STOCKS.forEach(s=>{const sigma=s.sym==='MH-2034'?.0004:.0018;const nx=s.price*(1+(Math.random()-.5)*2*sigma);s.dir=Math.sign(nx-s.price);s.price=nx;s.hist.push(nx);s.hist.shift()});
  if(view==='mercado'&&mktSeg==='acciones'){const el=$('#ticks');if(el)el.innerHTML=ticksHTML()}
},reduce?5000:1500);

normalizeS();
try{if(getCed())S.mail.keepCed=true}catch(e){}
render();
if(!S.onboarded&&!S.onbDismissed)openOnboarding(true);
if(isPublished()&&canCloud()){let has=false;try{has=!!localStorage.getItem(KEY+'.auth')}catch(e){}if(/access_token=|error_description=/.test(location.hash||''))sessionFromUrl();else if(has)sbClient().catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullIfNewer()});
window.addEventListener('online',()=>{if(sbUser&&(S._upd||0)>(S._synced||0))pushNow()});
})();
