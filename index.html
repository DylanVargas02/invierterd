/* ---- Versión 2: identidad dominicana, pestañas nuevas y gráficos ---- */

/* Marca */
.brand-mark{background:none;border-radius:5px;overflow:hidden;width:32px;height:32px;box-shadow:0 2px 6px -2px rgb(0 45 98 / .45)}
.brand-mark svg{width:32px;height:32px;stroke:none;display:block}
.brand small .rd{color:var(--rd-red)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand small .rd{color:#FF5A6A}}
:root[data-theme="dark"] .brand small .rd{color:#FF5A6A}

/* Tarjetas protagonistas por sección */
.hero.brandc{--d1:var(--brand-deep);--d2:var(--brand-deep2);--glow:var(--brand-glow)}
.hero.brandc.neg{--d1:var(--debt-deep);--d2:var(--debt-deep2);--glow:var(--debt-glow)}
.inv-card{--d1:var(--inv-deep);--d2:var(--inv-deep2);--glow:var(--inv-glow)}
.addb{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:var(--glow);color:var(--d1);box-shadow:0 4px 12px -4px rgb(0 0 0 / .4)}
.addb svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.hero-r{display:flex;align-items:center;gap:12px}
.hero-sub{font-size:13px;color:color-mix(in srgb,var(--on-deep) 72%,transparent);margin-top:4px}
.hero-seg{display:inline-flex;margin-top:12px}

/* Períodos */
.per{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:14px;padding-bottom:2px}
.per::-webkit-scrollbar{display:none}
.per button{flex-shrink:0;border:1px solid color-mix(in srgb,var(--on-deep) 22%,transparent);background:none;color:color-mix(in srgb,var(--on-deep) 82%,transparent);border-radius:6px;padding:6px 12px;font-size:12.5px;font-weight:700}
.per button[aria-pressed="true"]{background:var(--on-deep);border-color:var(--on-deep);color:var(--d1)}
.per.light{margin-top:0}
.per.light button{border-color:var(--line);color:var(--ink-2);background:var(--surface)}
.per.light button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.per-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.per-dates label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:color-mix(in srgb,var(--on-deep) 75%,transparent)}
.per-dates input{border:1px solid color-mix(in srgb,var(--on-deep) 25%,transparent);background:color-mix(in srgb,var(--on-deep) 10%,transparent);color:var(--on-deep);border-radius:6px;padding:8px;font-size:15px;color-scheme:dark;min-width:0}
.per-dates.light label{color:var(--ink-2)}
.per-dates.light input{border-color:var(--line);background:var(--bg);color:var(--ink);color-scheme:inherit}

/* Paneles */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-top:12px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;min-height:30px}
.panel-h>b{font-size:15px;font-weight:800}
.panel-s{font-size:12px;color:var(--ink-2);font-weight:600;text-align:right}
.seg.tiny{padding:3px;border-radius:6px;margin:0;flex-shrink:0}
.seg.tiny button{padding:5px 9px;font-size:12px;border-radius:8px;flex:0 0 auto}
.io{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.io>*{min-width:0;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px}
.io small{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.io strong{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pos{color:var(--grow)} .negc{color:var(--spend)}
.sw{display:inline-block;width:8px;height:8px;border-radius:3px;flex-shrink:0}
.flow2{display:flex;gap:2px;height:8px;border-radius:6px;overflow:hidden;margin-top:12px}
.flow2 i{display:block;min-width:3px}
.sec-tot{margin-left:auto;font-size:14px;letter-spacing:-.01em;text-transform:none;color:var(--ink);font-weight:800}
h2.sec button{margin-left:auto}
.rowbtn{width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left;font:inherit;color:inherit}
.tx-group .rowbtn:last-child{border-bottom:0}
.mbar{display:block;height:4px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px;max-width:150px}
.mbar i{display:block;height:100%;border-radius:6px}
.empty.sm{padding:16px 14px;font-size:13.5px}

/* Dona + lista de barras */
.dn{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:center}
.dn-svg{width:112px;height:112px;display:block}
.dn-svg circle{transition:opacity .15s}
.dn-t1{font-family:var(--f-display);font-weight:800;font-size:12px;fill:var(--ink);letter-spacing:-.02em}
.dn-t2{font-size:10px;font-weight:700;fill:var(--ink-2)}
.ml{display:flex;flex-direction:column;gap:9px;min-width:0}
.ml-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;column-gap:7px;row-gap:4px;align-items:center;font-size:12.5px}
.ml-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:600}
.ml-row b{font-weight:800;white-space:nowrap}
.ml-t{grid-column:2/3;height:5px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.ml-t i{display:block;height:100%;border-radius:6px}
.ml-row small{font-size:11px;font-weight:700;color:var(--ink-2);text-align:right}
@media (max-width:350px){.dn{grid-template-columns:1fr;justify-items:center}.ml{width:100%}}

/* Columnas en el tiempo */
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);padding-top:4px}
.col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;border:0;background:none;padding:0 1px;border-radius:6px 6px 0 0}
.col i{display:block;width:100%;max-width:28px;background:var(--cc);opacity:.55;border-radius:4px 4px 0 0;transition:opacity .15s}
.col[aria-pressed="true"] i{opacity:1}
.col:hover i{opacity:.85}
.col-l{display:flex;gap:3px;margin-top:6px}
.col-l span{flex:1;min-width:0;text-align:center;font-size:10.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:visible}
.col-cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2)}
.col-cap span::first-letter{text-transform:uppercase}
.col-cap b{color:var(--ink);font-size:15px;font-weight:800}

/* Barras por entidad */
.hb{display:flex;flex-direction:column;gap:11px}
.hb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center;font-size:13px}
.hb-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hb-row b{font-weight:800}
.hb-t{grid-column:1/-1;height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:4px;background:var(--inv)}

/* Desglose por entidad */
.eg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.eg-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:color-mix(in srgb,var(--inv) 6%,var(--surface))}
.eg-h .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eg-h .mid span{font-size:12px;color:var(--ink-2)}
.eg-v{text-align:right}
.eg-v b{display:block;font-size:16px;font-weight:800;white-space:nowrap}
.eg-v small{font-size:11.5px;color:var(--ink-2);font-weight:600}
.eg-r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.eg-r .mid b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eg-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:3px}
.ty{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.soonc{color:var(--debt);font-weight:700}
.eg-a{text-align:right;font-weight:700;font-size:14.5px;white-space:nowrap}
.eg-a small{display:block;font-size:11.5px;font-weight:700;color:var(--grow)}
.inst.bolsa{--ic:var(--i-bolsa);border-radius:4px 14px 4px 14px}

/* Formularios */
.ent-o{margin-top:8px}
.form select optgroup{font-weight:700}

/* Próximamente */
.soonv{position:relative;text-align:center;padding:42px 20px 28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-top:6px;overflow:hidden}
.soonv::before{content:"";position:absolute;inset:0 0 auto;height:120px;background:radial-gradient(80% 100% at 50% 0%,var(--ss),transparent 70%);pointer-events:none}
.soonv>*{position:relative}
.soon-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sc);background:var(--ss);border-radius:6px;padding:4px 10px}
.soon-ic{display:grid;place-items:center;width:72px;height:72px;margin:18px auto 6px;border-radius:10px;background:var(--sc);color:var(--surface);box-shadow:0 10px 24px -10px var(--sc)}
.soon-ic svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.soonv h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:10px 0 6px}
.soonv>p{margin:0 auto;color:var(--ink-2);max-width:32ch;font-size:15px}
.soonv ul{list-style:none;padding:0;margin:20px auto 0;max-width:300px;text-align:left;display:flex;flex-direction:column;gap:10px}
.soonv li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;font-weight:600}
.soonv li svg{width:20px;height:20px;flex-shrink:0;fill:none;stroke:var(--sc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.soon-note{margin:20px auto 0;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:10px 12px;max-width:34ch}

/* Barra inferior de 7 pestañas */
nav.tabs .inner{grid-template-columns:repeat(7,1fr)}
nav.tabs button{font-size:10.5px;padding:7px 0 8px;gap:2px;min-width:0}
nav.tabs .ic{width:40px;height:27px}
nav.tabs svg{width:20px;height:20px}
@media (max-width:360px){nav.tabs button{font-size:9.5px;letter-spacing:-.01em}nav.tabs .ic{width:34px}}
.fab{display:none!important}
.app{padding-bottom:110px}
.brand h1{text-wrap:balance}
.brand h1.long{font-size:20px;line-height:1.02}
.io strong{font-size:14.5px}
header.top{gap:8px}.brand{min-width:0;flex:1}.brand>div{min-width:0}.top-actions{flex-shrink:0}
@media (max-width:360px){.brand{gap:8px}.brand h1{font-size:20px}.brand h1.long{font-size:16.5px}.top-actions{gap:5px}.icon-btn{width:32px;height:32px}.chip-btn{padding:5px 9px}.brand-mark,.brand-mark svg{width:28px;height:28px}}


/* ---- Versión 2.1: barra más limpia, resumen interactivo, edición ---- */
nav.tabs{background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px -14px rgb(0 0 0 / .25)}
nav.tabs .inner{grid-template-columns:repeat(6,1fr)}
nav.tabs button{font-size:11px;font-weight:600;padding:8px 0 9px;gap:3px;color:var(--ink-2)}
nav.tabs .ic{width:44px;height:28px}
nav.tabs svg{width:21px;height:21px;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{font-weight:800}
@media (max-width:360px){nav.tabs button{font-size:10px}nav.tabs .ic{width:38px}}

/* Acciones rápidas */
.qa{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:12px}
.qa-b{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:12px 14px;font-weight:800;font-size:15px;color:var(--surface)}
.qa-b.inc{background:var(--grow)}
.qa-b.exp{background:var(--spend)}
.qa-b.more{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding-inline:14px}
.qa-ic{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--surface) 22%,transparent)}
.qa-b.more .qa-ic{background:var(--surface-2)}
.qa-ic svg{width:15px;height:15px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round}
.qa-b.more .qa-ic svg{fill:currentColor;stroke:none}

/* Saldo: filas con cifras completas */
.hrows{margin-top:14px;border-top:1px solid color-mix(in srgb,var(--on-deep) 16%,transparent)}
.hrows div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--on-deep) 10%,transparent)}
.hrows div:last-child{border-bottom:0;padding-bottom:0}
.hrows span{font-size:13px;color:color-mix(in srgb,var(--on-deep) 74%,transparent);font-weight:600}
.hrows b{font-size:16px;font-weight:800;color:var(--on-deep);white-space:nowrap}

/* Ingresos y gastos en filas */
.iol{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.iol-r{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;align-items:center;gap:10px;width:100%;padding:12px 12px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;font:inherit;color:inherit}
.iol-r:last-child{border-bottom:0}
.iol-r>span:first-child{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.iol-r b{font-size:16px;font-weight:800;white-space:nowrap}
.iol-r.tot{grid-template-columns:minmax(0,1fr) auto 14px;background:var(--bg)}
.chev{color:var(--ink-2);font-size:20px;line-height:1;font-weight:500;justify-self:end}
.per button{display:inline-flex;align-items:center;gap:5px}
.per .cal{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* Gráfico doble */
.dual .col{gap:2px;padding:0 2px}
.dual .col i{max-width:11px;flex:1;opacity:.5}
.dual .col[aria-pressed="true"] i{opacity:1}
.dual .ci{background:var(--grow)} .dual .ce{background:var(--spend)}
.col-cap2{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2)}
.col-cap2>span{display:flex;align-items:center;gap:6px;min-width:0}
.col-cap2 .cc-cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-cap2 .cc-cap::first-letter{text-transform:uppercase}
.col-cap2 b{color:var(--ink);font-size:14px;font-weight:800}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink-2);font-weight:600}
.leg>span{display:flex;align-items:center;gap:6px}
.leg-h{margin-left:auto;font-weight:500}

/* Secciones del resumen */
.sec-add{border:0;background:var(--surface-2)!important;color:var(--ink)!important;border-radius:6px;padding:5px 11px!important;font-size:12.5px!important;font-weight:700!important;margin-left:10px}
h2.sec .sec-tot+.sec-add{margin-left:10px}
.sec-note{margin-left:auto;font-size:11.5px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--ink-2)}
.rowbtn{cursor:pointer}
.rowbtn:active{background:var(--surface-2)}
.tx.rowbtn{gap:10px}
.tx .chev{margin-left:-2px}
.hint.center{text-align:center;margin:18px 0 0}

/* Inversiones desplegables */
details.acc{border-bottom:1px solid var(--line)}
details.acc:last-child{border-bottom:0}
details.acc>summary{list-style:none;cursor:pointer;border-bottom:0}
details.acc>summary::-webkit-details-marker{display:none}
.chev.rot{transition:transform .2s;transform:rotate(90deg)}
details.acc[open] .chev.rot{transform:rotate(-90deg)}
.acc-in{padding:0 0 8px 48px;display:flex;flex-direction:column}
.acc-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-top:1px dashed var(--line);background:none;padding:10px 0;text-align:left;font:inherit;color:inherit}
.acc-r .mid b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-r .mid span{font-size:12px;color:var(--ink-2)}
.acc-v{font-weight:700;font-size:13.5px;white-space:nowrap}

/* Menús de opciones */
.menu{display:flex;flex-direction:column;gap:8px}
.menu-r{display:grid;grid-template-columns:auto minmax(0,1fr) 14px;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:12px 14px;font:inherit;color:inherit}
.menu-r b{display:block;font-size:15px}
.menu-r small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.menu-ic{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,var(--mc) 15%,transparent);color:var(--mc)}
.menu-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Confirmación de borrado */
.confirm{text-align:center;padding-top:4px}
.confirm-ic{display:grid;place-items:center;width:56px;height:56px;border-radius:8px;margin:0 auto 12px;background:var(--spend-soft);color:var(--spend)}
.confirm-ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.confirm h3{text-wrap:balance}
.confirm .lead-s{margin:0 auto 16px;max-width:34ch}
.link-btn.del-link{align-self:center;margin-top:6px;padding:8px}
.widgets{opacity:.95}
.qa-b{min-width:0}
@media (max-width:370px){.qa{gap:6px}.qa-b{padding:11px 8px;font-size:14px;gap:6px}.qa-b.more{padding-inline:10px}h2.sec{flex-wrap:wrap;row-gap:6px}h2.sec .sec-tot{font-size:13px}.sec-add{padding:4px 9px!important}}


/* ---- Versión 2.2: resumen agrupado, filtros y registro más amable ---- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Moneda de referencia: solo RD$ y US$ */
.cur-seg{display:flex;background:var(--surface-2);border-radius:6px;padding:3px;gap:2px}
.cur-seg button{border:0;background:none;border-radius:6px;padding:5px 9px;font-size:12.5px;font-weight:800;color:var(--ink-2);line-height:1.1}
.cur-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
@media (max-width:360px){.cur-seg button{padding:5px 7px;font-size:12px}}

/* Mes y año */
.ym{display:flex;align-items:center;gap:4px}
.ym-arr{border:0;background:var(--surface-2);width:30px;height:32px;border-radius:6px;font-size:18px;line-height:1;color:var(--ink);padding:0}
.ym-arr:disabled{opacity:.35}
.ym-sel{position:relative;display:block}
.ym-sel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 24px 6px 10px;font-size:13.5px;font-weight:700;height:32px}
.ym-sel::after{content:"";position:absolute;right:9px;top:50%;width:6px;height:6px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.panel-h:has(.ym){flex-wrap:wrap;row-gap:10px}
.iol{margin-top:2px}
.flow-t{margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.flow-t b{color:var(--ink)}

/* Filtros del gráfico */
.chart-f{display:flex;flex-direction:column;gap:8px;margin:-2px 0 12px}
.chart-f .per{margin:0}
.leg-t{display:flex;gap:6px}
.leg-t button{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:none;border-radius:6px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.leg-t button[aria-pressed="true"]{border-style:solid;color:var(--ink);background:var(--surface)}
.leg-t button[aria-pressed="false"] .sw{opacity:.3}
.dual.dense .col{padding:0 .5px;gap:1px}
.dual.dense .col i{max-width:6px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sum3 div{background:var(--bg);border-radius:6px;padding:8px 10px;min-width:0}
.sum3 small{display:block;font-size:11px;color:var(--ink-2);font-weight:600}
.sum3 b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Dinero por moneda */
.cmix{display:grid;grid-template-columns:80px minmax(0,1fr);gap:16px;align-items:center}
.cmix-svg{width:80px;height:80px;display:block}
.cmix-t{font-family:var(--f-display);font-weight:800;font-size:15px;fill:var(--ink)}
.cmix-l{display:flex;flex-direction:column;gap:10px}
.cmix-r{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center}
.cmix-r .sw{width:10px;height:10px}
.cmix-n{font-size:13.5px;font-weight:700;min-width:0}
.cmix-n small{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.cmix-v{text-align:right;white-space:nowrap}
.cmix-v b{display:block;font-size:15px;font-weight:800}
.cmix-v small{font-size:11.5px;color:var(--ink-2);font-weight:600}

/* Grupos desplegables: grupo → entidad → cuenta */
.grps{display:flex;flex-direction:column;gap:10px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.grp>summary,.ent>summary{list-style:none;cursor:pointer}
.grp>summary::-webkit-details-marker,.ent>summary::-webkit-details-marker{display:none}
.grp-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto 14px;column-gap:12px;row-gap:6px;align-items:center;padding:14px}
.grp-h{grid-template-columns:auto minmax(0,1fr) 14px!important}
.grp-h .grp-ic{grid-row:1/3;align-self:start}
.grp-h .grp-v{grid-column:2/4;grid-row:2;text-align:left;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.grp-h .grp-v b{font-size:20px;font-family:var(--f-display);letter-spacing:-.02em}
.grp-h .cpills{margin:0;justify-content:flex-start}
.grp-v.card{flex-direction:column;align-items:flex-start;gap:3px}
.grp-k{font-size:11.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.grp-owe{font-size:13px;color:var(--ink-2);font-weight:600}
.grp-owe b{display:inline!important;font-family:var(--f-body)!important;font-size:13.5px!important;color:var(--spend);letter-spacing:0!important}
.owe-s{font-size:11.5px!important;color:var(--spend)!important;font-weight:700}
.it-k{display:none}
.last2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;min-width:0;display:flex;flex-direction:column}
.lcol.exp{border-top:3px solid var(--spend)}
.lcol.inc{border-top:3px solid var(--grow)}
.lcol-h{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px;font:inherit;font-size:13.5px;font-weight:800;color:var(--ink)}
.lcol-h>span{display:flex;align-items:center;gap:7px}
.lrow{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;font:inherit;color:inherit;min-width:0}
.lrow:last-child{border-bottom:0}
.lrow:active{background:var(--surface-2)}
.lrow b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow span{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow strong{font-size:14px;font-weight:800;margin-top:2px}
.lcol.exp .lrow strong{color:var(--spend)}
.lcol.inc .lrow strong{color:var(--grow)}
.lcol.inc{text-align:right}
.lcol.inc .lrow{align-items:flex-end;text-align:right}
.lrow b,.lrow span{max-width:100%}
.lempty{margin:0;padding:14px 12px;font-size:12.5px;color:var(--ink-2)}
.field label.via,.field label.cp{display:block;font-size:inherit;font-weight:inherit;color:var(--ink)}
.via-t b{color:var(--ink)}
.grp-ic{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 15%,transparent);color:var(--gc)}
.grp-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.grp-t{min-width:0}
.grp-t b{display:block;font-size:15.5px;font-weight:800}
.grp-t span{font-size:12.5px;color:var(--ink-2)}
.grp-v{text-align:right;min-width:0}
.grp-v b{display:block;font-size:16px;font-weight:800;white-space:nowrap}
.cpills{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;margin-top:3px}
.cpill{font-size:11px;font-weight:700;white-space:nowrap;border-radius:6px;padding:1px 6px;color:var(--ink);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.grp[open]>.grp-h{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--gc) 5%,var(--surface))}
.grp[open]>summary .chev.rot,.ent[open]>summary .chev.rot{transform:rotate(-90deg)}
.grp-in{padding:4px 12px 12px}
.ent{border-bottom:1px dashed var(--line)}
.ent-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto 14px;gap:10px;align-items:center;padding:11px 2px}
.ent-t{min-width:0}
.ent-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent-t span{font-size:12px;color:var(--ink-2)}
.ent-v{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ent-in{margin:0 0 10px 44px;border-left:2px solid var(--line);padding-left:10px}
.it-r{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;padding:9px 0;border-top:1px solid var(--line)}
.it-r:first-child{border-top:0}
.it-t b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-t span{font-size:11.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:3px 6px;align-items:center;margin-top:2px}
.it-v{text-align:right;white-space:nowrap}
.it-v b{display:block;font-size:13.5px;font-weight:800}
.it-v small{font-size:11px;color:var(--ink-2)}
.it-r .chev{font-size:17px}
.grp-add{display:block;width:100%;margin-top:10px;border:1.5px dashed var(--line);background:none;border-radius:6px;padding:10px;font-weight:700;font-size:13.5px;color:var(--gc)}
.grp-empty{margin:10px 2px 0}

/* Registro de gasto o ingreso */
.mv-top{margin-bottom:12px}
.kind-tog{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border-radius:8px;padding:4px}
.kind-tog button{border:0;background:none;border-radius:6px;padding:10px;font-weight:800;font-size:15px;color:var(--ink-2)}
.kind-tog button[data-kind="gasto"][aria-pressed="true"]{background:var(--spend);color:var(--surface)}
.kind-tog button[data-kind="ingreso"][aria-pressed="true"]{background:var(--grow);color:var(--surface)}
.form.mv{gap:16px}
.amt-box{border-radius:8px;padding:14px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1.5px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.amt-box>label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
.amt-row{display:flex;gap:8px;align-items:center}
.form .amt-row input{flex:1;min-width:0;border:0!important;background:none!important;font-family:var(--f-display);font-size:34px!important;font-weight:800;letter-spacing:-.02em;padding:2px 0!important;color:var(--ink);outline:none}
.cur-pick{display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px}
.cur-pick button{border:0;background:none;border-radius:7px;padding:4px 8px;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.cur-pick button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.amt-echo{display:block;min-height:1.2em;margin-top:6px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.amt-echo .bad{color:var(--spend)}
.vias{display:flex;flex-direction:column}
.via-g{display:flex;align-items:center;gap:8px;margin:10px 0 6px;font-size:12px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.via-g:first-child{margin-top:0}
.cflag{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--surface);background:var(--cc);border-radius:5px;padding:2px 5px}
.via-list{display:flex;flex-direction:column;gap:6px}
.via{position:relative;display:block}
.via input{position:absolute;opacity:0;inset:0;margin:0}
.via-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto 22px;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer}
.via-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.via-t small{font-size:12px;color:var(--ink-2)}
.via-a{text-align:right;white-space:nowrap}
.via-a b{display:block;font-size:13.5px;font-weight:800}
.via-a small{font-size:11px;color:var(--ink-2)}
.via-ok{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.via-ok svg{width:14px;height:14px;fill:none;stroke:var(--surface);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.via input:checked+.via-in{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.via input:checked+.via-in .via-ok{background:var(--accent);border-color:var(--accent)}
.via input:checked+.via-in .via-ok svg{opacity:1}
.via input:focus-visible+.via-in{outline:2px solid var(--market);outline-offset:2px}
.via-cash{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.via-cash svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.via-h{margin:8px 2px 0;font-size:12.5px;color:var(--ink-2)}
.cat-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cp{position:relative;display:block}
.cp input{position:absolute;opacity:0;inset:0;margin:0}
.cp span{display:flex;flex-direction:column;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 2px 8px;font-size:11.5px;font-weight:700;color:var(--ink-2);text-align:center;line-height:1.15;cursor:pointer;height:100%}
.cp i{font-style:normal;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--cc)}
.cp input:checked+span{border-color:var(--cc);color:var(--ink);background:color-mix(in srgb,var(--cc) 8%,var(--surface))}
.cp input:focus-visible+span{outline:2px solid var(--market);outline-offset:2px}
.date-pick{display:grid;grid-template-columns:auto auto 1fr;gap:6px}
.date-pick button{border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:0 14px;font-weight:700;font-size:14px;color:var(--ink-2)}
.date-pick button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.mv-save{position:sticky;bottom:0;box-shadow:0 -10px 16px 4px var(--surface)}
@media (max-width:360px){.cat-pick{grid-template-columns:repeat(3,1fr)}}


/* ---- Versión 2.3: crema, varios meses, evolución por moneda y lista única ---- */
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:2px}
.mgrid button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 0;font-size:13px;font-weight:700;color:var(--ink-2);text-transform:capitalize}
.mgrid button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.mgrid button:disabled{opacity:.35}
.mg-f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 12px}
.mg-l{font-size:13.5px;font-weight:800;color:var(--ink)}
.mg-all{border:0;background:none;color:var(--brand);font-weight:700;font-size:13px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.stk{padding:0 3px}
.stk-in{display:flex;flex-direction:column-reverse;gap:2px;width:100%;max-width:26px;border-radius:5px 5px 0 0;overflow:hidden;opacity:.6;transition:opacity .15s}
.stk[aria-pressed="true"] .stk-in{opacity:1}
.stk-in i{display:block;min-height:2px}
.mix-cap{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2)}
.mix-cap .mc-a{color:var(--ink)}
.mix-cap .mc-c{text-transform:capitalize}
.mix-note{margin:10px 0 0;font-size:13px;color:var(--ink-2);line-height:1.45}
.mix-note b{color:var(--ink)}
.mvp .per{margin:0}
.mv-pl{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}
.mv-per{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mv-per button{justify-content:center;padding-inline:6px}
.mvf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.mv-ent{flex:1;min-width:150px}
.mv-ent select{width:100%}
.mv-sum{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:12px 0 4px;padding:10px 12px;background:var(--bg);border-radius:6px;font-weight:800;font-size:14.5px}
.mv-sum .pos{text-align:right}
.mv-sum>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:370px){.mv-sum{font-size:13px;padding:9px 10px;gap:6px}.mv-per button{font-size:12px;padding-inline:4px}}
.mv-sum{grid-template-columns:1fr 1fr!important;row-gap:2px!important}
.mv-sum .mv-n{grid-column:1/-1;grid-row:1}
.mv-n{font-size:12px;font-weight:600;color:var(--ink-2);text-align:center}
.mv-list{display:flex;flex-direction:column;gap:6px}
.mv-day{display:flex;justify-content:center;margin:8px 0 2px}
.mv-day span{font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:3px 10px;text-transform:capitalize}
.mvr{display:flex;flex-direction:column;gap:1px;width:84%;border:0;border-radius:8px;padding:9px 12px;font:inherit;color:inherit}
.mvr.out{align-self:flex-start;align-items:flex-start;text-align:left;background:color-mix(in srgb,var(--spend) 9%,var(--surface));border-left:3px solid var(--spend);border-bottom-left-radius:4px}
.mvr.in{align-self:flex-end;align-items:flex-end;text-align:right;background:color-mix(in srgb,var(--grow) 10%,var(--surface));border-right:3px solid var(--grow);border-bottom-right-radius:4px}
.mvr b{font-size:14px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvr small{font-size:11.5px;color:var(--ink-2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvr strong{font-size:15.5px;font-weight:800;margin-top:2px}
.mvr.out strong{color:var(--spend)}
.mvr.in strong{color:var(--grow)}
.mvr:active{filter:brightness(.97)}


/* ---- Versión 2.4: selector de meses compacto y globo en el gráfico ---- */
.ym-pill{display:inline-flex;align-items:center;gap:7px;max-width:62%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink)}
.ym-pill svg{width:15px;height:15px;flex-shrink:0;fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round}
.ym-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ym-pill i{flex-shrink:0;width:6px;height:6px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:translateY(-2px) rotate(45deg)}
.mp-y{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0 12px}
.mp-y b{font-family:var(--f-display);font-size:22px;font-weight:800;min-width:64px;text-align:center}
.mgrid{grid-template-columns:repeat(4,1fr)}
.mgrid button{padding:11px 0;font-size:14px}
.mp-q{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.mp-q button{border:0;background:var(--surface-2);border-radius:6px;padding:9px 4px;font-size:13px;font-weight:700;color:var(--ink)}
#mpOk:disabled{opacity:.4}
.dual{position:relative}
.dual .cols{padding-top:58px;height:180px}
.dual.few .col i{max-width:22px}
.dtip{position:absolute;top:0;left:0;display:flex;flex-direction:column;gap:2px;min-width:132px;background:var(--ink);color:var(--bg);border-radius:6px;padding:7px 10px;font-size:12.5px;font-weight:700;box-shadow:0 8px 20px -10px rgb(0 0 0 / .5);pointer-events:none;transition:left .15s}
.dtip::after{content:"";position:absolute;bottom:-5px;left:calc(var(--ax,50%) - 5px);width:10px;height:10px;background:var(--ink);transform:rotate(45deg)}
.dtip .dt-c{font-size:11.5px;font-weight:600;opacity:.75}
.dtip .dt-c::first-letter{text-transform:uppercase}
.dtip span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.dtip i{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.dguide{position:absolute;top:62px;height:118px;width:0;border-left:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent);pointer-events:none;transition:left .15s}
.dnote{margin:8px 0 0;font-size:12px}
.dempty{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:28px 12px;border:1.5px dashed var(--line);border-radius:6px;background:var(--bg)}
.dempty b{font-size:14.5px}
.panel:has(.dempty) .chart-f,.panel:has(.dempty) .panel-h .seg{display:none}
.dempty span{font-size:13px;color:var(--ink-2);max-width:30ch}


/* ---- Globos de los gráficos: solo al tocar ---- */
.tipc{position:relative}
.tipc .cols{padding-top:66px;height:190px}
.dual .col i,.stk-in{opacity:1}
.tipc.picked .col:not([aria-pressed="true"]) i,.tipc.picked .stk:not([aria-pressed="true"]) .stk-in{opacity:.38}
.dguide{top:70px;height:120px}
/* ---- Nombres completos ---- */
.it-t b,.ent-t b,.grp-t b,.via-t b,.acc-r .mid b,.eg-h .mid b,.eg-r .mid b,.tx-main b,.mvr b,.cc-id b{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.25}
.it-t span{line-height:1.35}
.mvr b{max-width:100%}
/* ===== Guía inicial v2: neutra, un solo color de acción (azul = confianza) ===== */
.onb2{--accent:var(--brand)}
.onb2 .o-top{display:flex;align-items:center;gap:12px;min-height:44px}
.onb2 .o-back{width:44px;height:44px;margin-left:-10px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--ink);flex-shrink:0}
.onb2 .o-back svg,.onb2 .o-why svg,.onb2 .o-opt-ic svg,.onb2 .o-tick svg,.onb2 .o-done-ic svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.onb2 .o-back svg{width:24px;height:24px}
.onb2 .o-prog{flex:1;height:4px;border-radius:6px;background:var(--line);overflow:hidden}
.onb2 .o-prog i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .35s ease}
.onb2 .o-link{border:0;background:none;color:var(--ink-2);font-weight:600;font-size:15px;padding:12px 4px;min-height:44px}
.onb2 .o-top .o-link{margin-left:auto}
.onb2 .o-step{margin:22px 0 0;font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.onb2 h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,7.4vw,32px);letter-spacing:-.02em;line-height:1.12;margin:6px 0 8px;text-wrap:balance;outline:none;color:var(--ink)}
.onb2 .o-lead{color:var(--ink-2);margin:0 0 22px;font-size:16px;line-height:1.5;max-width:42ch}
.onb2 .form{gap:16px}
.onb2 .field label,.onb2 legend{font-size:14px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0}
.onb2 legend{margin-bottom:8px;padding:0}
.onb2 fieldset{border:0;margin:0;padding:0;min-width:0}
.onb2 input:not([type=checkbox]):not([type=radio]),.onb2 select{font-size:16px;min-height:50px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;width:100%}
.onb2 input:focus,.onb2 select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.onb2 input.o-big{font-size:22px;font-weight:600;min-height:60px}
.onb2 .pill span{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;min-height:48px;border-radius:6px}
.onb2 .pill input:checked+span{border-color:var(--brand);background:var(--brand-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--brand)}
.onb2 .pill input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.onb2 .o-chips{display:flex;flex-wrap:wrap;gap:8px}
.onb2 .o-chips .pill span{padding:0 16px;display:flex;align-items:center;min-height:44px;border-radius:6px}
/* Monto + moneda */
.onb2 .o-amt{display:flex;gap:8px;align-items:stretch}
.onb2 .o-amt input{flex:1;min-width:0;font-size:20px!important;font-weight:600;font-variant-numeric:tabular-nums}
.onb2 .o-cur{display:flex;background:var(--surface-2);border-radius:6px;padding:4px;gap:2px;flex-shrink:0}
.onb2 .o-cur button{border:0;background:none;border-radius:5px;padding:0 12px;font-weight:600;font-size:14px;color:var(--ink-2);min-width:52px}
.onb2 .o-cur button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
/* Bienvenida */
.onb2 .o-hello{padding-top:min(8vh,56px)}
.onb2 .o-logo{display:block;width:56px;height:56px;border-radius:8px;overflow:hidden;margin-bottom:22px}
.onb2 .o-logo svg{width:100%;height:100%}
.onb2 .o-hello h2{font-size:clamp(30px,8.4vw,36px);margin-top:0}
.onb2 .o-why{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.onb2 .o-why li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.onb2 .o-why li:last-child{border-bottom:1px solid var(--line)}
.onb2 .o-why svg{width:22px;height:22px;color:var(--ink-2);flex-shrink:0;margin-top:1px}
.onb2 .o-why b{display:block;font-size:15.5px;font-weight:600}
.onb2 .o-why span{font-size:14.5px;color:var(--ink-2);line-height:1.4}
.onb2 .o-alt{display:flex;flex-direction:column;align-items:center;gap:0;margin-top:14px}
.onb2 .o-alt .o-link{color:var(--brand);font-size:15px}
/* Pregunta Sí / No */
.onb2 .o-gate{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.onb2 .o-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:16px;min-height:64px;font-size:17px}
.onb2 .o-opt b{font-weight:600}
.onb2 .o-opt:active{border-color:var(--brand);background:var(--brand-soft)}
.onb2 .o-opt:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.onb2 .o-opt-ic{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.onb2 .o-opt-ic svg{width:20px;height:20px}
/* Elementos repetibles */
.onb2 .o-item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px}
.onb2 .o-item-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.onb2 .o-item-h b{font-size:15.5px;font-weight:600}
.onb2 .o-rm{border:0;background:none;color:var(--ink-2);font-size:14px;font-weight:600;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.onb2 .o-add{border:1.5px dashed var(--line);background:none;border-radius:8px;min-height:52px;font-weight:600;font-size:15px;color:var(--brand);width:100%}
.onb2 .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.onb2 .opt{font-weight:500;color:var(--ink-2)}
/* Pagos fijos */
.onb2 .o-fx{display:flex;flex-direction:column;gap:8px}
.onb2 .o-fx-r{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;transition:border-color .15s}
.onb2 .o-fx-r.on{border-color:var(--brand)}
.onb2 .o-fx-h{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;cursor:pointer;position:relative}
.onb2 .o-fx-h input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.onb2 .o-fx-h input:focus-visible~.o-fx-n{text-decoration:underline}
.onb2 .o-fx-ic{width:34px;height:34px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.onb2 .o-fx-ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.onb2 .o-fx-r.on .o-fx-ic{background:var(--brand-soft);color:var(--brand)}
.onb2 .o-fx-n{flex:1;font-size:15.5px;font-weight:500}
.onb2 .o-tick{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;flex-shrink:0}
.onb2 .o-tick svg{width:16px;height:16px;stroke-width:2.6}
.onb2 .o-fx-r.on .o-tick{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.onb2 .o-fx-in{padding:0 14px 14px}
/* Final */
.onb2 .o-done{padding-top:min(6vh,40px)}
.onb2 .o-done-ic{width:56px;height:56px;border-radius:50%;background:var(--grow-soft);color:var(--grow);display:grid;place-items:center;margin-bottom:18px}
.onb2 .o-done-ic svg{width:28px;height:28px;stroke-width:2.4}
.onb2 .o-done h2{margin-top:0}
.onb2 .o-sum{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 16px;margin-bottom:12px}
.onb2 .o-sum div{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:12px 0;font-size:15.5px}
.onb2 .o-sum div+div{border-top:1px solid var(--line)}
.onb2 .o-sum span{color:var(--ink-2)}
.onb2 .o-sum b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.onb2 .o-sum .tot b{font-size:18px;font-weight:700}
/* Pie fijo */
.onb2 .o-foot{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 80%,transparent);padding:20px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:14px;display:flex;flex-direction:column;align-items:stretch;gap:2px}
.onb2 .o-next{background:var(--brand);color:var(--surface);min-height:54px;font-size:16.5px;font-weight:700;border-radius:8px}
.onb2 .o-skip{align-self:center}
.onb2 .err:empty{display:none}
.onb2 .o-amt{flex-wrap:wrap}
.onb2 .o-amt .echo{order:3;flex-basis:100%}
.onb2 .echo{color:var(--ink-2);font-weight:500;font-size:13.5px}
.onb2 .echo.bad{color:var(--spend)}

/* ===== Confirmación de 5 segundos ===== */
.hc{text-align:center;padding-top:4px}
.hc-ic{display:grid;place-items:center;width:56px;height:56px;border-radius:8px;margin:0 auto 12px;background:var(--spend-soft);color:var(--spend)}
.hc-ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hc h3{text-wrap:balance}
.hc .lead-s{margin:0 auto 14px;max-width:36ch}
.hc-list{list-style:none;margin:0 auto 18px;padding:12px 16px;max-width:340px;text-align:left;background:var(--surface-2);border-radius:8px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.hc-list li::before{content:"·";font-weight:800;margin-right:8px;color:var(--ink-2)}
.hc-hold{position:relative;overflow:hidden;width:100%;min-height:58px;border-radius:8px;border:2px solid var(--spend);background:var(--surface);color:var(--spend);font-weight:700;font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hc-hold .hc-fill{position:absolute;inset:0;background:var(--spend-soft);transform:scaleX(0);transform-origin:left;pointer-events:none}
.hc-hold.on{color:var(--ink)}
.hc-hold span{position:relative;font-variant-numeric:tabular-nums}
.hc-hint{margin:8px 0 14px}
.hc-last{margin:0 0 10px;font-size:14.5px;font-weight:600;color:var(--spend)}
.hc-yes{width:100%;background:var(--spend);min-height:54px;margin-bottom:10px}
.hc-no{width:100%;min-height:50px}

/* ===== Ajustes ===== */
.set-g{margin:0 0 18px}
.set-g h4{margin:0 0 8px 4px;font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.set-card{background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:12px 14px;min-height:60px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.set-ic{width:36px;height:36px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.set-ic svg,.set-go svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.set-t{flex:1;min-width:0}
.set-t b{display:block;font-size:15.5px;font-weight:600;overflow-wrap:anywhere}
.set-t small{display:block;font-size:13.5px;color:var(--ink-2);margin-top:1px}
.set-go{color:var(--ink-2);opacity:.7;display:flex}
.set-row.danger b{color:var(--spend)}
.set-row.danger .set-ic{background:var(--spend-soft);color:var(--spend)}
.set-form{padding:4px 14px}
.set-f{padding:12px 0;display:flex;flex-direction:column;gap:8px}
.set-f+.set-f{border-top:1px solid var(--line)}
.set-f>label,.set-l{font-size:14px;font-weight:600;color:var(--ink)}
.set-f input:not([type]),.set-f input[inputmode]{font-size:16px;min-height:46px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;width:100%}
.set-f input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.set-f .seg{margin:0}
.set-f .seg label{flex:1;position:relative;display:block}
.set-f .seg input{position:absolute;opacity:0;inset:0;margin:0}
.set-f .seg span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:40px;border-radius:5px;font-size:14px;font-weight:600;color:var(--ink-2);padding:0 6px;line-height:1.2}
.set-f .seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.set-f .seg input:focus-visible+span{outline:2px solid var(--brand);outline-offset:1px}
.set-rate{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2)}
.set-rate span:first-child{white-space:nowrap}
.set-rate .set-rd{font-weight:600;color:var(--ink)}
.set-rate input{flex:1;min-width:0;font-variant-numeric:tabular-nums}
.set-msg{font-size:13px;color:var(--ink-2)}
.set-msg.bad{color:var(--spend)}
.set-sw{display:flex;align-items:center;gap:12px;position:relative;cursor:pointer}
.set-sw>span{flex:1}
.set-sw b{display:block;font-size:14px;font-weight:600}
.set-sw small{display:block;font-size:13.5px;color:var(--ink-2);font-weight:400}
.set-sw input{position:absolute;opacity:0;width:52px;height:32px;right:0;margin:0;cursor:pointer}
.set-sw i{width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;flex-shrink:0;transition:background .2s}
.set-sw i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .2s}
.set-sw input:checked+i{background:var(--brand)}
.set-sw input:checked+i::after{transform:translateX(20px)}
.set-sw input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}
#aPartnerF{margin-top:4px}
.set-ver{text-align:center;font-size:13px;color:var(--ink-2);margin:4px 0 0}
/* ===== Ingresos y Gastos: filtro de período, dona, desglose ===== */
.flt{padding:6px 14px 16px}
.flt-tabs{display:flex;justify-content:space-between;gap:2px;border-bottom:1px solid var(--line);margin:0 -4px}
.flt-tabs button{flex:1;border:0;background:none;padding:12px 2px 10px;font-size:14.5px;font-weight:600;color:var(--ink-2);border-bottom:2.5px solid transparent;margin-bottom:-1px;min-height:44px}
.flt-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.flt-tabs button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;border-radius:8px}
.flt-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 4px}
.flt-nav b{font-size:16px;font-weight:700;text-align:center;flex:1}
.flt-arr{width:44px;height:44px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--ink)}
.flt-arr svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.flt-arr:disabled{opacity:.25}
.flt-dates{margin:12px 0 4px}
.flt-dates label{min-width:0}
.flt-dates input{width:100%;font-size:14px;padding:8px 6px}
.bdn{position:relative;width:min(230px,66vw);margin:8px auto 4px}
.bdn svg{display:block;width:100%;height:auto}
.bdn-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22%}
.bdn-c b{font-family:var(--f-display);font-size:clamp(19px,6vw,24px);font-weight:800;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.bdn-c span{font-size:13px;color:var(--ink-2);margin-top:3px}
.flt-avg{text-align:center;font-size:13.5px;color:var(--ink-2);margin:4px 0 0}
.flt-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;min-height:48px;border:0;border-radius:8px;font-weight:700;font-size:15px;color:var(--surface)}
.flt-add.exp{background:var(--spend)}.flt-add.inc{background:var(--grow)}
.flt-add svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.cats2{display:flex;flex-direction:column;gap:8px}
.cat2{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cat2>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:62px;cursor:pointer}
.cat2>summary::-webkit-details-marker{display:none}
.cat2>summary .tx-ic{border-radius:50%;width:40px;height:40px}
.cat2-n{flex:1;min-width:0}
.cat2-n b{display:block;font-size:15.5px;font-weight:600;overflow-wrap:anywhere}
.cat2-n small{display:block;font-size:12.5px;color:var(--ink-2)}
.cat2-p{font-size:14px;color:var(--ink-2);min-width:38px;text-align:right}
.cat2-v{font-size:15.5px;font-weight:700;text-align:right;white-space:nowrap}
.cat2 .chev.rot{transform:none}
.cat2[open]>summary .chev.rot{transform:rotate(90deg)}
.cat2-in{border-top:1px solid var(--line);padding:2px 14px}
.cat-it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:11px 0;min-height:52px}
.cat-it+.cat-it{border-top:1px solid var(--line)}
.cat-it-t{flex:1;min-width:0}
.cat-it-t b{display:block;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.cat-it-t small{display:block;font-size:12.5px;color:var(--ink-2)}
.cat-it-v{font-size:14.5px;font-weight:600;text-align:right;white-space:nowrap}
.cat-it-v small{display:block;font-size:12px;color:var(--ink-2);font-weight:500}
.pd-list{margin-bottom:8px;background:var(--surface)}
.pd-list .set-ic{font-size:20px;font-weight:600}
/* ===== «¿Ya cobraste?» ===== */
.payq{background:var(--surface);border:1.5px solid color-mix(in srgb,var(--grow) 45%,var(--line));border-radius:8px;padding:14px;margin-top:12px}
.payq-t{display:flex;gap:12px;align-items:center}
.payq-ic{width:42px;height:42px;border-radius:6px;background:var(--grow-soft);color:var(--grow);display:grid;place-items:center;flex-shrink:0}
.payq-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.payq-t b{display:block;font-size:16px;font-weight:700}
.payq-t span{display:block;font-size:13.5px;color:var(--ink-2);margin-top:1px}
.payq-b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.payq-b .btn{min-height:46px;padding:10px}
.payq-b .btn:not(.ghost){background:var(--grow)}
.payq-skip{display:block;margin:10px auto 0;color:var(--ink-2);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.payq .hint{text-align:center;margin:6px 0 0}
/* ===== Guía: notas y casillas ===== */
.onb2 .o-note{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:14px;color:var(--ink-2);line-height:1.45}
.onb2 .o-note svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;fill:none;stroke:var(--brand);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.onb2 .o-note b{color:var(--ink);font-weight:600}
.onb2 .o-chk{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink);margin-top:10px;font-weight:500!important}
.onb2 .o-chk input{width:22px;height:22px;accent-color:var(--brand);flex-shrink:0;min-height:0!important}
/* ===== Retiro / transferencia ===== */
.kind-tog.neutral button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.kind-tog.neutral button{font-weight:700;font-size:14px}
.tr-to{display:flex;align-items:center;gap:12px;margin:0;padding:12px;border-radius:8px;background:var(--surface-2);font-size:14.5px}
.tr-to b{font-weight:700}
.o-amtline{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:6px;padding:0 12px;background:var(--surface)}
.o-amtline span{font-weight:700;color:var(--ink-2)}
.o-amtline input{border:0!important;background:none!important;flex:1;min-width:0;font-size:20px;font-weight:700;padding:12px 0!important;outline:none}
.mvr.mid{align-self:center;align-items:center;text-align:center;background:var(--surface-2);border-radius:8px}
.mvr.mid strong{color:var(--ink);font-weight:700}
.o-amtline .echo{display:none}
/* ===== Calendario de pagos ===== */
.cal-sum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);margin:2px 0 10px}
.cal-sum b{color:var(--ink);font-weight:700}
.cal-sum em,.cal-day em{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
em.o{background:var(--spend)}em.n{background:var(--grow)}
.cal-list{display:flex;flex-direction:column}
.cal-r{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:10px 0;min-height:56px}
.cal-r+.cal-r{border-top:1px solid var(--line)}
.cal-r.done{opacity:.55}
.cal-d{width:40px;flex-shrink:0;text-align:center;line-height:1.05}
.cal-d b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.cal-d small{font-size:11.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}
.cal-ic{width:34px;height:34px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;flex-shrink:0}
.cal-ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cal-t{flex:1;min-width:0}
.cal-t b{display:block;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.cal-t small{display:block;font-size:12.5px;color:var(--ink-2)}
.cal-v{font-size:14.5px;font-weight:700;white-space:nowrap;text-align:right}
.cal-r.out .cal-v{color:var(--spend)}.cal-r.in .cal-v{color:var(--grow)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-wd{text-align:center;font-size:12px;font-weight:600;color:var(--ink-2);padding:4px 0}
.cal-day{border:0;background:none;border-radius:6px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.cal-day i{display:flex;gap:3px;height:6px}
.cal-day em{width:6px;height:6px;margin:0}
.cal-day.today span{font-weight:800;color:var(--brand)}
.cal-day[aria-pressed="true"]{background:var(--brand);color:var(--surface)}
.cal-day[aria-pressed="true"] span{color:var(--surface)}
.cal-day[aria-pressed="true"] em{box-shadow:0 0 0 1.5px var(--surface)}
.cal-dh{margin:14px 0 2px;font-weight:700;font-size:15px}
.inst.logo{background:#fff;border-radius:6px;padding:5px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .1);overflow:hidden}
.inst.logo img{display:block;width:100%;height:100%;object-fit:contain}
.inst.logo.tile{padding:0}
.inst.logo.sm{padding:4px;border-radius:6px}.inst.logo.sm.tile{padding:0}
.int-ic{background:var(--grow-soft);color:var(--grow)}.int-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.intc{border-color:color-mix(in srgb,var(--grow) 35%,var(--line))}
#intTot{color:var(--grow)}
.int-note{margin:8px 0 10px}

/* ===== Teléfono: Mercado y Metas van dentro de «Más» ===== */
nav.tabs [data-tab="mercado"],nav.tabs [data-tab="metas"],nav.tabs .side-brand,nav.tabs .side-x{display:none}
.res-g,.col-a,.col-b,.flowg,.fg-a,.fg-b,.fg-c{min-width:0}
/* ===== Laptop y computadora ===== */
@media (min-width:1000px){
  body{background:var(--bg)}
  nav.tabs{top:0;bottom:0;right:auto;width:248px;border-top:0;border-right:1px solid var(--line);box-shadow:none;background:var(--surface);display:flex;flex-direction:column;padding:22px 14px;overflow-y:auto}
  nav.tabs .side-brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-family:var(--f-display);font-size:19px;letter-spacing:-.02em}
  nav.tabs .side-brand .rd{color:#CE1126}
  .side-logo{width:32px;height:32px;border-radius:5px;overflow:hidden;flex-shrink:0;display:block}
  .side-logo svg{width:100%;height:100%;display:block}
  .side-beta{margin-left:auto;font-family:var(--f-body,inherit);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#B4530A;background:#FBEBD9;padding:3px 8px;border-radius:6px}
  nav.tabs .inner{display:flex!important;flex-direction:column;gap:2px;max-width:none;margin:0}
  nav.tabs .inner button,nav.tabs .side-x button{flex-direction:row!important;justify-content:flex-start;gap:12px!important;padding:10px 12px!important;font-size:15px!important;font-weight:600!important;border-radius:6px;min-height:46px;text-align:left;width:100%}
  nav.tabs .inner button:hover,nav.tabs .side-x button:hover{background:var(--surface-2)}
  nav.tabs [data-tab="mercado"],nav.tabs [data-tab="metas"]{display:flex}
  nav.tabs [data-tab="mas"]{display:none!important}
  nav.tabs .ic{width:34px!important;height:34px!important;border-radius:10px!important;flex-shrink:0}
  nav.tabs button[aria-selected="true"]{background:var(--tcs);font-weight:700!important}
  nav.tabs button[aria-selected="true"] .ic{background:none}
  nav.tabs .side-x{display:flex;flex-direction:column;gap:2px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
  nav.tabs .side-x button{border:0;background:none;color:var(--ink-2);display:flex;align-items:center}
  nav.tabs .side-x svg{width:20px;height:20px;margin:0 7px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .app{max-width:none;margin:0 0 0 248px;padding:0 40px 56px}
  header.top{max-width:1240px;margin:0 auto;padding-block:22px 14px}
  header.top .brand-mark{display:none}
  #notice,#view{max-width:1240px;margin-left:auto;margin-right:auto}
  #view.v-ahorros,#view.v-prestamos,#view.v-mercado,#view.v-metas{max-width:820px}
  .res-g{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
  .col-b>.panel:first-child,.col-b>.sec:first-child{margin-top:0}
  .col-a .qa{margin-top:0}
  .flowg{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);grid-template-areas:"a b" "c b";gap:0 24px;align-items:start}
  .fg-a{grid-area:a}.fg-b{grid-area:b}.fg-c{grid-area:c}
  .fg-b>.sec:first-child{margin-top:14px}
  .scrim{align-items:center;padding:24px}
  .sheet{max-width:540px;border-radius:10px;max-height:min(86vh,900px);padding-bottom:24px;animation:none;box-shadow:0 30px 80px -20px rgb(0 0 0 / .45)}
  .sheet .grab{display:none}
  .onb{background:var(--surface-2)}
  .onb-in{max-width:620px;background:var(--bg);margin:32px auto;min-height:calc(100% - 64px);border-radius:28px;padding:28px 40px!important;box-shadow:0 20px 60px -30px rgb(0 0 0 / .35)}
  .onb2 .o-foot{bottom:-28px;padding-bottom:28px}
  .toast{left:calc(50% + 124px)!important;bottom:32px!important}
}
@media (min-width:1400px){.app{padding:0 56px 64px}.res-g{gap:32px}}

/* ===== Pulido: tamaños mínimos, zonas de toque y contraste ===== */
html:has(#layer .scrim),html:has(#layer .scrim) body{overflow:hidden}
.g-btn{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 1px 2px rgb(0 0 0 / .06)}
.g-btn:hover{background:var(--surface-2)}
.or-sep{display:flex;align-items:center;gap:12px;margin:2px 0;color:var(--ink-2);font-size:13px}
.or-sep::before,.or-sep::after{content:"";flex:1;height:1px;background:var(--line)}
/* texto: nada por debajo de 12 px */
.mvr small,.it-t span,.cal-d small,.cmix-n small,.cmix-v small,.owe-s,.eg-v small,.eg-a small,.cp span,.it-v small,.via-a small,.ml-row small{font-size:12.5px}
.mv-day span,.cpill,.ty,.col-l span,.notice .tag,.ptag,.cflag,.brand small,#brandSmall,.sec-note{font-size:12px}
nav.tabs button{font-size:12px}
/* toque: controles secundarios ≥ 36 px, botones de ícono ≥ 40 px */
.icon-btn,.addb{min-width:40px;min-height:40px}
.cur-seg button{min-height:34px;padding-inline:10px}
.seg button,.seg.tiny button,.seg-mini button,.per button,.leg-t button,.cur-pick button{min-height:36px}
.ym-pill,.mini-btn,.pcta{min-height:38px}
.ym-sel select,.pend-act select{min-height:40px}
.ym-arr{min-width:40px;min-height:40px}
.notice button{padding:10px 0 10px 12px}
.pclose,.x{position:relative}
.pclose::after,.x::after{content:"";position:absolute;inset:-8px}
/* contraste: letras oscuras sobre fondos de color suave */
.tx-ic:not(.int-ic):not(.inc){color:var(--ink)!important}
.ty{color:color-mix(in srgb,var(--tc) 38%,var(--ink));background:color-mix(in srgb,var(--tc) 18%,transparent)}
.cflag{color:var(--ink);background:color-mix(in srgb,var(--cc) 26%,var(--surface))}
.cp i{color:color-mix(in srgb,var(--cc) 35%,var(--ink))}
.due.soon,.soonc{color:var(--spend)}
.onb-cta{background:var(--brand)}
small.owe-s,.due,.grp-k,.mv-pl,.inbox-h .tag,.hero-pulse,.cc-bal small,.grp-v small{font-size:12px}
.due.soon{font-weight:700;color:color-mix(in srgb,var(--spend) 85%,var(--ink))}

/* ================================================================
   IDENTIDAD «CAOBA»
   La caoba es el árbol nacional: madera que dura y crece despacio.
   Fondo crema, tinta de madera, caoba para la marca y las acciones,
   hoja para lo que crece. Las tarjetas protagonistas llevan los anillos
   del tronco. Una sola familia: Plus Jakarta Sans (800 marca y títulos,
   500 textos).
   ================================================================ */

body{font-family:var(--f-body);font-size:15.5px;font-weight:500;letter-spacing:-.003em}
button,input,select,textarea{font-family:inherit}
b,strong{font-weight:700}
.num,.big,.grp-v b,.cat2-v,.bdn-c b,.cal-v,.cal-d b,.iol-r b,.hrows b,.mvr strong,.it-v b,.ent-v,.o-sum b,.via-a b{font-variant-numeric:tabular-nums;font-stretch:normal}
.brand h1,h1.view-title,.sheet h3,.onb h2,.onb2 h2,.panel-h>b,.grp-t b,.payq-t b,.set-g h4,.cal-dh{font-family:var(--f-display);font-stretch:normal;letter-spacing:-.02em}
.brand h1{font-weight:800;font-size:22px}
.sheet h3{font-weight:800;font-size:21px}
.panel-h>b{font-weight:800;font-size:15.5px}
h2.sec{text-transform:none;letter-spacing:-.015em;font-size:17px;font-weight:800;color:var(--ink);margin:28px 0 10px;padding:0;border:0;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h2.sec .sec-note{font-weight:500;font-size:12.5px;color:var(--ink-2)}
.brand small,#brandSmall,.tag,.grp-k,.via-g,.mv-pl,.cal-d small,.badge,.hero-pulse,.ptag,.side-beta,.soon-badge,.rowcard-h,.sub-h{text-transform:none;letter-spacing:0}
.brand small,#brandSmall{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.via-g,.mv-pl,.grp-k{font-weight:700;color:var(--ink-2)}

/* ---- Marca ---- */
.brand-mark,.side-logo{width:34px;height:34px;border-radius:9px;overflow:hidden;box-shadow:none;background:none;flex:none}
.brand-mark svg,.side-logo svg{width:100%;height:100%;display:block;stroke:none}
.wordmark{font-family:var(--f-display);font-weight:800;letter-spacing:-.04em;color:var(--ink)}

/* ---- Tarjetas protagonistas: anillos del tronco ---- */
.deep{--bill:var(--b-resumen);--glow:var(--hoja-c);--d1:var(--bill);--d2:var(--bill);
  border-radius:20px;padding:20px 20px 18px;color:var(--on-deep);background-color:var(--bill);
  background-image:repeating-radial-gradient(ellipse 120% 100% at 108% -18%,transparent 0 13px,rgb(255 255 255 / .06) 13px 14px,transparent 14px 23px,rgb(0 0 0 / .07) 23px 24.5px);
  box-shadow:none}
.deep::after{display:none}
#view.v-ingresos .deep{--bill:var(--b-ingresos)}#view.v-gastos .deep{--bill:var(--b-gastos)}#view.v-ahorros .deep{--bill:var(--b-ahorros)}
#view.v-prestamos .deep{--bill:var(--b-prestamos)}#view.v-mercado .deep{--bill:var(--b-mercado)}
.deep.hero.neg,.hero.brandc.neg{--bill:var(--b-gastos)}
.deep .lbl{font-size:13px;font-weight:600;color:color-mix(in srgb,var(--on-deep) 82%,transparent)}
.deep .big{font-family:var(--f-display);font-weight:800;font-size:var(--bs,clamp(34px,10.5vw,46px));letter-spacing:-.035em;line-height:1.02;margin-top:8px}
.deep .big .dec{font-size:.48em;font-weight:700;color:color-mix(in srgb,var(--on-deep) 70%,transparent)}
.deep .glow{color:var(--hoja-c)}
.hrows{margin-top:16px;border-top:1px solid color-mix(in srgb,var(--on-deep) 26%,transparent)}
.hrows div{border-bottom:1px solid color-mix(in srgb,var(--on-deep) 14%,transparent)}
.hrows div:last-child{border-bottom:0}
.hrows b{font-size:17px;font-weight:700}
.seg-mini{background:color-mix(in srgb,var(--on-deep) 12%,transparent);border:0;border-radius:999px;padding:3px}
.seg-mini button{border-radius:999px}
.addb{border-radius:12px;box-shadow:none;background:var(--on-deep);color:var(--bill)}
.ccard{border-radius:16px;background-image:repeating-radial-gradient(ellipse 120% 100% at 108% -18%,transparent 0 13px,rgb(255 255 255 / .07) 13px 14px),linear-gradient(135deg,var(--c1),var(--c2))}
.ccard::after{display:none}

/* ---- Paneles y listas ---- */
.panel,.grp,.cat2,.set-card,.item,.tile,.cats,.tx-group,.month,.inbox,.plan-x,.news,.sim,.os,.payq,.o-item,.rowcard,.chk-row{border-radius:var(--r-card);box-shadow:none}
.panel{padding:16px;background:var(--surface);border:1px solid var(--line)}
.iol{border-radius:12px}
.iol-r.tot{background:var(--surface-2)}
.flow2{border-radius:999px;height:8px}
.cat2>summary .tx-ic,.tx-ic,.grp-ic,.set-ic,.cal-ic,.menu-ic,.payq-ic,.o-fx-ic,.feat .ic{border-radius:11px}
.grp-ic,.set-ic,.cal-ic,.menu-ic{background:color-mix(in srgb,currentColor 11%,transparent);box-shadow:none}
.grp-ic{color:var(--gc)}
.inst.logo,.inst.logo.sm{border-radius:10px}
.inst.banco,.inst.asoc,.inst.bolsa,.inst.afi,.inst.gov{border-radius:10px;clip-path:none;box-shadow:none}
.cpill{border-radius:999px;background:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 55%,var(--line));font-weight:600}
.tag,.count,.ty,.cflag,.pill-beta{border-radius:999px}
.count{background:var(--brand);color:var(--surface)}
.mvr{border-radius:14px;padding:8px 12px;width:88%}
.mvr.out{border-left:0}.mvr.in{border-right:0}
.mv-day span{font-weight:700;color:var(--ink-2)}

/* ---- Controles ---- */
.btn{border-radius:var(--r-ctl);font-weight:700;letter-spacing:0}
.qa-b{border-radius:14px;font-weight:700}
.qa-b.more{background:none;border:1.5px solid var(--line)}
.qa-ic{border-radius:8px}
.seg,.kind-tog,.cur-seg,.o-cur{border-radius:999px;background:var(--surface-2);box-shadow:none;padding:3px}
.seg button,.cur-seg button,.kind-tog button,.o-cur button,.set-f .seg span{border-radius:999px}
.seg button[aria-pressed="true"],.cur-seg button[aria-pressed="true"],.set-f .seg input:checked+span,.o-cur button[aria-checked="true"],.kind-tog.neutral button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(14 44 68 / .18)}
.per button,.per.light button,.date-pick button,.mp-q button{border-radius:999px}
.per.light button[aria-pressed="true"],.date-pick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.icon-btn{border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.ym-pill{border-radius:999px;background:var(--surface-2)}
.form input:not([type=checkbox]),.form select,.form textarea,.onb2 input:not([type=checkbox]):not([type=radio]),.onb2 select,.set-f input{border-radius:var(--r-in);border-width:1.5px;background:var(--surface)}
.pill span,.onb2 .pill span,.onb2 .o-chips .pill span,.cp span,.via-in{border-radius:999px}
.grp-add,.o-add,.onb2 .o-add,.add-row{border-radius:12px;border-style:dashed;border-width:1.5px}
.sheet{border-radius:22px 22px 0 0;box-shadow:0 -1px 0 var(--line)}
.grab{border-radius:999px;height:4px;width:40px;background:var(--line)}
.toast{border-radius:12px;font-weight:600}
.alert{border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.alert .count{background:var(--brand);color:var(--surface)}
.alert>span:last-child{color:var(--ink-2)}
.onb-cta{border-radius:16px;background:var(--brand);color:var(--surface)}
.amt-box{border-radius:14px;background:none;border:2px solid var(--accent)}
.flt-tabs button[aria-selected="true"]{border-bottom-color:var(--brand);font-weight:800}
.flt-add,.hc-hold,.hc-yes,.onb2 .o-next{border-radius:var(--r-ctl)}
.onb2 .o-prog,.onb2 .o-prog i{border-radius:999px;height:4px}
.onb2 .o-prog i{background:var(--hoja)}
.onb2 .pill input:checked+span,.pill input:checked+span{border-color:var(--brand);background:var(--brand);color:var(--surface);box-shadow:none}
.onb2 .o-opt{border-radius:14px}
.cal-day{border-radius:10px}
.cal-day[aria-pressed="true"]{background:var(--brand);color:var(--surface)}
.cal-day[aria-pressed="true"] span{color:var(--surface)}
.dtip{border-radius:10px}

.mc-add input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink)}

.mw-add input[inputmode="numeric"]{flex:0 0 72px}
.bud-new{margin-top:14px}.bud-new label{font-size:13px;font-weight:700;color:var(--ink-2)}
.mw{display:flex;flex-direction:column;gap:8px}
/* notificación del ejemplo */
.notice.ex{background:color-mix(in srgb,var(--grow) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--grow) 30%,var(--line));border-radius:14px;padding:10px 12px;color:var(--ink)}
.notice.ex .ex-t{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
.notice.ex button{text-decoration:none;background:var(--grow);color:var(--surface);border-radius:999px;padding:8px 14px;min-height:38px;align-self:center}
/* árbol */
.tree{display:block;overflow:visible}
.t-gr{fill:var(--hoja-c);opacity:.45}
.t-tr{fill:var(--trunk)}
.t-br{fill:none;stroke:var(--trunk);stroke-width:3.2;stroke-linecap:round}
.t-l1{fill:var(--leaf1)}.t-l2{fill:var(--leaf2)}.t-l3{fill:var(--leaf3)}.t-h{fill:var(--hoja-c);opacity:.75}
.tp{transform-box:fill-box;transform-origin:50% 100%}
.tp-l,.tp-h{transform-origin:50% 60%}
.tp-b path{stroke-dasharray:40;stroke-dashoffset:0}
.tg{animation:tgrow .55s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:var(--d)}

.tg.tp-b{animation:none}
@keyframes tgrow{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
@keyframes tdraw{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .4s}
#splash.out{opacity:0;pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:10px}
.sp-tree{width:min(46vw,190px);height:auto}
.sp-tree .tp{animation:tgrow .6s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i) * .11s)}
.sp-tree .tp-k{animation:tgrowY .7s cubic-bezier(.3,.8,.3,1) both}
.sp-tree .tp-g{animation:fadeIn .4s both}
.sp-tree .tp-b{animation:none}.sp-tree .tp-b path{animation:tdraw .5s ease-out both;animation-delay:calc(var(--i) * .11s)}
@keyframes tgrowY{from{transform:scaleY(0)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sp-word{display:flex;flex-direction:column;align-items:center;gap:2px;animation:spw .6s ease-out 1.25s both}
.sp-name{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.04em;color:var(--ink)}
.sp-slogan{font-size:14.5px;color:var(--ink-2);font-weight:500}
@keyframes spw{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* bienvenida */
.onb.wel{background:var(--bg)}
.wel-in{max-width:440px;margin:0 auto;padding:max(28px,env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;min-height:100%}
.wel-brand{display:flex;align-items:center;gap:10px}
.wel-logo{width:44px;height:44px;border-radius:12px;overflow:hidden;display:block}.wel-logo svg{width:100%;height:100%;display:block}
.wel-brand .wordmark{font-size:28px}
.wel h2{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8.4vw,36px);line-height:1.08;letter-spacing:-.035em;margin:26px 0 10px;color:var(--ink);text-wrap:balance}
.wel h2:focus{outline:none}
.wel-lead{font-size:16px;color:var(--ink-2);margin:0 0 20px;line-height:1.45}
.wel-f{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:12px}
.wel-f li{display:flex;gap:12px;align-items:flex-start}
.wel-f b{display:block;font-size:15px;color:var(--ink)}
.wel-f li>span:last-child{font-size:13.5px;color:var(--ink-2);line-height:1.35}
.wel-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--grow) 13%,transparent);color:var(--grow);flex-shrink:0}
.wel-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wel-act{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.sso{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:54px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;font-weight:700;font-size:16px;padding:0 16px}
.sso svg{width:22px;height:22px;flex-shrink:0}
.sso:hover{background:var(--surface-2)}
.wel-start{min-height:56px;font-size:16px;margin-top:6px}
.wel-or{display:flex;align-items:center;gap:12px;margin:4px 0 0;color:var(--ink-2);font-size:13px}
.wel-or::before,.wel-or::after{content:"";flex:1;height:1px;background:var(--line)}
.wel-solo{width:100%;min-height:52px;border:1.5px solid var(--brand);background:none;color:var(--brand);border-radius:14px;font-weight:700;font-size:15.5px;padding:0 14px}
.wel-solo:hover{background:var(--brand-soft)}
.sso svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.wel-note{margin:-2px 0 0;font-size:12.5px;color:var(--ink-2);text-align:center;line-height:1.4}
.wel-demo{align-self:center;font-weight:700;font-size:15px;padding:10px}
.wel-pw{align-self:center;font-size:13.5px;color:var(--ink-2);padding:6px}
.btn svg{width:20px;height:20px;vertical-align:-4px;margin-right:8px}
/* guía con árbol */
.o-grow{flex:1;display:flex;justify-content:center}
.o-tree{width:56px;height:56px}
.o-tree.big{width:150px;height:150px}
.onb2 .o-top{min-height:60px}
.o-enter{animation:oin .35s ease-out both}
@keyframes oin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.o-how{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.o-watch{display:flex;flex-direction:column;gap:8px}
.o-w{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer}
.o-w:has(input[type=checkbox]:checked){border-color:var(--grow);background:color-mix(in srgb,var(--grow) 6%,var(--surface))}
.o-w input[type=checkbox]{width:18px;height:18px;accent-color:var(--grow);flex-shrink:0}
.o-w-t{flex:1;min-width:0}.o-w-t b{display:block;font-size:14.5px}.o-w-t small{display:block;font-size:12px;color:var(--ink-2)}
.o-w .o-w4,.onb2 .o-w input.o-w4{width:78px!important;flex:0 0 78px;border:1.5px solid var(--line);border-radius:8px;padding:8px!important;font-size:15px;text-align:center}
.lp-o span{text-align:left}
.o-wadd{margin-top:8px;display:flex;flex-direction:column;gap:10px}
.o-lcalc{margin-top:4px}
.mc-hero{display:flex;justify-content:center}.mc-tree{width:90px;height:90px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;background:var(--surface)}
/* recorrido */
html.tour-open{overflow:hidden}
#tour{position:fixed;inset:0;z-index:90}
.tour-hole{position:fixed;border-radius:16px;box-shadow:0 0 0 2px var(--crema),0 0 0 9999px rgb(14 44 68 / .62);transition:all .25s ease;pointer-events:none}
