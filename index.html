<!doctype html>
<html lang="es-DO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InvierteRD</title>
<meta name="description" content="Tus gastos, ahorros, tarjetas, préstamos e inversiones en un solo lugar.">
<meta name="theme-color" content="#F3F6F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08110F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="InvierteRD">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna tipo teléfono. El dinero vive en el tercio superior (lectura); las acciones viven abajo, en la zona del pulgar (barra + botón flotante). */
:root{
  /* Neutros fríos con un toque verde: limpios y confiables */
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#E8EFEC; --ink:#0A1A17; --ink-2:#4E625C; --line:#DAE4E0;
  /* Semántica financiera: esmeralda = crecer, coral = dinero que sale, ámbar = deuda, índigo = mercado */
  --grow:#00936A; --grow-soft:#D9F4E9; --spend:#E44D3A; --spend-soft:#FFE5DF;
  --debt:#C27C00; --debt-soft:#FFEFCF; --market:#4A4FDE; --market-soft:#E6E7FC;
  /* Pantallas protagonistas: cada sección tiene su tono profundo y su brillo */
  --grow-deep:#04382B; --grow-deep2:#0B6B4F; --grow-glow:#7CF2C4;
  --spend-deep:#4A1410; --spend-deep2:#9A3022; --spend-glow:#FFB4A4;
  --debt-deep:#3B2604; --debt-deep2:#7D5208; --debt-glow:#FFD27A;
  --on-deep:#FFFFFF;
  --cart1a:#0D2944; --cart1b:#1E5D93; --cart2a:#2A1242; --cart2b:#6B2D8C; --cart3a:#05302A; --cart3b:#137059; --cart4a:#3A1A0A; --cart4b:#8C4C13;
  --promo-deep:#1B1C57; --promo-deep2:#4337B8; --promo-glow:#C3B8FF;
  /* Distintivos de institución por sector */
  --i-banco:#3A45C2; --i-asoc:#0B8577; --i-afi:#7D3BC4; --i-gov:#3E5560; --i-ink:#FFFFFF;
  --widget:#04382B; --widget-ink:#EAFBF4; --widget-accent:#7CF2C4;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:24px; --r-md:16px; --r-sm:11px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08110F; --surface:#101C19; --surface-2:#182824; --ink:#E6F2EE; --ink-2:#93AAA3; --line:#20332D;
  --grow:#2FD39F; --grow-soft:#0F3529; --spend:#FF7A64; --spend-soft:#3A1913;
  --debt:#F0B341; --debt-soft:#36270C; --market:#8F96FF; --market-soft:#1E214D;
  --grow-deep:#06322A; --grow-deep2:#0D5A44; --grow-glow:#6EF0BD;
  --spend-deep:#3A120E; --spend-deep2:#7A2519; --spend-glow:#FFB09E;
  --debt-deep:#2F1F05; --debt-deep2:#664309; --debt-glow:#FFD27A;
  --i-banco:#5560E0; --i-asoc:#14A08F; --i-afi:#9555DB; --i-gov:#56717D;
  --promo-deep:#17174A; --promo-deep2:#3A2F9E; --promo-glow:#C3B8FF;
  --widget:#06322A; --widget-ink:#E8FAF2; --widget-accent:#6EF0BD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08110F; --surface:#101C19; --surface-2:#182824; --ink:#E6F2EE; --ink-2:#93AAA3; --line:#20332D;
  --grow:#2FD39F; --grow-soft:#0F3529; --spend:#FF7A64; --spend-soft:#3A1913;
  --debt:#F0B341; --debt-soft:#36270C; --market:#8F96FF; --market-soft:#1E214D;
  --grow-deep:#06322A; --grow-deep2:#0D5A44; --grow-glow:#6EF0BD;
  --spend-deep:#3A120E; --spend-deep2:#7A2519; --spend-glow:#FFB09E;
  --debt-deep:#2F1F05; --debt-deep2:#664309; --debt-glow:#FFD27A;
  --i-banco:#5560E0; --i-asoc:#14A08F; --i-afi:#9555DB; --i-gov:#56717D;
  --promo-deep:#17174A; --promo-deep2:#3A2F9E; --promo-glow:#C3B8FF;
  --widget:#06322A; --widget-ink:#E8FAF2; --widget-accent:#6EF0BD; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--market);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand-mark{width:30px;height:30px;border-radius:10px;background:var(--grow);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px;stroke:var(--surface);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.top-actions{display:flex;gap:8px;align-items:center}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.notice{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);margin-block:0 12px}
.notice b{color:var(--ink)}
.notice button{margin-left:auto;flex-shrink:0;border:0;background:none;color:var(--ink);font-weight:700;font-size:13px;text-decoration:underline;padding:0}

h1.view-title{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.025em;margin:6px 0 4px;text-wrap:balance}
.view-sub{color:var(--ink-2);font-size:14px;margin:0 0 16px}
h2.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:700;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec button{border:0;background:none;text-transform:none;letter-spacing:0;font-size:13px;font-weight:700;color:var(--accent,var(--market));padding:0}

/* Hero: el número que crece */
/* Tarjetas protagonistas: tono profundo de la sección + brillo para la cifra clave */
.deep{border-radius:var(--r-lg);padding:20px 20px 18px;position:relative;overflow:hidden;color:var(--on-deep);
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--glow) 22%,transparent),transparent 55%),linear-gradient(150deg,var(--d1),var(--d2))}
.deep::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:1px solid color-mix(in srgb,var(--glow) 25%,transparent);box-shadow:0 0 0 22px color-mix(in srgb,var(--glow) 5%,transparent),0 0 0 46px color-mix(in srgb,var(--glow) 3%,transparent);pointer-events:none}
.deep>*{position:relative;z-index:1}
.hero{--d1:var(--grow-deep);--d2:var(--grow-deep2);--glow:var(--grow-glow)}
.spend-card{--d1:var(--spend-deep);--d2:var(--spend-deep2);--glow:var(--spend-glow)}
.debt-card{--d1:var(--debt-deep);--d2:var(--debt-deep2);--glow:var(--debt-glow)}
.deep .lbl{font-size:13px;font-weight:600;color:color-mix(in srgb,var(--on-deep) 72%,transparent)}
.deep .big{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,40px);letter-spacing:-.03em;line-height:1.05;margin-top:6px;color:var(--on-deep);word-break:break-all}
.deep .big .dec{font-size:.5em;color:var(--glow);font-weight:700;letter-spacing:0}
.deep .glow{color:var(--glow)}
.pace{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.pace div,.deep .kv div{background:color-mix(in srgb,var(--on-deep) 9%,transparent);border:1px solid color-mix(in srgb,var(--on-deep) 10%,transparent);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
.pace small,.deep .kv small{display:block;font-size:11px;color:color-mix(in srgb,var(--on-deep) 68%,transparent);font-weight:600}
.pace strong{display:block;font-size:13px;color:var(--glow);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deep .kv strong{color:var(--on-deep)}
.deep .bar{background:color-mix(in srgb,var(--on-deep) 16%,transparent)}
.deep .budget-line{color:color-mix(in srgb,var(--on-deep) 72%,transparent)}
.deep .tip{background:color-mix(in srgb,var(--on-deep) 10%,transparent);color:var(--on-deep)}
.deep .tip b{color:var(--glow)}
.hero-pulse{position:absolute;right:16px;top:18px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--glow);text-transform:uppercase;letter-spacing:.08em}
.hero-pulse i{width:8px;height:8px;border-radius:50%;background:var(--glow);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--grow-glow) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}

/* Distintivo de institución: la forma y el color indican el sector */
.who{display:flex;gap:12px;align-items:center;min-width:0}
.who>div{min-width:0}
.inst{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;color:var(--i-ink);font-weight:800;font-size:12.5px;letter-spacing:-.01em;font-family:var(--f-display);background:var(--ic);box-shadow:inset 0 -3px 0 rgb(0 0 0 / .14)}
.inst.banco{--ic:var(--i-banco);border-radius:12px}
.inst.asoc{--ic:var(--i-asoc);border-radius:50%}
.inst.afi{--ic:var(--i-afi);border-radius:4px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);box-shadow:none}
.inst.gov{--ic:var(--i-gov);border-radius:8px 8px 20px 20px}
.inst.sm{width:34px;height:34px;font-size:11px}
.inst-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:0 0 10px}
.inst-legend span{display:flex;align-items:center;gap:6px}
.inst-legend .inst{width:14px;height:14px;font-size:0;box-shadow:none}

/* Listas tipo tarjeta, una sola elevación */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item-title{font-weight:700;font-size:15px}
.item-meta{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.item-val{text-align:right;font-weight:700;font-size:16px;white-space:nowrap}
.item-val small{display:block;font-size:12px;font-weight:600;color:var(--grow)}
.cur{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2);vertical-align:1px;margin-left:4px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--fill,var(--grow))}
.row-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);margin-top:6px;flex-wrap:wrap}
.del{border:0;background:none;color:var(--ink-2);font-size:12px;font-weight:600;padding:2px 0;text-decoration:underline}
.del[data-armed]{color:var(--spend)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-md);padding:22px 16px;text-align:center;color:var(--ink-2);font-size:14px}
.empty button{margin-top:10px}

/* Widget preview */
.widgets{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.wg{flex-shrink:0;background:var(--widget);color:var(--widget-ink);border-radius:24px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.wg.s{width:150px;height:150px}
.wg.m{width:300px;height:150px}
.wg .wl{font-size:11px;font-weight:700;opacity:.75;display:flex;align-items:center;gap:6px}
.wg .wl i{width:6px;height:6px;border-radius:50%;background:var(--widget-accent)}
.wg .wv{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.1;word-break:break-all}
.wg .wv small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--widget-accent);letter-spacing:0;margin-top:4px}
.wg .wrow{display:flex;justify-content:space-between;font-size:11px;opacity:.85}
.wg svg{width:100%;height:36px}

/* Gastos */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-nav button{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1}
.month-nav strong{font-family:var(--f-display);font-size:18px;text-transform:capitalize}
.budget-line{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px}
.tip{margin-top:12px;font-size:13.5px;border-radius:var(--r-sm);padding:10px 12px}
.cats{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.cat-row{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.cat-row .t{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.cat-row .t i{display:block;height:100%;border-radius:99px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.day-h{font-size:12px;font-weight:700;color:var(--ink-2);margin:14px 0 6px;text-transform:capitalize}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx-ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.tx-main{flex:1;min-width:0}
.tx-main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-main span{font-size:12px;color:var(--ink-2)}
.tx-amt{text-align:right;font-weight:700;white-space:nowrap}
.tx-amt small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-2)}
.tx-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:0 14px}

/* Préstamos */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.kv div{background:var(--surface);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
.kv small{display:block;font-size:11px;color:var(--ink-2);font-weight:600}
.kv strong{font-size:14px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .08)}
.sim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between}
.field label output{color:var(--ink);font-weight:700}
input[type=range]{width:100%;accent-color:var(--debt)}
.result{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.result small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:600}
.result strong{font-family:var(--f-display);font-size:20px;letter-spacing:-.02em}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.offer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.offer:last-child{border-bottom:0}
.offer b{font-weight:600}
.offer span{font-size:12px;color:var(--ink-2);display:block}
.rate-pill{font-weight:800;font-size:14px;border-radius:999px;padding:4px 10px;background:var(--debt-soft);color:var(--debt);white-space:nowrap}
.rate-pill.g{background:var(--grow-soft);color:var(--grow)}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 7px}

/* Mercado */
.tick{display:grid;grid-template-columns:1fr 84px auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tick:last-child{border-bottom:0}
.tick b{font-weight:700;display:block}
.tick span{font-size:12px;color:var(--ink-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick .px{text-align:right;font-weight:700;white-space:nowrap}
.chg{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px}
.chg.up{color:var(--grow);background:var(--grow-soft)}
.chg.dn{color:var(--spend);background:var(--spend-soft)}
.tick svg{width:84px;height:30px;overflow:visible}
.flash-up{animation:fu .7s}
.flash-dn{animation:fd .7s}
@keyframes fu{0%{color:var(--grow)}100%{}}
@keyframes fd{0%{color:var(--spend)}100%{}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-bottom:10px}
.chips button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prod{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.prod:last-child{border-bottom:0}
.prod .act{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2)}
.link-btn{border:0;background:none;color:var(--market);font-weight:700;font-size:13px;padding:0}

/* Noticias */
.news{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:6px}
.news h3{margin:0;font-size:16px;line-height:1.3;font-weight:700;text-wrap:balance}
.news p{margin:0;font-size:13.5px;color:var(--ink-2)}
.news .nm{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.src{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.src:last-child{border-bottom:0}
.src span{font-size:12px;color:var(--ink-2);font-weight:500;display:block}
.src em{font-style:normal;color:var(--market);font-weight:700}

/* Barra inferior: zona del pulgar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
nav.tabs .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:11px;font-weight:600;color:var(--ink-2)}
nav.tabs .ic{width:46px;height:28px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
nav.tabs svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--tc)}
nav.tabs button[aria-selected="true"] .ic{background:var(--tcs)}

.fab{position:fixed;z-index:21;right:max(calc(16px + env(safe-area-inset-right,0px)),calc((100vw - 480px)/2 + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));height:54px;border-radius:18px;border:0;background:var(--fab,var(--grow));color:var(--surface);display:flex;align-items:center;gap:8px;padding:0 18px 0 14px;font-weight:700;font-size:15px;box-shadow:0 8px 22px -6px color-mix(in srgb,var(--fab,var(--grow)) 70%,transparent)}
.fab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}

/* Hoja inferior */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(5 15 12 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--f-display);font-size:22px;letter-spacing:-.02em;margin:0 0 14px}
.form{display:flex;flex-direction:column;gap:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form input:not([type=checkbox]),.form select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.form input:focus,.form select:focus{outline:none;border-color:var(--accent,var(--grow))}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--grow)}
.btn{border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;background:var(--accent,var(--grow));color:var(--surface)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.err{color:var(--spend);font-size:13px;font-weight:600;min-height:1em}
.hint{font-size:12.5px;color:var(--ink-2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600}


/* ---- Distribución compacta ---- */
.brand>div{display:flex;flex-direction:column;line-height:1}
.brand small{font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.brand h1{margin:3px 0 0;font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:-.025em;line-height:1.05}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:32px}
.hero-pulse{position:static}
.pace.two{grid-template-columns:1fr 1fr}
.mbtn{border:0;width:32px;height:32px;border-radius:50%;font-size:19px;line-height:1;background:color-mix(in srgb,var(--on-deep) 12%,transparent);color:var(--on-deep)}
.mbtn:disabled{opacity:.3;cursor:default}
.cap{text-transform:capitalize;font-size:14px!important;color:var(--on-deep)!important}
.count{font-size:11px;font-weight:800;letter-spacing:0;background:var(--surface-2);color:var(--ink-2);border-radius:99px;padding:2px 8px;text-transform:none}
h2.sec{align-items:center;justify-content:flex-start;gap:8px;margin:24px 0 10px}
.row3{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.mid .item-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--ink-2)!important}
.foot{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--ink-2);font-weight:700}
.foot .bar{flex:1;margin:0}
.x{flex-shrink:0;border:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);padding:0}
.x svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.x.armed{background:var(--spend);color:var(--surface)}
.tx .x{margin-left:2px}
.mini{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.mini b{color:var(--ink);font-weight:700;margin-left:4px}
.cats{gap:0}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.stack i{display:block;min-width:4px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:14px}
.cat-grid div{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.cat-grid .dot{margin:0;flex-shrink:0}
.cat-grid .cn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.cat-grid b{font-weight:700;white-space:nowrap}
.day-h{margin:12px 0 6px}
.sim{margin-top:10px}
.sim-out{display:flex;flex-direction:column;gap:10px}
.offer{cursor:pointer}
.offer .who span{font-size:12px}
.news-row{padding:12px 0;border-bottom:1px solid var(--line)}
.news-row:last-child{border-bottom:0}
.news-row h3{margin:4px 0 0;font-size:15px;font-weight:700;line-height:1.3;text-wrap:balance}
.news-row .nm{display:flex;gap:8px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.news-row .nm span:first-child{color:var(--market);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.src em{font-size:15px}
.seg{margin-bottom:2px}
.chips{margin:12px 0 0}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .btn{margin:0;padding:10px 18px}
.widgets{padding-bottom:6px}


/* ---- Espacio de ofertas y promociones ---- */
.promo{margin-top:14px}
.promo-rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-2px;padding:2px}
.promo-rail::-webkit-scrollbar{display:none}
.pcard{--d1:var(--promo-deep);--d2:var(--promo-deep2);--glow:var(--promo-glow);flex:0 0 calc(100% - 36px);scroll-snap-align:start;min-height:138px;padding:14px 16px 14px;display:flex;flex-direction:column;gap:4px}
.promo-rail .pcard:only-child{flex-basis:100%}
.pcard .ptop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ptag{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--glow);background:color-mix(in srgb,var(--glow) 16%,transparent);border-radius:6px;padding:3px 7px}
.pcard .pkind{font-size:12px;font-weight:700;color:color-mix(in srgb,var(--on-deep) 70%,transparent);margin-top:4px}
.pcard h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1.1;color:var(--on-deep);text-wrap:balance}
.pcard p{margin:0;font-size:12.5px;color:color-mix(in srgb,var(--on-deep) 70%,transparent)}
.pcta{align-self:flex-start;margin-top:8px;border:0;border-radius:11px;padding:8px 14px;font-weight:800;font-size:13px;background:var(--glow);color:var(--promo-deep)}
.pclose{border:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;padding:0;background:color-mix(in srgb,var(--on-deep) 12%,transparent);color:var(--on-deep)}
.pclose svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.pdots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.pdots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:width .2s,background .2s}
.pdots i.on{width:16px;background:var(--promo-deep2)}
.promo-row{background:color-mix(in srgb,var(--promo-glow) 14%,transparent);margin-inline:-14px;padding-inline:14px!important;width:calc(100% + 28px)}
.promo-row .ptag{color:var(--promo-deep2);background:color-mix(in srgb,var(--promo-deep2) 12%,transparent);margin-left:6px;vertical-align:1px}
.inst.promo{--ic:var(--promo-deep2);border-radius:12px}


/* ---- Resumen ---- */
.hero.neg{--d1:var(--debt-deep);--d2:var(--debt-deep2);--glow:var(--debt-glow)}
.seg-mini{display:flex;background:color-mix(in srgb,var(--on-deep) 12%,transparent);border-radius:10px;padding:3px;gap:2px}
.seg-mini button{border:0;background:none;color:color-mix(in srgb,var(--on-deep) 78%,transparent);font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;white-space:nowrap}
.seg-mini button[aria-pressed="true"]{background:var(--on-deep);color:var(--d1)}
.balance{display:flex;gap:3px;height:8px;border-radius:99px;overflow:hidden;margin-top:14px}
.balance i{display:block;min-width:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .tl{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink-2)}

.tile strong{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{font-size:12px;color:var(--ta);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.crow:last-child{border-bottom:0}
.crow b{font-weight:700;white-space:nowrap}
.crow.total{font-weight:800}
.crow.total b{font-family:var(--f-display);font-size:17px;font-weight:800}
.due{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2)}
.due.soon{background:var(--debt-soft);color:var(--debt)}
/* ---- Tarjetas de crédito ---- */
.ccwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:10px}
.ccard{border-radius:18px;padding:14px 16px 16px;color:var(--on-deep);background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.ccard::after{content:"";position:absolute;right:-50px;top:-70px;width:190px;height:190px;border-radius:50%;background:color-mix(in srgb,var(--on-deep) 7%,transparent);pointer-events:none}
.ccard>*{position:relative;z-index:1}
.cc-top{display:flex;align-items:center;gap:10px}
.cc-id{flex:1;min-width:0;display:flex;flex-direction:column}
.cc-id b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-id span{font-size:12px;color:color-mix(in srgb,var(--on-deep) 70%,transparent)}
.ccard .x{background:color-mix(in srgb,var(--on-deep) 15%,transparent);color:var(--on-deep)}
.ccard .x.armed{background:var(--spend)}
.cc-bal small{display:block;font-size:11.5px;color:color-mix(in srgb,var(--on-deep) 70%,transparent);font-weight:600}
.cc-bal strong{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.cc-bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--on-deep) 18%,transparent);overflow:hidden}
.cc-bar i{display:block;height:100%;border-radius:99px}
.cc-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:color-mix(in srgb,var(--on-deep) 82%,transparent)}
.cc-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cc-info div{background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
.cc-info small{display:block;font-size:11px;color:var(--ink-2);font-weight:600}

.cc-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cc-actions .btn{padding:11px 8px;font-size:13.5px}
.cc-zero{display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--grow);background:var(--grow-soft);border-radius:14px}


/* ---- Mejoras tras la simulación ---- */
.deep .big{font-size:var(--bs,clamp(30px,9vw,40px));word-break:normal;overflow-wrap:anywhere}
.echo{font-size:12.5px;font-weight:700;color:var(--grow);min-height:1em}
.echo.bad{color:var(--spend)}
.toast{display:flex;align-items:center;gap:14px}
.toast button{border:0;background:none;color:var(--grow-glow);font-weight:800;font-size:14px;padding:4px 2px;text-decoration:underline}


/* ---- Hogar: ingresos, presupuesto, fijos, metas, plan de deudas ---- */
.capz{text-transform:capitalize}
.sheet-seg{margin-bottom:14px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-top:14px}
.month-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.mstats.three{grid-template-columns:repeat(3,1fr)}
.mstats div{min-width:0}
.mstats small{display:block;font-size:11px;color:var(--ink-2);font-weight:600}

.alert{width:100%;display:flex;align-items:center;gap:10px;margin-top:12px;border:1px solid color-mix(in srgb,var(--market) 30%,var(--line));background:var(--market-soft);color:var(--ink);border-radius:var(--r-md);padding:11px 14px;font-weight:700;font-size:14px;text-align:left}

.inbox{background:var(--surface);border:1px solid color-mix(in srgb,var(--market) 30%,var(--line));border-radius:var(--r-md);padding:2px 14px 10px;margin-top:14px}

.mini-btn{flex-shrink:0;border:0;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--ink)}

.tx-ic.inc{background:var(--grow-soft);color:var(--grow);font-size:18px}
.tx-amt.pos{color:var(--grow)}
.sh{color:var(--market);font-weight:600}
.liq{color:var(--grow);font-weight:600}
.due.paid{background:var(--grow-soft);color:var(--grow)}
.due.late{background:var(--spend-soft);color:var(--spend)}
.bud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud .bn b{display:block;font-weight:700;font-size:14px}
.bud .bn span{display:block;font-size:12px;color:var(--ink-2)}
.bud .bp{font-weight:800;font-size:12.5px;border-radius:7px;padding:2px 7px;white-space:nowrap}
.bud .bar{grid-column:2/-1;margin:0}
.lvl-ok{color:var(--grow);background:var(--grow-soft)}
.lvl-warn{color:var(--debt);background:var(--debt-soft)}
.lvl-over{color:var(--spend);background:var(--spend-soft)}
.lvl-none{color:var(--ink-2);background:var(--surface-2)}
.bud-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emerg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-top:14px}
.em-big{font-family:var(--f-display);font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.em-big small{font-family:var(--f-body);font-size:14px;color:var(--ink-2);font-weight:600;margin-left:8px;letter-spacing:0}
.months{display:grid;gap:4px;margin:12px 0 10px}
.months i{display:block;height:10px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.months b{display:block;height:100%}
.em-t{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.em-t b{color:var(--ink)}
.goal{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center}
.ring{width:52px;height:52px}
.ring text{font-size:12px;font-weight:800;fill:var(--ink);font-family:var(--f-body)}
.goal-act{display:flex;gap:6px;align-items:center}

@media (max-width:440px){.plans{grid-template-columns:1fr}}
.plan{border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--bg)}
.plan.best{border-color:var(--debt);background:color-mix(in srgb,var(--debt-soft) 45%,var(--surface))}
.plan h3{margin:0;font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.pl-t{margin:-4px 0 0;font-size:12.5px;color:var(--ink-2)}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv2 small{display:block;font-size:11px;color:var(--ink-2);font-weight:600}
.kv2 strong{font-size:14px;white-space:nowrap}
.plan ol{margin:2px 0 0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.plan ol span{color:var(--ink-2)}
.badge{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--debt);color:var(--surface)}
.badge.soft{background:var(--surface-2);color:var(--ink-2)}
.base-note{margin:12px 0 0;font-size:13.5px;color:var(--ink-2)}

.settle{font-size:18px;margin:0}
.settle b{font-family:var(--f-display);font-size:24px;display:block;margin-top:4px}
.tiles{grid-auto-rows:1fr}


/* ---- Ajustes visuales ---- */
[hidden]{display:none!important}
.capz,.cap{display:inline-block;text-transform:none}
.capz::first-letter,.cap::first-letter{text-transform:uppercase}
.pace div{padding:8px}
.pace strong{font-size:12.5px;letter-spacing:-.01em}
.hero .pace strong{font-size:12px}


/* ---- Guía inicial ---- */
html.onb-open,html.onb-open body{overflow:hidden}
.onb{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.onb-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.onb-top{display:flex;align-items:center;gap:12px;min-height:36px}
.onb-brand{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.02em;flex:1}
.onb-skip{border:0;background:none;color:var(--ink-2);font-weight:700;font-size:14px;padding:8px 2px}
.onb-prog{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.onb-prog i{display:block;height:100%;background:var(--grow);border-radius:99px;transition:width .35s ease}
.onb-step{font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.onb-main{flex:1}
.onb h2{font-family:var(--f-display);font-weight:800;font-size:clamp(25px,7vw,31px);letter-spacing:-.025em;line-height:1.1;margin:22px 0 8px;text-wrap:balance;outline:none}
.onb .lead{color:var(--ink-2);margin:0 0 18px;font-size:15px;max-width:52ch}
.onb-body{display:flex;flex-direction:column;gap:12px}
.onb-body.bud-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.onb-foot{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 75%,color-mix(in srgb,var(--bg) 0%,transparent));padding:18px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:10px;display:flex;gap:8px}
.onb-foot .btn{flex:1}
.onb-foot .btn.ghost{flex:0 0 auto;padding-inline:16px}
.onb-hero{margin-top:18px}
.onb-hero p{margin:6px 0 0;color:color-mix(in srgb,var(--on-deep) 80%,transparent);max-width:34ch}
.onb-big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,11vw,46px);letter-spacing:-.03em;line-height:1.05;margin-top:6px;color:var(--glow)}
.onb-list{margin:0 0 16px;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.onb-list li::marker{color:var(--grow);font-weight:800}
.onb .hint{margin:0 0 12px}
.chk-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.chk-row .check{color:var(--ink);font-weight:600;font-size:15px;align-items:center}
.rowcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px}
.rowcard-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em}
.add-row{border:1.5px dashed var(--line);background:none;border-radius:var(--r-md);padding:13px;font-weight:700;font-size:14px;color:var(--grow)}
fieldset.field{border:0;padding:0;margin:0;min-width:0}
fieldset.field legend{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px;padding:0}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice.two-c{grid-template-columns:1fr 1fr}
.pill{position:relative;display:block}
.pill input{position:absolute;opacity:0;inset:0;margin:0}
.pill span{display:block;text-align:center;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 6px;font-weight:700;font-size:14px;color:var(--ink-2)}
.pill input:checked+span{border-color:var(--grow);background:var(--grow-soft);color:var(--grow)}
.pill input:focus-visible+span{outline:2px solid var(--market);outline-offset:2px}
.sub-h{margin:8px 0 0;font-size:12px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em}
.opt{font-weight:500;color:var(--ink-2);text-transform:none;letter-spacing:0}
.onb-feat{display:flex;flex-direction:column;gap:10px}
.onb-feat div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.onb-feat b{display:block;font-size:15px}
.onb-feat span{font-size:13.5px;color:var(--ink-2)}
.onb-cta{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:var(--r-md);padding:13px 16px;margin-bottom:12px;background:var(--grow);color:var(--surface)}
.onb-cta b{display:block;font-size:15px}
.onb-cta small{display:block;font-size:12.5px;opacity:.85;margin-top:1px}
.onb-cta>span:last-child{margin-left:auto;font-size:22px;line-height:1}
/* ---- Correo y documentos ---- */
.form textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;resize:vertical}
.mail-st{display:flex;flex-direction:column;gap:2px;border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.mail-st.on{background:var(--grow-soft)}
.mail-st b{font-size:15px}
.mail-st span{font-size:13px;color:var(--ink-2)}
details.adv{border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.adv summary{cursor:pointer;font-weight:700;font-size:14px;padding:12px 0;list-style-position:inside}
.adv-in{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.mail-out{font-size:13.5px;color:var(--ink-2)}
.mail-out b{color:var(--ink)}
.inv-amt{flex:1;min-width:0;font-size:13px;font-weight:700}
.hit{color:var(--grow)}


/* ---- Íconos de gastos fijos y avisos de la guía ---- */
.fx-ic{width:34px;height:34px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.fx-ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chk-row .check{gap:12px}
.chk-row .check input{flex-shrink:0}
.fx-h{display:flex;align-items:center;gap:10px}
.fx-h .fx-ic{width:28px;height:28px;border-radius:9px}
.fx-h .fx-ic svg{width:16px;height:16px}
.tx .fx-ic{width:36px;height:36px;border-radius:12px}
.onb-note{display:flex;gap:12px;align-items:flex-start;background:var(--debt-soft);border-radius:var(--r-md);padding:12px 14px;margin:0 0 16px;font-size:14px;line-height:1.45}
.onb-note svg{width:22px;height:22px;flex-shrink:0;margin-top:1px;fill:none;stroke:var(--debt);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.onb-note b{color:var(--ink)}
.field label.pill,.pill{display:block}
.choice{align-items:stretch}
.choice .pill span{height:100%;display:flex;align-items:center;justify-content:center;padding:10px 4px;line-height:1.2}


/* ---- Cuenta ---- */
#accBtn{position:relative}
#accBtn.in{background:var(--grow);border-color:var(--grow)}
.acc-ini{color:var(--surface);font-weight:800;font-size:14px;font-family:var(--f-display);line-height:1}
#accBtn[data-sync="pend"]::after,#accBtn[data-sync="sync"]::after,#accBtn[data-sync="error"]::after{content:"";position:absolute;right:-2px;top:-2px;width:11px;height:11px;border-radius:50%;background:var(--debt);border:2px solid var(--bg)}
#accBtn[data-sync="error"]::after{background:var(--spend)}
.lead-s{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.5}
.lead-s b{color:var(--ink)}
.link-btn.danger{color:var(--spend);align-self:flex-start}
.del-box{background:var(--spend-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.del-box p{margin:0;font-size:13.5px}
.priv p{margin:0;font-size:14px;line-height:1.55;color:var(--ink-2)}
.priv b{color:var(--ink)}
.onb-login{border:0;background:none;color:var(--grow);font-weight:700;font-size:14px;padding:10px 0;text-decoration:underline;align-self:flex-start;display:block}
a.btn{display:block;text-align:center;text-decoration:none}


/* ---- Versión 2: identidad dominicana, pestañas nuevas y gráficos ---- */
:root{
  --rd-blue:#002D62; --rd-red:#CE1126;
  --brand:#0B4A9E; --brand-soft:#E2EBF8; --brand-deep:#061D42; --brand-deep2:#0E3F86; --brand-glow:#A8C8FF;
  --inv:#0A84A3; --inv-soft:#D6F0F6; --inv-deep:#05313B; --inv-deep2:#0A6378; --inv-glow:#8AE4F3;
  --goal:#B0418F; --goal-soft:#F7E0F0; --i-bolsa:#B4521C;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c-gray:#8A9691;
  --widget:#05313B; --widget-accent:#8AE4F3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#86AEFF; --brand-soft:#15233F; --brand-deep:#08193A; --brand-deep2:#123A78; --brand-glow:#A8C8FF;
  --inv:#4CC8E4; --inv-soft:#0D2D35; --inv-deep:#052930; --inv-deep2:#0A5464; --inv-glow:#8AE4F3;
  --goal:#E77BCB; --goal-soft:#381730; --i-bolsa:#D9733B;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c-gray:#7C8B86;
  --widget:#052930; --widget-accent:#8AE4F3}}
:root[data-theme="dark"]{
  --brand:#86AEFF; --brand-soft:#15233F; --brand-deep:#08193A; --brand-deep2:#123A78; --brand-glow:#A8C8FF;
  --inv:#4CC8E4; --inv-soft:#0D2D35; --inv-deep:#052930; --inv-deep2:#0A5464; --inv-glow:#8AE4F3;
  --goal:#E77BCB; --goal-soft:#381730; --i-bolsa:#D9733B;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c-gray:#7C8B86;
  --widget:#052930; --widget-accent:#8AE4F3}

/* Marca */
.brand-mark{background:none;border-radius:9px;overflow:hidden;width:32px;height:32px;box-shadow:0 2px 6px -2px rgb(0 45 98 / .45)}
.brand-mark svg{width:32px;height:32px;stroke:none;display:block}
.brand small .rd{color:var(--rd-red)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand small .rd{color:#FF5A6A}}
:root[data-theme="dark"] .brand small .rd{color:#FF5A6A}

/* Tarjetas protagonistas por sección */
.hero.brandc{--d1:var(--brand-deep);--d2:var(--brand-deep2);--glow:var(--brand-glow)}
.hero.brandc.neg{--d1:var(--debt-deep);--d2:var(--debt-deep2);--glow:var(--debt-glow)}
.inv-card{--d1:var(--inv-deep);--d2:var(--inv-deep2);--glow:var(--inv-glow)}
.addb{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:var(--glow);color:var(--d1);box-shadow:0 4px 12px -4px rgb(0 0 0 / .4)}
.addb svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.hero-r{display:flex;align-items:center;gap:12px}
.hero-sub{font-size:13px;color:color-mix(in srgb,var(--on-deep) 72%,transparent);margin-top:4px}
.hero-seg{display:inline-flex;margin-top:12px}

/* Períodos */
.per{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:14px;padding-bottom:2px}
.per::-webkit-scrollbar{display:none}
.per button{flex-shrink:0;border:1px solid color-mix(in srgb,var(--on-deep) 22%,transparent);background:none;color:color-mix(in srgb,var(--on-deep) 82%,transparent);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700}
.per button[aria-pressed="true"]{background:var(--on-deep);border-color:var(--on-deep);color:var(--d1)}
.per.light{margin-top:0}
.per.light button{border-color:var(--line);color:var(--ink-2);background:var(--surface)}
.per.light button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.per-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.per-dates label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:color-mix(in srgb,var(--on-deep) 75%,transparent)}
.per-dates input{border:1px solid color-mix(in srgb,var(--on-deep) 25%,transparent);background:color-mix(in srgb,var(--on-deep) 10%,transparent);color:var(--on-deep);border-radius:10px;padding:8px;font-size:15px;color-scheme:dark;min-width:0}
.per-dates.light label{color:var(--ink-2)}
.per-dates.light input{border-color:var(--line);background:var(--bg);color:var(--ink);color-scheme:inherit}

/* Paneles */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-top:12px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;min-height:30px}
.panel-h>b{font-size:15px;font-weight:800}
.panel-s{font-size:12px;color:var(--ink-2);font-weight:600;text-align:right}
.seg.tiny{padding:3px;border-radius:10px;margin:0;flex-shrink:0}
.seg.tiny button{padding:5px 9px;font-size:12px;border-radius:8px;flex:0 0 auto}
.io{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.io>*{min-width:0;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px}
.io small{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.io strong{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pos{color:var(--grow)} .negc{color:var(--spend)}
.sw{display:inline-block;width:8px;height:8px;border-radius:3px;flex-shrink:0}
.flow2{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;margin-top:12px}
.flow2 i{display:block;min-width:3px}
.sec-tot{margin-left:auto;font-size:14px;letter-spacing:-.01em;text-transform:none;color:var(--ink);font-weight:800}
h2.sec button{margin-left:auto}
.rowbtn{width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left;font:inherit;color:inherit}
.tx-group .rowbtn:last-child{border-bottom:0}
.mbar{display:block;height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;max-width:150px}
.mbar i{display:block;height:100%;border-radius:99px}
.empty.sm{padding:16px 14px;font-size:13.5px}

/* Dona + lista de barras */
.dn{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:center}
.dn-svg{width:112px;height:112px;display:block}
.dn-svg circle{transition:opacity .15s}
.dn-t1{font-family:var(--f-display);font-weight:800;font-size:12px;fill:var(--ink);letter-spacing:-.02em}
.dn-t2{font-size:10px;font-weight:700;fill:var(--ink-2)}
.ml{display:flex;flex-direction:column;gap:9px;min-width:0}
.ml-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;column-gap:7px;row-gap:4px;align-items:center;font-size:12.5px}
.ml-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:600}
.ml-row b{font-weight:800;white-space:nowrap}
.ml-t{grid-column:2/3;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.ml-t i{display:block;height:100%;border-radius:99px}
.ml-row small{font-size:11px;font-weight:700;color:var(--ink-2);text-align:right}
@media (max-width:350px){.dn{grid-template-columns:1fr;justify-items:center}.ml{width:100%}}

/* Columnas en el tiempo */
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);padding-top:4px}
.col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;border:0;background:none;padding:0 1px;border-radius:6px 6px 0 0}
.col i{display:block;width:100%;max-width:28px;background:var(--cc);opacity:.55;border-radius:4px 4px 0 0;transition:opacity .15s}
.col[aria-pressed="true"] i{opacity:1}
.col:hover i{opacity:.85}
.col-l{display:flex;gap:3px;margin-top:6px}
.col-l span{flex:1;min-width:0;text-align:center;font-size:10.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:visible}
.col-cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2)}
.col-cap span::first-letter{text-transform:uppercase}
.col-cap b{color:var(--ink);font-size:15px;font-weight:800}

/* Barras por entidad */
.hb{display:flex;flex-direction:column;gap:11px}
.hb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center;font-size:13px}
.hb-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hb-row b{font-weight:800}
.hb-t{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:4px;background:var(--inv)}

/* Desglose por entidad */
.eg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.eg-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:color-mix(in srgb,var(--inv) 6%,var(--surface))}
.eg-h .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eg-h .mid span{font-size:12px;color:var(--ink-2)}
.eg-v{text-align:right}
.eg-v b{display:block;font-size:16px;font-weight:800;white-space:nowrap}
.eg-v small{font-size:11.5px;color:var(--ink-2);font-weight:600}
.eg-r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.eg-r .mid b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eg-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:3px}
.ty{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.soonc{color:var(--debt);font-weight:700}
.eg-a{text-align:right;font-weight:700;font-size:14.5px;white-space:nowrap}
.eg-a small{display:block;font-size:11.5px;font-weight:700;color:var(--grow)}
.inst.bolsa{--ic:var(--i-bolsa);border-radius:4px 14px 4px 14px}

/* Formularios */
.ent-o{margin-top:8px}
.form select optgroup{font-weight:700}

/* Próximamente */
.soonv{position:relative;text-align:center;padding:42px 20px 28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-top:6px;overflow:hidden}
.soonv::before{content:"";position:absolute;inset:0 0 auto;height:120px;background:radial-gradient(80% 100% at 50% 0%,var(--ss),transparent 70%);pointer-events:none}
.soonv>*{position:relative}
.soon-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sc);background:var(--ss);border-radius:99px;padding:4px 10px}
.soon-ic{display:grid;place-items:center;width:72px;height:72px;margin:18px auto 6px;border-radius:24px;background:var(--sc);color:var(--surface);box-shadow:0 10px 24px -10px var(--sc)}
.soon-ic svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.soonv h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:10px 0 6px}
.soonv>p{margin:0 auto;color:var(--ink-2);max-width:32ch;font-size:15px}
.soonv ul{list-style:none;padding:0;margin:20px auto 0;max-width:300px;text-align:left;display:flex;flex-direction:column;gap:10px}
.soonv li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;font-weight:600}
.soonv li svg{width:20px;height:20px;flex-shrink:0;fill:none;stroke:var(--sc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.soon-note{margin:20px auto 0;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;max-width:34ch}

/* Barra inferior de 7 pestañas */

.fab{display:none!important}
.app{padding-bottom:110px}
.brand h1{text-wrap:balance}
.brand h1.long{font-size:20px;line-height:1.02}
.io strong{font-size:14.5px}
header.top{gap:8px}.brand{min-width:0;flex:1}.brand>div{min-width:0}.top-actions{flex-shrink:0}
@media (max-width:360px){.brand{gap:8px}.brand h1{font-size:20px}.brand h1.long{font-size:16.5px}.top-actions{gap:5px}.icon-btn{width:32px;height:32px}.chip-btn{padding:5px 9px}.brand-mark,.brand-mark svg{width:28px;height:28px}}


/* ---- Versión 2.1: barra más limpia, resumen interactivo, edición ---- */
nav.tabs{background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px -14px rgb(0 0 0 / .25)}

/* Acciones rápidas */
.qa{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:12px}

.qa-b.exp{background:var(--spend)}

.qa-ic{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--surface) 22%,transparent)}
.qa-b.more .qa-ic{background:var(--surface-2)}
.qa-ic svg{width:15px;height:15px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round}
.qa-b.more .qa-ic svg{fill:currentColor;stroke:none}

/* Saldo: filas con cifras completas */
.hrows{margin-top:14px;border-top:1px solid color-mix(in srgb,var(--on-deep) 16%,transparent)}
.hrows div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--on-deep) 10%,transparent)}
.hrows div:last-child{border-bottom:0;padding-bottom:0}
.hrows span{font-size:13px;color:color-mix(in srgb,var(--on-deep) 74%,transparent);font-weight:600}
.hrows b{font-size:16px;font-weight:800;color:var(--on-deep);white-space:nowrap}

/* Ingresos y gastos en filas */
.iol{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.iol-r{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;align-items:center;gap:10px;width:100%;padding:12px 12px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;font:inherit;color:inherit}
.iol-r:last-child{border-bottom:0}
.iol-r>span:first-child{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.iol-r b{font-size:16px;font-weight:800;white-space:nowrap}
.iol-r.tot{grid-template-columns:minmax(0,1fr) auto 14px;background:var(--bg)}
.chev{color:var(--ink-2);font-size:20px;line-height:1;font-weight:500;justify-self:end}
.per button{display:inline-flex;align-items:center;gap:5px}
.per .cal{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* Gráfico doble */
.dual .col{gap:2px;padding:0 2px}
.dual .col i{max-width:11px;flex:1;opacity:.5}
.dual .col[aria-pressed="true"] i{opacity:1}
.dual .ci{background:var(--grow)} .dual .ce{background:var(--spend)}
.col-cap2{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2)}
.col-cap2>span{display:flex;align-items:center;gap:6px;min-width:0}
.col-cap2 .cc-cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-cap2 .cc-cap::first-letter{text-transform:uppercase}
.col-cap2 b{color:var(--ink);font-size:14px;font-weight:800}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink-2);font-weight:600}
.leg>span{display:flex;align-items:center;gap:6px}
.leg-h{margin-left:auto;font-weight:500}

/* Secciones del resumen */
.sec-add{border:0;background:var(--surface-2)!important;color:var(--ink)!important;border-radius:99px;padding:5px 11px!important;font-size:12.5px!important;font-weight:700!important;margin-left:10px}

.sec-note{margin-left:auto;font-size:11.5px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--ink-2)}
.rowbtn{cursor:pointer}
.rowbtn:active{background:var(--surface-2)}
.tx.rowbtn{gap:10px}
.tx .chev{margin-left:-2px}
.hint.center{text-align:center;margin:18px 0 0}

/* Inversiones desplegables */
details.acc{border-bottom:1px solid var(--line)}

details.acc>summary::-webkit-details-marker{display:none}
.chev.rot{transition:transform .2s;transform:rotate(90deg)}
details.acc[open] .chev.rot{transform:rotate(-90deg)}
.acc-in{padding:0 0 8px 48px;display:flex;flex-direction:column}
.acc-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-top:1px dashed var(--line);background:none;padding:10px 0;text-align:left;font:inherit;color:inherit}
.acc-r .mid b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-r .mid span{font-size:12px;color:var(--ink-2)}
.acc-v{font-weight:700;font-size:13.5px;white-space:nowrap}

/* Menús de opciones */
.menu{display:flex;flex-direction:column;gap:8px}
.menu-r{display:grid;grid-template-columns:auto minmax(0,1fr) 14px;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:12px 14px;font:inherit;color:inherit}
.menu-r b{display:block;font-size:15px}
.menu-r small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.menu-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--mc) 15%,transparent);color:var(--mc)}
.menu-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Confirmación de borrado */
.confirm{text-align:center;padding-top:4px}
.confirm-ic{display:grid;place-items:center;width:56px;height:56px;border-radius:18px;margin:0 auto 12px;background:var(--spend-soft);color:var(--spend)}

.link-btn.del-link{align-self:center;margin-top:6px;padding:8px}
.widgets{opacity:.95}
.qa-b{min-width:0}
@media (max-width:370px){.qa{gap:6px}.qa-b{padding:11px 8px;font-size:14px;gap:6px}.qa-b.more{padding-inline:10px}h2.sec{flex-wrap:wrap;row-gap:6px}h2.sec .sec-tot{font-size:13px}.sec-add{padding:4px 9px!important}}


/* ---- Versión 2.2: resumen agrupado, filtros y registro más amable ---- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Moneda de referencia: solo RD$ y US$ */
.cur-seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.cur-seg button{border:0;background:none;border-radius:999px;padding:5px 9px;font-size:12.5px;font-weight:800;color:var(--ink-2);line-height:1.1}
.cur-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
@media (max-width:360px){.cur-seg button{padding:5px 7px;font-size:12px}}

/* Mes y año */
.ym{display:flex;align-items:center;gap:4px}
.ym-arr{border:0;background:var(--surface-2);width:30px;height:32px;border-radius:10px;font-size:18px;line-height:1;color:var(--ink);padding:0}
.ym-arr:disabled{opacity:.35}
.ym-sel{position:relative;display:block}
.ym-sel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 24px 6px 10px;font-size:13.5px;font-weight:700;height:32px}
.ym-sel::after{content:"";position:absolute;right:9px;top:50%;width:6px;height:6px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.panel-h:has(.ym){flex-wrap:wrap;row-gap:10px}
.iol{margin-top:2px}
.flow-t{margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}

/* Filtros del gráfico */
.chart-f{display:flex;flex-direction:column;gap:8px;margin:-2px 0 12px}

.leg-t{display:flex;gap:6px}
.leg-t button{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:none;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.leg-t button[aria-pressed="true"]{border-style:solid;color:var(--ink);background:var(--surface)}

.dual.dense .col{padding:0 .5px;gap:1px}

.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}

/* Dinero por moneda */
.cmix{display:grid;grid-template-columns:80px minmax(0,1fr);gap:16px;align-items:center}

.cmix-r .sw{width:10px;height:10px}
.cmix-n{font-size:13.5px;font-weight:700;min-width:0}
.cmix-n small{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.cmix-v{text-align:right;white-space:nowrap}
.cmix-v b{display:block;font-size:15px;font-weight:800}
.cmix-v small{font-size:11.5px;color:var(--ink-2);font-weight:600}

/* Grupos desplegables: grupo → entidad → cuenta */
.grps{display:flex;flex-direction:column;gap:10px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.grp>summary,.ent>summary{list-style:none;cursor:pointer}
.grp>summary::-webkit-details-marker,.ent>summary::-webkit-details-marker{display:none}
.grp-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto 14px;column-gap:12px;row-gap:6px;align-items:center;padding:14px}
.grp-h{grid-template-columns:auto minmax(0,1fr) 14px!important}
.grp-h .grp-ic{grid-row:1/3;align-self:start}
.grp-h .grp-v{grid-column:2/4;grid-row:2;text-align:left;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.grp-h .grp-v b{font-size:20px;font-family:var(--f-display);letter-spacing:-.02em}
.grp-h .cpills{margin:0;justify-content:flex-start}
.grp-v.card{flex-direction:column;align-items:flex-start;gap:3px}
.grp-k{font-size:11.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.grp-owe{font-size:13px;color:var(--ink-2);font-weight:600}
.grp-owe b{display:inline!important;font-family:var(--f-body)!important;font-size:13.5px!important;color:var(--spend);letter-spacing:0!important}
.owe-s{font-size:11.5px!important;color:var(--spend)!important;font-weight:700}
.it-k{display:none}
.last2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;min-width:0;display:flex;flex-direction:column}
.lcol.exp{border-top:3px solid var(--spend)}
.lcol.inc{border-top:3px solid var(--grow)}
.lcol-h{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px;font:inherit;font-size:13.5px;font-weight:800;color:var(--ink)}
.lcol-h>span{display:flex;align-items:center;gap:7px}
.lrow{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;font:inherit;color:inherit;min-width:0}
.lrow:last-child{border-bottom:0}
.lrow:active{background:var(--surface-2)}
.lrow b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow span{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow strong{font-size:14px;font-weight:800;margin-top:2px}
.lcol.exp .lrow strong{color:var(--spend)}
.lcol.inc .lrow strong{color:var(--grow)}
.lcol.inc{text-align:right}
.lcol.inc .lrow{align-items:flex-end;text-align:right}
.lrow b,.lrow span{max-width:100%}
.lempty{margin:0;padding:14px 12px;font-size:12.5px;color:var(--ink-2)}
.field label.via,.field label.cp{display:block;font-size:inherit;font-weight:inherit;color:var(--ink)}
.via-t b{color:var(--ink)}
.grp-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 15%,transparent);color:var(--gc)}
.grp-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.grp-t{min-width:0}
.grp-t b{display:block;font-size:15.5px;font-weight:800}
.grp-t span{font-size:12.5px;color:var(--ink-2)}
.grp-v{text-align:right;min-width:0}
.grp-v b{display:block;font-size:16px;font-weight:800;white-space:nowrap}
.cpills{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;margin-top:3px}
.cpill{font-size:11px;font-weight:700;white-space:nowrap;border-radius:6px;padding:1px 6px;color:var(--ink);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.grp[open]>.grp-h{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--gc) 5%,var(--surface))}
.grp[open]>summary .chev.rot,.ent[open]>summary .chev.rot{transform:rotate(-90deg)}
.grp-in{padding:4px 12px 12px}
.ent{border-bottom:1px dashed var(--line)}
.ent-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto 14px;gap:10px;align-items:center;padding:11px 2px}
.ent-t{min-width:0}
.ent-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent-t span{font-size:12px;color:var(--ink-2)}
.ent-v{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ent-in{margin:0 0 10px 44px;border-left:2px solid var(--line);padding-left:10px}
.it-r{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;padding:9px 0;border-top:1px solid var(--line)}

.it-t b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.grp-add{display:block;width:100%;margin-top:10px;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px;font-weight:700;font-size:13.5px;color:var(--gc)}

.mv-top{margin-bottom:12px}

.form.mv{gap:16px}
.amt-box{border-radius:16px;padding:14px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1.5px solid color-mix(in srgb,var(--accent) 30%,var(--line))}

.vias{display:flex;flex-direction:column}
.via-g{display:flex;align-items:center;gap:8px;margin:10px 0 6px;font-size:12px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.via-g:first-child{margin-top:0}
.cflag{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--surface);background:var(--cc);border-radius:5px;padding:2px 5px}
.via-list{display:flex;flex-direction:column;gap:6px}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf={};
function fmt(v,cur,dec=2){const k=cur+dec;nf[k]=nf[k]||new Intl.NumberFormat('es-DO',{style:'currency',currency:cur,minimumFractionDigits:dec,maximumFractionDigits:dec});return nf[k].format(v)}
function conv(v,from,to){return v*S.rates[from]/S.rates[to]}
function split(v,cur,dec){const s=fmt(v,cur,dec);const i=s.search(/[.,]\d+$/);return i<0?esc(s):esc(s.slice(0,i))+'<span class="dec">'+esc(s.slice(i))+'</span>'}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Lectura de montos tal como se escriben en RD: 1500 · 1,500 · 1,500.00 · RD$1,500 · 1.500 · 1 500 · 1.500,50 */
function money(v){
  let s=String(v==null?'':v).trim().replace(/[^\d.,-]/g,'');
  if(!/\d/.test(s))return NaN;
  const neg=s.charAt(0)==='-'; s=s.replace(/-/g,'');
  const c=s.lastIndexOf(','), d=s.lastIndexOf('.');
  if(c>-1&&d>-1){const dec=c>d?',':'.';s=s.split(dec===','?'.':',').join('').replace(dec,'.')}
  else if(c>-1){s=/^\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,''):s.replace(/,(?=[^,]*$)/,'.').replace(/,/g,'')}
  else if(d>-1){if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');else{const p=s.split('.');if(p.length>2)s=p.slice(0,-1).join('')+'.'+p[p.length-1]}}
  const n=parseFloat(s);return neg?-n:n;
}
/* Tasas y tipo de cambio: aceptan coma o punto decimal (9,25 = 9.25) */
function rate(v){return parseFloat(String(v==null?'':v).trim().replace(/[%\s]/g,'').replace(',','.'))}

const SECTOR={banco:'Banco múltiple',asoc:'Asociación de ahorros',bolsa:'Puesto de bolsa',afi:'Fondo / AFI',gov:'Emisor público'};
function instInfo(name){
  if(INST[name])return INST[name];
  const n=(name||'?').trim(), low=n.toLowerCase();
  const type=/asociaci|apap/.test(low)?'asoc':/afi|fondo|funds|sociedad administradora/.test(low)?'afi':/ministerio|hacienda|central|gobierno/.test(low)?'gov':/valores|bolsa|inversiones|capital|parval/.test(low)?'bolsa':'banco';
  const words=n.replace(/^(banco|asociaci[oó]n|afi)\s+/i,'').split(/\s+/).filter(w=>w.length>2||/^[A-Z]/.test(w));
  const ab=(words.length>1?words[0][0]+words[1][0]:(words[0]||n).slice(0,2)).toUpperCase();
  return [ab,type];
}
function inst(name,sm){const [ab,t]=instInfo(name);return `<span class="inst ${t}${sm?' sm':''}" title="${esc(name)} · ${SECTOR[t]}" aria-hidden="true">${esc(ab)}</span>`}
function instLegend(){return `<div class="inst-legend">${Object.entries(SECTOR).map(([k,v])=>`<span><span class="inst ${k}"></span>${v}</span>`).join('')}</div>`}

/* Ahorro: interés simple con retención ISR opcional y renovación automática al vencer (práctica común en certificados RD) */
function effRate(s){return s.rate/100*(s.isr?0.9:1)}
function savValue(s,t){
  const r=effRate(s), term=termMs(s), el=Math.max(0,t-s.start);
  const n=Math.floor(el/term), rem=el-n*term;
  return s.principal*Math.pow(1+r*term/YEAR,n)*(1+r*rem/YEAR);
}
function perSec(s,t){return savValue(s,t)*effRate(s)/(YEAR/1000)}
function totals(t){
  let v=0,p=0,ps=0;
  S.savings.forEach(s=>{v+=conv(savValue(s,t),s.cur,S.base);p+=conv(s.principal,s.cur,S.base);ps+=conv(perSec(s,t),s.cur,S.base)});
  return {v,p,ps};
}
/* Préstamos: sistema francés (cuota fija) */
function cuota(P,rate,n){const i=rate/1200;return i?P*i/(1-Math.pow(1+i,-n)):P/n}
function paid(l){const a=new Date(l.start),b=new Date();let k=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());if(b.getDate()<a.getDate())k--;return Math.min(Math.max(k,0),l.months)}
function balance(P,rate,n,k){const i=rate/1200;if(!i)return P-P/n*k;const c=cuota(P,rate,n);return Math.max(0,P*Math.pow(1+i,k)-c*(Math.pow(1+i,k)-1)/i)}
function nextPay(l){const a=new Date(l.start);const k=paid(l)+1;return new Date(a.getFullYear(),a.getMonth()+k,a.getDate())}
const dateFmt=new Intl.DateTimeFormat('es-DO',{day:'numeric',month:'short'});

function perRange(k){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),sod=new Date(y,m,n.getDate()).getTime(),end=sod+DAY-1;
  switch(k){
    case 'hoy':return [sod,end];
    case 'sem':return [sod-((n.getDay()+6)%7)*DAY,end];
    case 'mes':return [new Date(y,m,1).getTime(),end];
    case 'm3':return [new Date(y,m-2,1).getTime(),end];
    case 'm6':return [new Date(y,m-5,1).getTime(),end];
    case 'y1':return [new Date(y,m-11,1).getTime(),end];
    case 'todo':{const all=[...S.expenses,...S.incomes].map(x=>x.date);const a=all.length?Math.min(...all):sod;return [new Date(new Date(a).getFullYear(),new Date(a).getMonth(),1).getTime(),Math.max(end,...all)]}
    case 'fechas':{const f=perC.from?parseDate(perC.from)-DAY/2:sod-29*DAY,t=perC.to?parseDate(perC.to)+DAY/2-1:end;return [Math.min(f,t),Math.max(f,t)]}
    default:return [sod-29*DAY,end];
  }
}

function bucketsFor(R,items){
  const span=R[1]-R[0],a=new Date(R[0]);
  const unit=span<=15*DAY?'day':span<=75*DAY?'week':span<=800*DAY?'month':'year';
  let s;if(unit==='day')s=new Date(a.getFullYear(),a.getMonth(),a.getDate());else if(unit==='week'){s=new Date(a.getFullYear(),a.getMonth(),a.getDate());s.setDate(s.getDate()-((s.getDay()+6)%7))}else if(unit==='month')s=new Date(a.getFullYear(),a.getMonth(),1);else s=new Date(a.getFullYear(),0,1);
  const B=[],wk=new Intl.DateTimeFormat('es-DO',{weekday:'narrow'}),mo=new Intl.DateTimeFormat('es-DO',{month:'short'});
  while(s.getTime()<=R[1]&&B.length<60){
    const e=unit==='day'?new Date(s.getFullYear(),s.getMonth(),s.getDate()+1):unit==='week'?new Date(s.getFullYear(),s.getMonth(),s.getDate()+7):unit==='month'?new Date(s.getFullYear(),s.getMonth()+1,1):new Date(s.getFullYear()+1,0,1);
    const v=items.filter(x=>x.date>=s.getTime()&&x.date<e.getTime()).reduce(sumB,0);
    const l=unit==='day'?(span<=8*DAY?wk.format(s)+' '+s.getDate():String(s.getDate())):unit==='week'?s.getDate()+' '+mo.format(s).replace('.',''):unit==='month'?mo.format(s).replace('.',''):String(s.getFullYear());
    const cap=unit==='day'?dayShort.format(s):unit==='week'?'Semana del '+dateFmt.format(s):unit==='month'?monthFmt.format(s):'Año '+s.getFullYear();
    B.push({l,cap,v});s=e;
  }
  return {B,unit:{day:'por día',week:'por semana',month:'por mes',year:'por año'}[unit]};
}

function inMonth(ts,y,m){const t=new Date(ts);return t.getFullYear()===y&&t.getMonth()===m}
function budgetTotal(){return Object.values(S.catBudget||{}).reduce((a,b)=>a+(+b||0),0)}
function monthFlow(y,m){
  const inc=S.incomes.filter(x=>inMonth(x.date,y,m)).reduce((a,x)=>a+conv(x.amt,x.cur,S.base),0);
  const exp=S.expenses.filter(x=>inMonth(x.date,y,m)).reduce((a,x)=>a+conv(x.amt,x.cur,S.base),0);
  return {inc,exp,left:inc-exp,rate:inc>0?(inc-exp)/inc:null};
}
function recDue(r){const n=new Date(),last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();return new Date(n.getFullYear(),n.getMonth(),Math.min(r.day,last))}
function recStatus(r){
  if(r.lastPaid===ym())return {k:'paid',t:'Pagado'};
  const dd=daysTo(recDue(r));
  return dd<0?{k:'late',t:'Atrasado '+(-dd)+' d'}:dd===0?{k:'soon',t:'Vence hoy'}:dd<=5?{k:'soon',t:'En '+dd+' d'}:{k:'',t:'Día '+r.day};
}
function isLiquid(s){return s.liquid!==undefined?s.liquid:['Cuenta de ahorro','Fondo de inversión'].includes(s.type)}
function emergency(){
  const t=Date.now();
  const liquid=S.savings.filter(isLiquid).reduce((a,s)=>a+conv(savValue(s,t),s.cur,S.base),0);
  let ess=ESSENTIAL.reduce((a,k)=>a+conv(+(S.catBudget||{})[k]||0,'DOP',S.base),0);
  S.loans.forEach(l=>{if(paid(l)<l.months)ess+=conv(cuota(l.principal,l.rate,l.months),l.cur,S.base)});
  S.cards.forEach(c=>ess+=conv(minPay(c),c.cur,S.base));
  return {liquid,ess,months:ess>0?liquid/ess:0,target:S.emTarget||6};
}
function homeBalance(){ /* > 0: la otra persona te debe; < 0: le debes */
  if(!S.home||!S.home.on)return 0;
  return S.expenses.filter(x=>x.shared).reduce((a,x)=>a+(x.payer==='otro'?-1:1)*conv(x.amt,x.cur,S.base)/2,0)+conv(S.home.adj||0,'DOP',S.base);
}
