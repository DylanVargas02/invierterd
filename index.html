/* ---- Plan para salir de deudas ---- */
let planExtra=5000; /* en RD$ */
function debtsNow(){
  const d=[];
  S.loans.forEach(l=>{const k=paid(l);if(k>=l.months)return;const b=conv(balance(l.principal,l.rate,l.months,k),l.cur,S.base);if(b<1)return;
    d.push({name:l.name,bal:b,r:l.rate/1200,apr:l.rate,min:conv(cuota(l.principal,l.rate,l.months),l.cur,S.base),card:false})});
  S.cards.forEach(c=>{if(c.balance<=0)return;d.push({name:c.name,bal:conv(c.balance,c.cur,S.base),r:c.rate/1200,apr:c.rate,floor:conv(c.cur==='DOP'?500:10,c.cur,S.base),card:true})});
  return d;
}
const debtMin=x=>x.card?Math.min(x.bal,Math.max(x.bal*.05,x.floor)):Math.min(x.bal,x.min);
function runPlan(extra,method){ /* avalancha · bola · min */
  const D=debtsNow().map(x=>({...x,out:null}));if(!D.length)return null;
  const budget=D.reduce((a,x)=>a+debtMin(x),0)+extra;let m=0,int=0;
  while(m<600&&D.some(x=>x.bal>.5)){
    m++;D.forEach(x=>{if(x.bal>0){const i=x.bal*x.r;x.bal+=i;int+=i}});
    let pay=method==='min'?Infinity:budget;
    D.forEach(x=>{if(x.bal<=0)return;const p=Math.min(debtMin(x),pay);x.bal-=p;pay-=p});
    if(method!=='min'){const order=D.filter(x=>x.bal>0).sort(method==='avalancha'?(a,b)=>b.apr-a.apr||a.bal-b.bal:(a,b)=>a.bal-b.bal||b.apr-a.apr);
      for(const x of order){if(pay<=0)break;const p=Math.min(x.bal,pay);x.bal-=p;pay-=p}}
    D.forEach(x=>{if(x.bal<=.5&&x.out===null){x.bal=0;x.out=m}});
  }
  return {months:m,int,done:!D.some(x=>x.bal>.5),budget,order:[...D].sort((a,b)=>(a.out??1e9)-(b.out??1e9))};
}
function planOut(){
  const X0=conv(planExtra,'DOP',S.base),A=runPlan(X0,'avalancha'),B=runPlan(X0,'bola'),M=runPlan(0,'min');
  const fin=n=>{const d=new Date();d.setMonth(d.getMonth()+n);return monthShort.format(d)};
  const best=A.int<=B.int+.5?A:B, bestKey=best===A?'avalancha':'bola';
  const card=(key,R,title,tag)=>`<article class="plan${bestKey===key?' best':''}">${bestKey===key?'<span class="badge">Menos intereses</span>':'<span class="badge soft">Más motivación</span>'}<h3>${title}</h3><p class="pl-t">${tag}</p>
    <div class="kv2 num"><div><small>Sin deudas en</small><strong>${R.done?fin(R.months):'+50 años'}</strong></div><div><small>Intereses</small><strong>${esc(fmt(R.int,S.base,0))}</strong></div></div>
    <ol>${R.order.map(x=>`<li>${esc(x.name)} <span class="num">· ${x.out?fin(x.out):'—'}</span></li>`).join('')}</ol></article>`;
  const gain=M.done?`Comparado con pagar solo los mínimos, ahorras <b class="num">${esc(fmt(M.int-best.int,S.base,0))}</b> en intereses y terminas <b class="num">${Math.max(0,M.months-best.months)} meses</b> antes.`
    :`Pagando solo los mínimos, las tarjetas no se terminan de pagar en 50 años.`;
  return `<p class="hint num plan-tot">Pagarías <b>${esc(fmt(A.budget,S.base,0))}</b> al mes: los mínimos más el extra. Cuando terminas una deuda, ese dinero pasa a la siguiente.</p>
  <div class="plans">${card('avalancha',A,'Avalancha','Primero la tasa más alta.')}${card('bola',B,'Bola de nieve','Primero el saldo más pequeño.')}</div>
  <p class="base-note">${gain}</p>`;
}
function planHTML(){
  if(!debtsNow().length)return `<div class="empty" style="margin-top:14px">No tienes deudas activas.</div>`;
  return `<section class="plan-x"><div class="field"><label for="planX">Pago extra al mes <output class="num" id="planXo">${esc(fmt(conv(planExtra,'DOP',S.base),S.base,0))}</output></label><input type="range" id="planX" min="0" max="50000" step="500" value="${planExtra}"></div>
  <div id="planOut">${planOut()}</div></section>`;

/* ---------- Lectores de avisos: consumos con tarjeta y acuerdos de puestos de bolsa ---------- */
const MES={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11,ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,sept:8,oct:9,nov:10,dic:11};
const DATE_RX='(\\d{1,2}[\\/\\-.]\\d{1,2}[\\/\\-.]\\d{2,4}|\\d{4}-\\d{1,2}-\\d{1,2}|\\d{1,2}\\s+de\\s+[a-záéíóú]+\\s+(?:de|del)\\s+\\d{4}|\\d{1,2}[\\-\\s][a-z]{3,4}[\\-\\s]\\d{2,4})';
function parseDateEs(s){
  if(!s)return null;s=s.trim().toLowerCase();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return new Date(+m[1],+m[2]-1,+m[3]).getTime();
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]).getTime()}
  if((m=s.match(/^(\d{1,2})\s+de\s+([a-záéíóú]+)\s+(?:de|del)\s+(\d{4})$/))&&MES[m[2]]!==undefined)return new Date(+m[3],MES[m[2]],+m[1]).getTime();
  if((m=s.match(/^(\d{1,2})[\-\s]([a-z]{3,4})[\-\s](\d{2,4})$/))&&MES[m[2]]!==undefined){let y=+m[3];if(y<100)y+=2000;return new Date(y,MES[m[2]],+m[1]).getTime()}
  return null;
}
const clean=t=>String(t||'').replace(/ /g,' ').replace(/[ \t]+/g,' ').replace(/\r/g,'');
function curOf(sym,ctx){
  const s=(sym||'').toUpperCase();
  if(/US|USD|U\$S/.test(s))return 'USD';if(/EUR|€/.test(s))return 'EUR';if(/RD|DOP/.test(s))return 'DOP';
  if(ctx&&/d[oó]lares|USD|US\$/i.test(ctx)&&!/RD\$|DOP|pesos/i.test(ctx))return 'USD';
  return 'DOP';
}
const MONEY_RX=/(RD\$|US\$|U\$S|USD|DOP|EUR|€|\$)\s*([0-9][0-9.,]*[0-9])|([0-9][0-9.,]*[0-9])\s*(DOP|USD|EUR|pesos|d[oó]lares)/gi;

/* Categoría probable según el comercio */
const CAT_RULES=[
  ['comida',/SUPERMERC|SUPER |COLMADO|NACIONAL|BRAVO|JUMBO|SIRENA|PLAZA LAMA|CARREFOUR|PRICESMART|ALMACENES|REST|PIZZA|BURGER|CAFE|COFFEE|KFC|MCDONALD|WENDY|PANADER|FOOD|DELIVERY|PEDIDOSYA|UBER ?EATS|CARNIC|POLLO/],
  ['transporte',/SHELL|TEXACO|ESSO|TOTAL|SUNIX|PETRO|GASOLIN|ESTACION|COMBUSTIBLE|UBER(?! ?EATS)|INDRIVE|CABIFY|TAXI|PEAJE|PASO RAPIDO|PARQUEO|AUTO ?PARTS|GOMER/],
  ['salud',/FARMACIA|CAROL|CLINICA|HOSPITAL|LABORAT|REFERENCIA|AMADITA|MEDIC|ODONT|DENTAL|OPTICA|GYM|GIMNASIO|SMART FIT|BODY SHOP/],
  ['ocio',/NETFLIX|SPOTIFY|CINE|CARIBBEAN CINEMAS|PALACIO DEL CINE|DISNEY|HBO|MAX\.COM|PRIME VIDEO|STEAM|PLAYSTATION|XBOX|APPLE\.COM|GOOGLE \*|BAR |LOUNGE|DISCO|HOTEL|AIRBNB|BOOKING|EXPEDIA|AEROL|ARAJET|JETBLUE|AMERICAN AIR/],
  ['servicios',/EDESUR|EDENORTE|EDEESTE|CLARO|ALTICE|VIVA|CAASD|CORAASAN|WIND|INTERNET|TELECABLE|SEGURO|SURA|MAPFRE|HUMANO|PALIC/],
  ['educacion',/COLEGIO|ESCUELA|UNIVERSIDAD|INTEC|PUCMM|UNIBE|UASD|UNAPEC|APEC|LIBRER|CUESTA|COURSERA|UDEMY|PLATZI|DUOLINGO/],
  ['vivienda',/ALQUILER|INMOBILI|CONDOMINIO|MANTENIMIENTO|FERRETER|OCHOA|HOME DEPOT|IKEA|MUEBLES/]
];
function guessCat(merchant){const m=(merchant||'').toUpperCase();for(const [c,rx] of CAT_RULES)if(rx.test(m))return c;return 'otros'}

/* Aviso de consumo con tarjeta → {amt,cur,merchant,last4} o null */
function parseCardAlert(raw){
  const t=clean(raw), one=t.replace(/\n+/g,' ');
  if(!/(consumo|compra|transacci[oó]n|cargo|autorizad|fue utilizada|uso de (su|tu) tarjeta|retiro|purchase)/i.test(one))return null;
  if(/(pago (recibido|aplicado)|hemos recibido (su|tu) pago|abono a (su|tu)|reverso|devoluci[oó]n|estado de cuenta|promoci[oó]n|oferta especial|c[oó]digo de (seguridad|verificaci[oó]n)|token|OTP)/i.test(one)&&!/(consumo|compra) (por|de)/i.test(one))return null;
  if(!/(tarjeta|card|TC\b|d[eé]bito|cr[eé]dito|\*{2,}\d{4}|x{2,}\d{4})/i.test(one))return null;
  let best=null;
  const kw=one.search(/(monto|por (un )?(valor|monto) de|importe|por RD|por US|por \$|amount)/i);
  for(const m of one.matchAll(MONEY_RX)){
    const sym=m[1]||m[4], num=money(m[2]||m[3]);
    if(!(num>0)||num>5e7)continue;
    const near=kw>=0?Math.abs(m.index-kw):9999;
    if(!best||near<best.near)best={amt:num,cur:curOf(sym,one),near};
  }
  if(!best)return null;
  let merchant='';let mm;
  if((mm=one.match(/(?:comercio|establecimiento|merchant|lugar|negocio)\s*[:\-]\s*([^\n|;]{3,45}?)(?=\s+(?:fecha|monto|hora|tarjeta|el d[ií]a|por|referencia|ciudad|pa[ií]s)\b|[.;|]|$)/i)))merchant=mm[1];
  else{for(const m of one.matchAll(/\ben\s+(?:el\s+comercio\s+)?([A-Z0-9][A-Z0-9 &'.\-*\/#]{2,40}[A-Z0-9])(?=\s+(?:el|por|con|fecha|monto|a las|en fecha|de fecha|\d)|[.,;]|$)/g)){if(/[A-Z]{2}/.test(m[1])){merchant=m[1];break}}}
  merchant=merchant.replace(/\s{2,}/g,' ').trim().replace(/^(EL|LA)\s+COMERCIO\s+/,'');
  const l4=one.match(/(?:terminad[ao]s?\s+en|termina(?:da)?\s+en|finalizad[ao]\s+en|que termina en|[uú]ltimos\s+(?:4|cuatro)\s+d[ií]gitos\s*:?|ending in|\*{2,}|x{2,}|X{2,})\s*(\d{4})\b/i);
  return {amt:best.amt,cur:best.cur,merchant:merchant.toUpperCase()||'',last4:l4?l4[1]:'',kind:/retiro/i.test(one)?'retiro':'consumo'};
}

/* Acuerdo o confirmación de un puesto de bolsa → {rate,amt,cur,name,issuer,start,end,months} o null */
function parseBroker(raw,sender){
  const t=clean(raw), one=t.replace(/\n+/g,' ');
  if(!/(tasa|rendimiento|cup[oó]n|yield|ytm)/i.test(one))return null;
  const num='(\\d{1,2}(?:[.,]\\d{1,6})?)';
  const rateRx=new RegExp('(tasa(?:\\s+de)?(?:\\s+(?:rendimiento|cup[oó]n|inter[eé]s|anual|pactada|de\\s+compra|de\\s+colocaci[oó]n|efectiva))?|rendimiento(?:\\s+(?:anual|al\\s+vencimiento|a\\s+vencimiento|esperado|efectivo))?|yield|ytm)\\s*(?:\\(\\s*%\\s*\\))?\\s*(?:anual)?\\s*[:=]?\\s*'+num+'\\s*(%|por\\s*ciento)?','gi');
  let rate=null;
  for(const m of one.matchAll(rateRx)){
    const val=parseFloat(m[2].replace(',','.'));
    if(!(val>0.05&&val<40))continue;
    const lab=m[1].toLowerCase();
    const score=/rendimiento|yield|ytm|pactada|compra|colocaci|efectiva/.test(lab)?3:/cup/.test(lab)?1:2;
    if(!rate||score>rate.score)rate={val,score};
  }
  if(!rate)return null;
  const amtRx=/(monto\s+(?:a\s+liquidar|liquidado|invertido|transado|total|neto|de\s+la\s+operaci[oó]n|a\s+pagar|nominal)|monto|valor\s+(?:transado|de\s+compra|liquidado|a\s+pagar|efectivo|nominal|facial)|total\s+a\s+(?:pagar|liquidar|debitar)|importe(?:\s+total)?|capital(?:\s+invertido)?|inversi[oó]n)\s*(?:\(\s*(?:RD\$|US\$|DOP|USD)\s*\))?\s*[:=]?\s*(?:de\s+|por\s+)?(RD\$|US\$|DOP|USD|\$)?\s*([0-9][0-9.,]{2,}[0-9])/gi;
  let amt=null;
  for(const m of one.matchAll(amtRx)){
    const v=money(m[3]);if(!(v>=1000))continue;
    const lab=m[1].toLowerCase();
    const score=/liquid|pagar|transado|invertido|debitar|efectivo|neto|compra|capital|inversi/.test(lab)?3:/nominal|facial/.test(lab)?1:2;
    if(!amt||score>amt.score)amt={v,score,cur:curOf(m[2],one)};
  }
  if(!amt)return null;
  const dateAfter=lab=>{const m=one.match(new RegExp('('+lab+')\\s*[:=]?\\s*'+DATE_RX,'i'));return m?parseDateEs(m[2]):null};
  const start=dateAfter('fecha\\s+(?:valor|de\\s+liquidaci[oó]n|de\\s+operaci[oó]n|de\\s+pacto|de\\s+compra|de\\s+transacci[oó]n|de\\s+colocaci[oó]n|de\\s+emisi[oó]n)');
  const end=dateAfter('fecha\\s+de\\s+(?:vencimiento|redenci[oó]n|recompra|retroventa)|vencimiento|vence');
  let months=null;
  const pd=one.match(/plazo\s*[:=]?\s*(\d{1,4})\s*d[ií]as/i), pm=one.match(/plazo\s*[:=]?\s*(\d{1,3})\s*mes/i);

async function pdfText(bytes,pwds){

  if(unit==='dia')for(let i=N-1;i>=0;i--){const s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i);B.push({s:+s,e:+new Date(s.getFullYear(),s.getMonth(),s.getDate()+1),l:i%every===0?String(s.getDate()):'',cap:dayShort.format(s)})}
  else if(unit==='sem'){const m=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7));for(let i=N-1;i>=0;i--){const s=new Date(m.getFullYear(),m.getMonth(),m.getDate()-7*i);B.push({s:+s,e:+new Date(s.getFullYear(),s.getMonth(),s.getDate()+7),l:i%every===0?s.getDate()+' '+mo.format(s).replace('.',''):'',cap:'Semana del '+dateFmt.format(s)})}}
  else for(let i=N-1;i>=0;i--){const s=new Date(n.getFullYear(),n.getMonth()-i,1);B.push({s:+s,e:+new Date(n.getFullYear(),n.getMonth()-i+1,1),l:i%every===0?mo.format(s).replace('.','').slice(0,3)+(s.getMonth()===0||i===N-1?' '+String(s.getFullYear()).slice(2):''):'',cap:monthFmt.format(s)})}
  B.forEach(b=>{b.vi=S.incomes.filter(x=>x.date>=b.s&&x.date<b.e).reduce(sumB,0);b.ve=S.expenses.filter(x=>x.date>=b.s&&x.date<b.e).reduce(sumB,0)});
  return B;
}

function curMixHTML(t){

  if(!tot)return '';

  $('#sType').onchange=()=>{const ty=$('#sType').value;if(ACCT_TYPES.includes(ty))setMode('sin');else if(mode()==='sin'&&ty!=='Fondo de inversión'&&ty!=='Acciones')setMode('fecha');$('#sLiq').checked=ACCT_TYPES.includes(ty)||ty==='Fondo de inversión';sync()};
  document.querySelectorAll('[name=sMode]').forEach(r=>r.onchange=sync);sync();
  $('#f').onsubmit=e=>{e.preventDefault();const ty=$('#sType').value,cash=ty==='Efectivo',P=money($('#sAmt').value),r=cash?0:rate($('#sRate').value||'0'),m=mode(),start=parseDate($('#sStart').value||today()),ent=readEnt('sEnt');
    if(!(P>0))return $('#err').textContent='Escribe el monto en números, por ejemplo 1500.';if(!(r>=0&&r<100))return $('#err').textContent='La tasa debe estar entre 0 y 100 %.';
    const x={id:uid(),entity:ent||'Sin entidad',type:ty,cur:$('#sCur').value,principal:P,rate:r,start,isr:!cash&&$('#sIsr').checked,liquid:$('#sLiq').checked};
    if(m==='fecha'){const dv=$('#sDue').value;if(!dv)return $('#err').textContent='Elige la fecha de vencimiento o marca «No vence».';const due=parseDate(dv);if(!(due>start+DAY/2))return $('#err').textContent='La fecha de vencimiento debe ser posterior a la de inicio.';x.due=due;x.months=Math.max(1,Math.round((due-start)/MONTH))}
    else if(m==='meses'){const mo=parseInt($('#sMon').value,10);if(!(mo>0))return $('#err').textContent='El plazo debe ser de al menos 1 mes.';x.months=mo}
    else{x.open=true;x.months=1}
    x.name=$('#sName').value.trim()||(ty==='Efectivo'?'Efectivo':(ty==='Sell Buy Back (SBB)'?'SBB':ty)+(ent?' · '+ent:''));
    if(ed){x.id=ed.id;delete ed.due;delete ed.open;Object.assign(ed,x);save();close();render();toast('Cambios guardados');return}
    S.savings.push(x);save();close();if(view!=='resumen'){view='ahorros';try{localStorage.setItem(KEY+'.view',view)}catch(err){}}render();window.scrollTo({top:0});toast('Guardado')};
}

function openCard(id){
  const ed=id?S.cards.find(x=>x.id===id):null,v=ed||{};
  sheet(`<h3>${ed?'Editar tarjeta':'Nueva tarjeta'}</h3><form class="form" id="f">
  <div class="field"><label for="cName">Nombre</label><input id="cName" value="${esc(v.name||'')}" placeholder="Ej. Tarjeta Platinum" maxlength="40"></div>
  <div class="field"><label for="cEnt">Entidad</label>${entPick('cEnt',v.entity||'')}</div><div class="field"><label for="cCur">Moneda</label>${curSel('cCur',v.cur||'DOP')}</div>
  <div class="two"><div class="field"><label for="cLim">Límite</label><input id="cLim" data-money="cCur" inputmode="decimal" value="${ed?v.limit:''}" placeholder="0.00"></div><div class="field"><label for="cBal">Consumido hoy</label><input id="cBal" data-money="cCur" inputmode="decimal" value="${ed?+v.balance.toFixed(2):''}" placeholder="0.00"></div></div>
  <div class="two"><div class="field"><label for="cRate">Tasa anual %</label><input id="cRate" inputmode="decimal" value="${ed?v.rate:''}" placeholder="60"></div><div class="field"><label for="cDay">Día límite de pago</label><input id="cDay" inputmode="numeric" value="${ed?v.payDay:''}" placeholder="15"></div></div>
  <div class="field"><label for="c4">Últimos 4 dígitos <span class="opt">opcional, para reconocer los avisos del correo</span></label><input id="c4" inputmode="numeric" maxlength="4" value="${esc(v.last4||'')}" placeholder="1234"></div>
  <div class="err" id="err"></div><button class="btn" type="submit">${ed?'Guardar cambios':'Guardar'}</button>
  ${ed?`<button type="button" class="link-btn danger del-link" id="cDel">Eliminar tarjeta</button>`:''}</form>`,'var(--debt)');
  if(ed)$('#cDel').onclick=()=>confirmDel(ed.name,delDetail('cards',ed),()=>removeItem('cards',ed.id));
  $('#f').onsubmit=ev=>{ev.preventDefault();const lim=money($('#cLim').value),bal=money($('#cBal').value||'0'),r=rate($('#cRate').value),day=parseInt($('#cDay').value,10),name=$('#cName').value.trim();
    if(!name)return $('#err').textContent='Ponle un nombre a la tarjeta.';if(!(lim>0))return $('#err').textContent='Escribe el límite en números, por ejemplo 50000.';if(!(bal>=0))return $('#err').textContent='Lo consumido no puede ser negativo.';if(bal>lim)return $('#err').textContent='Lo consumido no puede ser mayor que el límite.';if(!(r>=0&&r<200))return $('#err').textContent='Revisa la tasa anual.';if(!(day>=1&&day<=31))return $('#err').textContent='El día de pago va de 1 a 31.';
    const x={name,entity:readEnt('cEnt')||'Sin entidad',cur:$('#cCur').value,limit:lim,balance:bal,rate:r,payDay:day,last4:$('#c4').value.replace(/\D/g,'').slice(0,4)};
    if(ed)Object.assign(ed,x);else S.cards.push({id:uid(),...x});
    save();close();if(view==='prestamos')credSeg='tarjetas';render();toast(ed?'Cambios guardados':'Tarjeta guardada')};
}

function openLoan(){
  sheet(`<h3>Registrar mi préstamo</h3><form class="form" id="f">
  <div class="field"><label for="lName">Nombre</label><input id="lName" placeholder="Ej. Préstamo de vehículo" maxlength="50"></div>
  <div class="field"><label for="lEnt">Entidad</label>${entPick('lEnt','')}</div><div class="field"><label for="lType">Tipo</label><select id="lType">${['Hipotecario','Vehículo','Comercial','Personal','Tarjeta / otro'].map(t=>`<option>${t}</option>`).join('')}</select></div>
  <div class="two"><div class="field"><label for="lAmt">Monto prestado</label><input id="lAmt" data-money="lCur" inputmode="decimal" placeholder="0.00"></div><div class="field"><label for="lCur">Moneda</label>${curSel('lCur','DOP')}</div></div>
  <div class="two"><div class="field"><label for="lRate">Tasa anual %</label><input id="lRate" inputmode="decimal" placeholder="12.00"></div><div class="field"><label for="lMon">Plazo (meses)</label><input id="lMon" inputmode="numeric" placeholder="60"></div></div>
  <div class="field"><label for="lStart">Fecha de desembolso</label><input type="date" id="lStart" value="${today()}"></div>
  <div class="err" id="err"></div><button class="btn" type="submit">Guardar</button></form>`,'var(--debt)');
  $('#f').onsubmit=e=>{e.preventDefault();const P=money($('#lAmt').value),r=rate($('#lRate').value),mo=parseInt($('#lMon').value,10),name=$('#lName').value.trim();
    if(!name)return $('#err').textContent='Ponle un nombre al préstamo.';if(!(P>0))return $('#err').textContent='Escribe el monto en números, por ejemplo 1500.';if(!(r>=0&&r<100))return $('#err').textContent='La tasa debe estar entre 0 y 100 %.';if(!(mo>0))return $('#err').textContent='El plazo debe ser de al menos 1 mes.';
    S.loans.push({id:uid(),name,entity:readEnt('lEnt')||'Sin entidad',type:$('#lType').value,cur:$('#lCur').value,principal:P,rate:r,months:mo,start:parseDate($('#lStart').value)});
    save();close();render();toast('Préstamo guardado')};
}
function openSettings(){
  sheet(`<h3>Ajustes</h3><form class="form" id="f">
  <div class="field"><label for="aBase">Ver los montos en</label><select id="aBase"><option value="DOP" ${S.base==='DOP'?'selected':''}>Pesos (RD$)</option><option value="USD" ${S.base==='USD'?'selected':''}>Dólares (US$)</option></select></div>
  <div class="two"><div class="field"><label for="aUsd">RD$ por 1 USD</label><input id="aUsd" inputmode="decimal" value="${S.rates.USD}"></div><div class="field"><label for="aEur">RD$ por 1 EUR</label><input id="aEur" inputmode="decimal" value="${S.rates.EUR}"></div></div>
  <p class="hint">Tasas de ejemplo; en producción vienen del BCRD.</p>
  <label class="check"><input type="checkbox" id="aHome" ${S.home.on?'checked':''}><span>Compartir gastos del hogar con otra persona</span></label>
  <div class="field"><label for="aPartner">Nombre de esa persona</label><input id="aPartner" value="${esc(S.home.partner||'')}" maxlength="24" placeholder="Ej. Ana"></div>
  <div class="field"><label for="aTheme">Apariencia</label><select id="aTheme"><option value="">Según el teléfono</option><option value="light" ${S.theme==='light'?'selected':''}>Clara</option><option value="dark" ${S.theme==='dark'?'selected':''}>Oscura</option></select></div>
  <div class="err" id="err"></div><button class="btn" type="submit">Guardar</button>
  <div class="two"><button class="btn ghost" type="button" id="aAcc">Tu cuenta</button><button class="btn ghost" type="button" id="aPrv">Privacidad</button></div>
  <div class="two"><button class="btn ghost" type="button" id="aMail">Correo y documentos</button><button class="btn ghost" type="button" id="aOnb">Repetir la guía inicial</button></div>
  <div class="two"><button class="btn ghost" type="button" id="aEx">Cargar ejemplo</button><button class="btn ghost" type="button" id="aBlank">Empezar en blanco</button></div></form>`,'var(--ink)');
  $('#aMail').onclick=()=>{close();openMail()};
  $('#aAcc').onclick=()=>{close();openAccount()};
  $('#aPrv').onclick=()=>{close();openPrivacy()};
  $('#aOnb').onclick=()=>{close();openOnboarding(true)};
  $('#f').onsubmit=e=>{e.preventDefault();const u=rate($('#aUsd').value),eu=rate($('#aEur').value);
    if(!(u>0&&eu>0))return $('#err').textContent='Las tasas de cambio deben ser mayores que cero.';
    S.base=$('#aBase').value;S.rates={DOP:1,USD:u,EUR:eu};S.theme=$('#aTheme').value||null;S.home.on=$('#aHome').checked;S.home.partner=$('#aPartner').value.trim();
    if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme');
    save();close();render();toast('Ajustes guardados')};
  $('#aEx').onclick=()=>{const keep={base:S.base,rates:S.rates,theme:S.theme};S=Object.assign(sample(),keep);save();close();render();toast('Datos de ejemplo cargados')};
  $('#aBlank').onclick=()=>{S=blank();save();close();render();toast('Listo. Todo en blanco')};
}
let tt;function undoToast(m,fn){clearTimeout(tt);let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.innerHTML='<span>'+esc(m)+'</span><button type="button" id="undoBtn">Deshacer</button>';$('#undoBtn').onclick=()=>{clearTimeout(tt);el.remove();fn()};tt=setTimeout(()=>el.remove(),5000)}
function toast(m){clearTimeout(tt);let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;tt=setTimeout(()=>el.remove(),2200)}

/* ---------- Bucles en vivo ---------- */
let last=0;
function fitBig(){document.querySelectorAll('.deep .big').forEach(el=>{const n=el.textContent.length;el.style.setProperty('--bs',n>13?`max(22px, calc(min(9vw, 40px) * ${(13/n).toFixed(3)}))`:'clamp(30px,9vw,40px)')})}
let lastLen=0;
function tickLive(){
  const t=Date.now();
  if(view==='resumen'){const F=snapshot(t),nb=$('#netBig');if(nb){nb.innerHTML=split(netValue(F),S.base,2);if(nb.textContent.length!==lastLen){lastLen=nb.textContent.length;fitBig()}$('#netA').textContent=fmt(F.assets,S.base,0);const nd=$('#netD');if(nd)nd.textContent=fmt(accts().reduce((a,s)=>a+conv(savValue(s,t),s.cur,S.base),0),S.base,0);S.savings.forEach(s=>{const a=document.querySelector(`[data-sv="${s.id}"]`);if(a)a.textContent=fmt(savValue(s,t),s.cur,2)})}return}
  if(view!=='ahorros')return;
  const T=totals(t), lt=$('#liveTotal'); if(!lt)return;
  lt.innerHTML=split(T.v,S.base,4);
  $('#liveGain').textContent=fmt(T.v-T.p,S.base,0);
  const wS=$('#wgS'),wM=$('#wgM');if(wS)wS.firstChild.nodeValue=fmt(T.v,S.base,0);if(wM)wM.firstChild.nodeValue=fmt(T.v,S.base,4);
  S.savings.forEach(s=>{const v=savValue(s,t),a=document.querySelector(`[data-sv="${s.id}"]`),b=document.querySelector(`[data-si="${s.id}"]`);if(a)a.textContent=fmt(v,s.cur,2);if(b)b.textContent='+'+fmt(v-s.principal,s.cur,2)});
}
function loop(ts){if(ts-last>(reduce?1000:100)){last=ts;tickLive()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
setInterval(()=>{
  STOCKS.forEach(s=>{const sigma=s.sym==='MH-2034'?.0004:.0018;const nx=s.price*(1+(Math.random()-.5)*2*sigma);s.dir=Math.sign(nx-s.price);s.price=nx;s.hist.push(nx);s.hist.shift()});
  if(view==='mercado'&&mktSeg==='acciones'){const el=$('#ticks');if(el)el.innerHTML=ticksHTML()}
},reduce?5000:1500);

normalizeS();
try{if(getCed())S.mail.keepCed=true}catch(e){}
render();
if(!S.onboarded&&!S.onbDismissed)openOnboarding(true);
if(isPublished()&&canCloud()){let has=false;try{has=!!localStorage.getItem(KEY+'.auth')}catch(e){}if(/access_token=|error_description=/.test(location.hash||''))sessionFromUrl();else if(has)sbClient().catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullIfNewer()});
window.addEventListener('online',()=>{if(sbUser&&(S._upd||0)>(S._synced||0))pushNow()});
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
