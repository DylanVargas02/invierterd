<!doctype html>
<html lang="es-DO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InvierteRD</title>
<meta name="description" content="Tus gastos, ahorros, tarjetas, préstamos e inversiones en un solo lugar.">
<meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08110F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="InvierteRD">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna tipo teléfono. El dinero vive en el tercio superior (lectura); las acciones viven abajo, en la zona del pulgar (barra + botón flotante). */
:root{
  /* Neutros crema: cálidos y tranquilos */
  --bg:#F6F1E7; --surface:#FFFCF6; --surface-2:#EEE7D9; --ink:#1E1A14; --ink-2:#655C4E; --line:#E5DBCA;
  /* Semántica financiera: esmeralda = crecer, coral = dinero que sale, ámbar = deuda, índigo = mercado */
  --grow:#007A58; --grow-soft:#D9F4E9; --spend:#C93A28; --spend-soft:#FFE5DF;
  --debt:#9A6200; --debt-soft:#FFEFCF; --market:#4A4FDE; --market-soft:#E6E7FC;
  /* Pantallas protagonistas: cada sección tiene su tono profundo y su brillo */
  --grow-deep:#04382B; --grow-deep2:#0B6B4F; --grow-glow:#7CF2C4;
  --spend-deep:#4A1410; --spend-deep2:#9A3022; --spend-glow:#FFB4A4;
  --debt-deep:#3B2604; --debt-deep2:#7D5208; --debt-glow:#FFD27A;
  --on-deep:#FFFFFF;
  --cart1a:#0D2944; --cart1b:#1E5D93; --cart2a:#2A1242; --cart2b:#6B2D8C; --cart3a:#05302A; --cart3b:#137059; --cart4a:#3A1A0A; --cart4b:#8C4C13;
  --promo-deep:#1B1C57; --promo-deep2:#4337B8; --promo-glow:#C3B8FF;
  /* Distintivos de institución por sector */
  --i-banco:#3A45C2; --i-asoc:#0B8577; --i-afi:#7D3BC4; --i-gov:#3E5560; --i-ink:#FFFFFF;
  --widget:#04382B; --widget-ink:#EAFBF4; --widget-accent:#7CF2C4;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:24px; --r-md:16px; --r-sm:11px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08110F; --surface:#101C19; --surface-2:#182824; --ink:#E6F2EE; --ink-2:#93AAA3; --line:#20332D;
  --grow:#2FD39F; --grow-soft:#0F3529; --spend:#FF7A64; --spend-soft:#3A1913;
  --debt:#F0B341; --debt-soft:#36270C; --market:#8F96FF; --market-soft:#1E214D;
  --grow-deep:#06322A; --grow-deep2:#0D5A44; --grow-glow:#6EF0BD;
  --spend-deep:#3A120E; --spend-deep2:#7A2519; --spend-glow:#FFB09E;
  --debt-deep:#2F1F05; --debt-deep2:#664309; --debt-glow:#FFD27A;
  --i-banco:#5560E0; --i-asoc:#14A08F; --i-afi:#9555DB; --i-gov:#56717D;
  --promo-deep:#17174A; --promo-deep2:#3A2F9E; --promo-glow:#C3B8FF;
  --widget:#06322A; --widget-ink:#E8FAF2; --widget-accent:#6EF0BD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08110F; --surface:#101C19; --surface-2:#182824; --ink:#E6F2EE; --ink-2:#93AAA3; --line:#20332D;
  --grow:#2FD39F; --grow-soft:#0F3529; --spend:#FF7A64; --spend-soft:#3A1913;
  --debt:#F0B341; --debt-soft:#36270C; --market:#8F96FF; --market-soft:#1E214D;
  --grow-deep:#06322A; --grow-deep2:#0D5A44; --grow-glow:#6EF0BD;
  --spend-deep:#3A120E; --spend-deep2:#7A2519; --spend-glow:#FFB09E;
  --debt-deep:#2F1F05; --debt-deep2:#664309; --debt-glow:#FFD27A;
  --i-banco:#5560E0; --i-asoc:#14A08F; --i-afi:#9555DB; --i-gov:#56717D;
  --promo-deep:#17174A; --promo-deep2:#3A2F9E; --promo-glow:#C3B8FF;
  --widget:#06322A; --widget-ink:#E8FAF2; --widget-accent:#6EF0BD; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand-mark{width:30px;height:30px;border-radius:10px;background:var(--grow);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px;stroke:var(--surface);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.top-actions{display:flex;gap:8px;align-items:center}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.notice{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);margin-block:0 12px}
.notice b{color:var(--ink)}
.notice button{margin-left:auto;flex-shrink:0;border:0;background:none;color:var(--ink);font-weight:700;font-size:13px;text-decoration:underline;padding:0}

h1.view-title{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.025em;margin:6px 0 4px;text-wrap:balance}
.view-sub{color:var(--ink-2);font-size:14px;margin:0 0 16px}
h2.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:700;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec button{border:0;background:none;text-transform:none;letter-spacing:0;font-size:13px;font-weight:700;color:var(--accent,var(--market));padding:0}

/* Hero: el número que crece */
/* Tarjetas protagonistas: tono profundo de la sección + brillo para la cifra clave */
.deep{border-radius:var(--r-lg);padding:20px 20px 18px;position:relative;overflow:hidden;color:var(--on-deep);
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--glow) 22%,transparent),transparent 55%),linear-gradient(150deg,var(--d1),var(--d2))}
.deep::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:1px solid color-mix(in srgb,var(--glow) 25%,transparent);box-shadow:0 0 0 22px color-mix(in srgb,var(--glow) 5%,transparent),0 0 0 46px color-mix(in srgb,var(--glow) 3%,transparent);pointer-events:none}
.deep>*{position:relative;z-index:1}
.hero{--d1:var(--grow-deep);--d2:var(--grow-deep2);--glow:var(--grow-glow)}
.spend-card{--d1:var(--spend-deep);--d2:var(--spend-deep2);--glow:var(--spend-glow)}
.debt-card{--d1:var(--debt-deep);--d2:var(--debt-deep2);--glow:var(--debt-glow)}
.deep .lbl{font-size:13px;font-weight:600;color:color-mix(in srgb,var(--on-deep) 72%,transparent)}
.deep .big{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,40px);letter-spacing:-.03em;line-height:1.05;margin-top:6px;color:var(--on-deep);word-break:break-all}
.deep .big .dec{font-size:.5em;color:var(--glow);font-weight:700;letter-spacing:0}
.deep .glow{color:var(--glow)}
.pace{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.pace div,.deep .kv div{background:color-mix(in srgb,var(--on-deep) 9%,transparent);border:1px solid color-mix(in srgb,var(--on-deep) 10%,transparent);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
.pace small,.deep .kv small{display:block;font-size:11px;color:color-mix(in srgb,var(--on-deep) 68%,transparent);font-weight:600}
.pace strong{display:block;font-size:13px;color:var(--glow);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deep .kv strong{color:var(--on-deep)}
.deep .bar{background:color-mix(in srgb,var(--on-deep) 16%,transparent)}
.deep .budget-line{color:color-mix(in srgb,var(--on-deep) 72%,transparent)}
.deep .tip{background:color-mix(in srgb,var(--on-deep) 10%,transparent);color:var(--on-deep)}
.deep .tip b{color:var(--glow)}
.hero-pulse{position:absolute;right:16px;top:18px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--glow);text-transform:uppercase;letter-spacing:.08em}
.hero-pulse i{width:8px;height:8px;border-radius:50%;background:var(--glow);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--grow-glow) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}

/* Distintivo de institución: la forma y el color indican el sector */
.who{display:flex;gap:12px;align-items:center;min-width:0}
.who>div{min-width:0}
.inst{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;color:var(--i-ink);font-weight:800;font-size:12.5px;letter-spacing:-.01em;font-family:var(--f-display);background:var(--ic);box-shadow:inset 0 -3px 0 rgb(0 0 0 / .14)}
.inst.banco{--ic:var(--i-banco);border-radius:12px}
.inst.asoc{--ic:var(--i-asoc);border-radius:50%}
.inst.afi{--ic:var(--i-afi);border-radius:4px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);box-shadow:none}
.inst.gov{--ic:var(--i-gov);border-radius:8px 8px 20px 20px}
.inst.sm{width:34px;height:34px;font-size:11px}
.inst-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:0 0 10px}
.inst-legend span{display:flex;align-items:center;gap:6px}
.inst-legend .inst{width:14px;height:14px;font-size:0;box-shadow:none}

/* Listas tipo tarjeta, una sola elevación */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item-title{font-weight:700;font-size:15px}
.item-meta{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.item-val{text-align:right;font-weight:700;font-size:16px;white-space:nowrap}
.item-val small{display:block;font-size:12px;font-weight:600;color:var(--grow)}
.cur{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2);vertical-align:1px;margin-left:4px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--fill,var(--grow))}
.row-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);margin-top:6px;flex-wrap:wrap}
.del{border:0;background:none;color:var(--ink-2);font-size:12px;font-weight:600;padding:2px 0;text-decoration:underline}
.del[data-armed]{color:var(--spend)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-md);padding:22px 16px;text-align:center;color:var(--ink-2);font-size:14px}
.empty button{margin-top:10px}

/* Widget preview */
.widgets{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.wg{flex-shrink:0;background:var(--widget);color:var(--widget-ink);border-radius:24px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.wg.s{width:150px;height:150px}
.wg.m{width:300px;height:150px}
.wg .wl{font-size:11px;font-weight:700;opacity:.75;display:flex;align-items:center;gap:6px}
.wg .wl i{width:6px;height:6px;border-radius:50%;background:var(--widget-accent)}
.wg .wv{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.1;word-break:break-all}
.wg .wv small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--widget-accent);letter-spacing:0;margin-top:4px}
.wg .wrow{display:flex;justify-content:space-between;font-size:11px;opacity:.85}
.wg svg{width:100%;height:36px}

/* Gastos */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-nav button{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1}
.month-nav strong{font-family:var(--f-display);font-size:18px;text-transform:capitalize}
.budget-line{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px}
.tip{margin-top:12px;font-size:13.5px;border-radius:var(--r-sm);padding:10px 12px}
.cats{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.cat-row{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.cat-row .t{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.cat-row .t i{display:block;height:100%;border-radius:99px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.day-h{font-size:12px;font-weight:700;color:var(--ink-2);margin:14px 0 6px;text-transform:capitalize}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx-ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.tx-main{flex:1;min-width:0}
.tx-main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-main span{font-size:12px;color:var(--ink-2)}
.tx-amt{text-align:right;font-weight:700;white-space:nowrap}
.tx-amt small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-2)}
.tx-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:0 14px}

/* Préstamos */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.kv div{background:var(--surface);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
.kv small{display:block;font-size:11px;color:var(--ink-2);font-weight:600}
.kv strong{font-size:14px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .08)}
.sim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between}
.field label output{color:var(--ink);font-weight:700}
input[type=range]{width:100%;accent-color:var(--debt)}
.result{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.result small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:600}
.result strong{font-family:var(--f-display);font-size:20px;letter-spacing:-.02em}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.offer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.offer:last-child{border-bottom:0}
.offer b{font-weight:600}
.offer span{font-size:12px;color:var(--ink-2);display:block}
.rate-pill{font-weight:800;font-size:14px;border-radius:999px;padding:4px 10px;background:var(--debt-soft);color:var(--debt);white-space:nowrap}
.rate-pill.g{background:var(--grow-soft);color:var(--grow)}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 7px}

/* Mercado */
.tick{display:grid;grid-template-columns:1fr 84px auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tick:last-child{border-bottom:0}
.tick b{font-weight:700;display:block}
.tick span{font-size:12px;color:var(--ink-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick .px{text-align:right;font-weight:700;white-space:nowrap}
.chg{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px}
.chg.up{color:var(--grow);background:var(--grow-soft)}
.chg.dn{color:var(--spend);background:var(--spend-soft)}
.tick svg{width:84px;height:30px;overflow:visible}
.flash-up{animation:fu .7s}
.flash-dn{animation:fd .7s}
@keyframes fu{0%{color:var(--grow)}100%{}}
@keyframes fd{0%{color:var(--spend)}100%{}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-bottom:10px}
.chips button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prod{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.prod:last-child{border-bottom:0}
.prod .act{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2)}
.link-btn{border:0;background:none;color:var(--market);font-weight:700;font-size:13px;padding:0}

/* Noticias */
.news{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:6px}
.news h3{margin:0;font-size:16px;line-height:1.3;font-weight:700;text-wrap:balance}
.news p{margin:0;font-size:13.5px;color:var(--ink-2)}
.news .nm{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.src{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.src:last-child{border-bottom:0}
.src span{font-size:12px;color:var(--ink-2);font-weight:500;display:block}
.src em{font-style:normal;color:var(--market);font-weight:700}

/* Barra inferior: zona del pulgar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
nav.tabs .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:11px;font-weight:600;color:var(--ink-2)}
nav.tabs .ic{width:46px;height:28px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
nav.tabs svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--tc)}
nav.tabs button[aria-selected="true"] .ic{background:var(--tcs)}

.fab{position:fixed;z-index:21;right:max(calc(16px + env(safe-area-inset-right,0px)),calc((100vw - 480px)/2 + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));height:54px;border-radius:18px;border:0;background:var(--fab,var(--grow));color:var(--surface);display:flex;align-items:center;gap:8px;padding:0 18px 0 14px;font-weight:700;font-size:15px;box-shadow:0 8px 22px -6px color-mix(in srgb,var(--fab,var(--grow)) 70%,transparent)}
.fab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}

/* Hoja inferior */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(5 15 12 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--f-display);font-size:22px;letter-spacing:-.02em;margin:0 0 14px}
.form{display:flex;flex-direction:column;gap:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form input:not([type=checkbox]),.form select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.form input:focus,.form select:focus{outline:none;border-color:var(--accent,var(--grow))}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--grow)}
.btn{border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;background:var(--accent,var(--brand));color:var(--surface)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.err{color:var(--spend);font-size:13px;font-weight:600;min-height:1em}
.hint{font-size:12.5px;color:var(--ink-2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600}


/* ---- Distribución compacta ---- */
.brand>div{display:flex;flex-direction:column;line-height:1}
.brand small{font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.brand h1{margin:3px 0 0;font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:-.025em;line-height:1.05}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:32px}
.hero-pulse{position:static}
.pace.two{grid-template-columns:1fr 1fr}
.mbtn{border:0;width:32px;height:32px;border-radius:50%;font-size:19px;line-height:1;background:color-mix(in srgb,var(--on-deep) 12%,transparent);color:var(--on-deep)}
.mbtn:disabled{opacity:.3;cursor:default}
.cap{text-transform:capitalize;font-size:14px!important;color:var(--on-deep)!important}
.count{font-size:11px;font-weight:800;letter-spacing:0;background:var(--surface-2);color:var(--ink-2);border-radius:99px;padding:2px 8px;text-transform:none}
h2.sec{align-items:center;justify-content:flex-start;gap:8px;margin:24px 0 10px}
.row3{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.mid .item-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--ink-2)!important}
.foot{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--ink-2);font-weight:700}
.foot .bar{flex:1;margin:0}
.x{flex-shrink:0;border:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);padding:0}
.x svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.x.armed{background:var(--spend);color:var(--surface)}
.tx .x{margin-left:2px}
.mini{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.mini b{color:var(--ink);font-weight:700;margin-left:4px}
.cats{gap:0}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.stack i{display:block;min-width:4px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:14px}
.cat-grid div{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.cat-grid .dot{margin:0;flex-shrink:0}
.cat-grid .cn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.cat-grid b{font-weight:700;white-space:nowrap}
.day-h{margin:12px 0 6px}
.sim{margin-top:10px}
.sim-out{display:flex;flex-direction:column;gap:10px}
.offer{cursor:pointer}
.offer .who span{font-size:12px}
.news-row{padding:12px 0;border-bottom:1px solid var(--line)}
.news-row:last-child{border-bottom:0}
.news-row h3{margin:4px 0 0;font-size:15px;font-weight:700;line-height:1.3;text-wrap:balance}
.news-row .nm{display:flex;gap:8px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.news-row .nm span:first-child{color:var(--market);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.src em{font-size:15px}
.seg{margin-bottom:2px}
.chips{margin:12px 0 0}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .btn{margin:0;padding:10px 18px}
.widgets{padding-bottom:6px}


/* ---- Espacio de ofertas y promociones ---- */
.promo{margin-top:14px}
.promo-rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-2px;padding:2px}
.promo-rail::-webkit-scrollbar{display:none}
.pcard{--d1:var(--promo-deep);--d2:var(--promo-deep2);--glow:var(--promo-glow);flex:0 0 calc(100% - 36px);scroll-snap-align:start;min-height:138px;padding:14px 16px 14px;display:flex;flex-direction:column;gap:4px}

.pcard .ptop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ptag{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--glow);background:color-mix(in srgb,var(--glow) 16%,transparent);border-radius:6px;padding:3px 7px}
.pcard .pkind{font-size:12px;font-weight:700;color:color-mix(in srgb,var(--on-deep) 70%,transparent);margin-top:4px}
.pcard h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1.1;color:var(--on-deep);text-wrap:balance}
.pcard p{margin:0;font-size:12.5px;color:color-mix(in srgb,var(--on-deep) 70%,transparent)}
.pcta{align-self:flex-start;margin-top:8px;border:0;border-radius:11px;padding:8px 14px;font-weight:800;font-size:13px;background:var(--glow);color:var(--promo-deep)}
.pclose{border:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;padding:0;background:color-mix(in srgb,var(--on-deep) 12%,transparent);color:var(--on-deep)}
.pclose svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.pdots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.pdots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:width .2s,background .2s}
.pdots i.on{width:16px;background:var(--promo-deep2)}
.promo-row{background:color-mix(in srgb,var(--promo-glow) 14%,transparent);margin-inline:-14px;padding-inline:14px!important;width:calc(100% + 28px)}
.promo-row .ptag{color:var(--promo-deep2);background:color-mix(in srgb,var(--promo-deep2) 12%,transparent);margin-left:6px;vertical-align:1px}
.inst.promo{--ic:var(--promo-deep2);border-radius:12px}


/* ---- Resumen ---- */
.hero.neg{--d1:var(--debt-deep);--d2:var(--debt-deep2);--glow:var(--debt-glow)}
.seg-mini{display:flex;background:color-mix(in srgb,var(--on-deep) 12%,transparent);border-radius:10px;padding:3px;gap:2px}
.seg-mini button{border:0;background:none;color:color-mix(in srgb,var(--on-deep) 78%,transparent);font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;white-space:nowrap}
.seg-mini button[aria-pressed="true"]{background:var(--on-deep);color:var(--d1)}
.balance{display:flex;gap:3px;height:8px;border-radius:99px;overflow:hidden;margin-top:14px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}

.tile .ts{font-size:12px;color:var(--ta);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}

.crow b{font-weight:700;white-space:nowrap}
.crow.total{font-weight:800}
.crow.total b{font-family:var(--f-display);font-size:17px;font-weight:800}
.due{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2)}
.due.soon{background:var(--debt-soft);color:var(--debt)}
/* ---- Tarjetas de crédito ---- */
.ccwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:10px}
.ccard{border-radius:18px;padding:14px 16px 16px;color:var(--on-deep);background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.ccard::after{content:"";position:absolute;right:-50px;top:-70px;width:190px;height:190px;border-radius:50%;background:color-mix(in srgb,var(--on-deep) 7%,transparent);pointer-events:none}
.ccard>*{position:relative;z-index:1}
.cc-top{display:flex;align-items:center;gap:10px}
.cc-id{flex:1;min-width:0;display:flex;flex-direction:column}

.cc-id span{font-size:12px;color:color-mix(in srgb,var(--on-deep) 70%,transparent)}
.ccard .x{background:color-mix(in srgb,var(--on-deep) 15%,transparent);color:var(--on-deep)}
.ccard .x.armed{background:var(--spend)}
.cc-bal small{display:block;font-size:11.5px;color:color-mix(in srgb,var(--on-deep) 70%,transparent);font-weight:600}
.cc-bal strong{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.cc-bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--on-deep) 18%,transparent);overflow:hidden}
.cc-bar i{display:block;height:100%;border-radius:99px}
.cc-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:color-mix(in srgb,var(--on-deep) 82%,transparent)}
.cc-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cc-info div{background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px;min-width:0}

.cc-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.cc-zero{display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--grow);background:var(--grow-soft);border-radius:14px}


/* ---- Mejoras tras la simulación ---- */
.deep .big{font-size:var(--bs,clamp(30px,9vw,40px));word-break:normal;overflow-wrap:anywhere}

.toast{display:flex;align-items:center;gap:14px}
.toast button{border:0;background:none;color:var(--grow-glow);font-weight:800;font-size:14px;padding:4px 2px;text-decoration:underline}


/* ---- Hogar: ingresos, presupuesto, fijos, metas, plan de deudas ---- */
.capz{text-transform:capitalize}
.sheet-seg{margin-bottom:14px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-top:14px}

.mstats.three{grid-template-columns:repeat(3,1fr)}
.mstats div{min-width:0}
.mstats small{display:block;font-size:11px;color:var(--ink-2);font-weight:600}

.mini-btn{flex-shrink:0;border:0;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--ink)}

.tx-amt.pos{color:var(--grow)}
.sh{color:var(--market);font-weight:600}
.liq{color:var(--grow);font-weight:600}
.due.paid{background:var(--grow-soft);color:var(--grow)}
.due.late{background:var(--spend-soft);color:var(--spend)}
.bud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.bud .bar{grid-column:2/-1;margin:0}
.lvl-ok{color:var(--grow);background:var(--grow-soft)}
.lvl-warn{color:var(--debt);background:var(--debt-soft)}
.lvl-over{color:var(--spend);background:var(--spend-soft)}
.lvl-none{color:var(--ink-2);background:var(--surface-2)}
.bud-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emerg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-top:14px}
.em-big{font-family:var(--f-display);font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.em-big small{font-family:var(--f-body);font-size:14px;color:var(--ink-2);font-weight:600;margin-left:8px;letter-spacing:0}
.months{display:grid;gap:4px;margin:12px 0 10px}
.months i{display:block;height:10px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.months b{display:block;height:100%}
.em-t{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.em-t b{color:var(--ink)}
.goal{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center}

.plan{border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--bg)}
.plan.best{border-color:var(--debt);background:color-mix(in srgb,var(--debt-soft) 45%,var(--surface))}
.plan h3{margin:0;font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.pl-t{margin:-4px 0 0;font-size:12.5px;color:var(--ink-2)}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv2 small{display:block;font-size:11px;color:var(--ink-2);font-weight:600}
.kv2 strong{font-size:14px;white-space:nowrap}
.plan ol{margin:2px 0 0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:3px}

.badge{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--debt);color:var(--surface)}

.base-note{margin:12px 0 0;font-size:13.5px;color:var(--ink-2)}

.settle{font-size:18px;margin:0}

.tiles{grid-auto-rows:1fr}


/* ---- Ajustes visuales ---- */
[hidden]{display:none!important}
.capz,.cap{display:inline-block;text-transform:none}
