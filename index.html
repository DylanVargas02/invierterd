.tour-card{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:18px;padding:16px;box-shadow:0 18px 40px -16px rgb(0 0 0 / .5)}
.tour-card.end{top:50%;transform:translateY(-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.tour-tree{width:110px;height:110px}
.tour-card h3{margin:2px 0 6px;font-size:19px;font-weight:800;letter-spacing:-.02em}
.tour-card h3:focus{outline:none}
.tour-card p{margin:0 0 12px;font-size:14px;color:var(--ink-2)}
.tour-n{font-size:12px!important;font-weight:700;margin:0!important}
.tour-b{display:flex;align-items:center;gap:8px}
.tour-b .o-link{margin-right:auto}
.tour-b .btn{padding:10px 16px}
.tour-card.end .btn{width:100%}
/* cuenta */
.pw{display:flex;gap:6px;align-items:stretch}.pw input{flex:1;min-width:0}
.pw-eye{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-weight:700;color:var(--ink-2)}
.acc-tabs{margin:2px 0}
.acc-tabs button{flex:1}
.acc-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (min-width:1000px){
  .mk-cmpbar{bottom:16px}
  .tour-card{left:auto;right:auto}
  .wel-in{padding-top:48px}
}
@media (prefers-reduced-motion: reduce){.sp-word,.tg,.o-enter{animation:none!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ===== Identidad Caoba (etapa 2): símbolo, arranque y bienvenida ===== */

/* Arranque: los anillos se dibujan y el billete entra */
.sp-in{gap:14px}
.sp-logo{width:min(36vw,148px);height:auto;overflow:visible}
.sp-logo path{stroke-dasharray:1;stroke-dashoffset:1;animation:lgDraw .85s cubic-bezier(.6,.05,.3,1) forwards}
.sp-logo path:nth-child(2){animation-delay:.22s}
.sp-logo .lg-bill{opacity:0;transform:translate(10px,-8px);animation:lgBill .55s cubic-bezier(.2,.9,.3,1.15) .85s forwards}
@keyframes lgDraw{to{stroke-dashoffset:0}}
@keyframes lgBill{to{opacity:1;transform:none}}
.sp-word{animation-delay:1s}
.sp-name{font-size:38px}
.sp-slogan{font-size:15px;font-weight:600;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){.sp-logo path{stroke-dashoffset:0;animation:none}.sp-logo .lg-bill{opacity:1;transform:none;animation:none}}

/* Bienvenida */
.wel-brand{gap:12px}
.wel-sym{width:52px;height:52px;flex:none}
.wel-name{display:flex;flex-direction:column;line-height:1.1}
.wel-name .wordmark{font-size:30px}
.wel-name small{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-top:3px}
.wel h2{margin-top:30px}
.wel-forgot{align-self:center;font-size:14px;font-weight:600;color:var(--ink-2);padding:6px 10px}
.wel-mkt{border-color:var(--line);color:var(--ink)}
.wel-mkt:hover{background:var(--surface-2)}
.wel-ic{background:var(--menta);color:var(--grow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wel-ic{background:var(--grow-soft)}}
:root[data-theme="dark"] .wel-ic{background:var(--grow-soft)}


/* ===== Navegación de 5 pestañas ===== */
nav.tabs .inner{grid-template-columns:repeat(5,1fr)}
nav.tabs [data-tab="mercado"]{display:flex}
nav.tabs button{font-size:11.5px;letter-spacing:-.01em}
@media (max-width:360px){nav.tabs button{font-size:10.5px}}
nav.tabs .side-brand .rd{color:inherit}

/* Selector superior de cada pestaña (Gastos/Ingresos, Cuentas/Crédito/Conectadas) */
.seg.seg-top{margin:2px 0 14px;padding:4px;border-radius:14px;background:var(--surface-2);border:0}
.seg.seg-top button{min-height:40px;border-radius:10px;font-size:14.5px;font-weight:700}
.seg.seg-top button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(14 44 68 / .14)}

/* Tarjeta protagonista de Cuentas */
.deep.acc-card{--bill:var(--b-resumen)}

/* Tarjetas de cuenta: color elegido por la persona y últimos 4 dígitos */
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.acard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:12px;min-height:150px;padding:16px;border-radius:18px;color:#F7F9F8;
  background-image:repeating-radial-gradient(ellipse 120% 100% at 108% -18%,transparent 0 13px,rgb(255 255 255 / .07) 13px 14px),linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:0 10px 24px -16px rgb(14 44 68 / .6)}
.acard:focus-visible{outline:3px solid var(--verde-b);outline-offset:2px}
.ac-top{display:flex;align-items:center;gap:10px}
.ac-id{display:flex;flex-direction:column;min-width:0}
.ac-id b{font-size:15px;font-weight:800;overflow-wrap:anywhere}
.ac-id small{font-size:12.5px;opacity:.82}
.ac-cash{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgb(255 255 255 / .16)}
.ac-cash svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9}
.ac-bal small{display:block;font-size:12px;opacity:.8;font-weight:600}
.ac-bal strong{font-family:var(--f-display);font-size:25px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.ac-foot{margin-top:auto;display:flex;justify-content:space-between;gap:10px;font-size:13.5px;letter-spacing:.06em;opacity:.9}
.ac-foot i{font-style:normal;letter-spacing:0;opacity:.75;font-size:12.5px}
.acc-note{margin:18px 2px 0;font-size:13px;color:var(--ink-2);line-height:1.45}

/* Cuentas conectadas: estado vacío honesto */
.conn-empty{margin-top:8px;padding:22px 18px;border:1px dashed var(--line);border-radius:18px;background:var(--surface)}
.conn-empty h2{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:-.02em;margin:12px 0 8px}
.conn-empty p{margin:0 0 10px;color:var(--ink-2);font-size:14.5px;line-height:1.5}
.conn-empty .btn{margin-top:6px;width:100%}
.conn-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.conn-ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}

/* Botón «Agregar» del resumen */
.qa-b.more .qa-ic svg{fill:none;stroke:currentColor;stroke-width:2.2}

/* Encabezado: el título de la pestaña siempre cabe; en teléfonos angostos la moneda es un solo botón */
.brand{min-width:0}
.brand h1{font-size:clamp(18px,5.2vw,22px);overflow-wrap:anywhere}
@media (max-width:430px){
  .cur-seg button[aria-pressed="false"]{display:none}
  .cur-seg button[aria-pressed="true"]{box-shadow:none;background:none;padding-inline:10px}
  .cur-seg button[aria-pressed="true"]::after{content:" ⇄";font-weight:600;color:var(--ink-2)}
}
.ac-foot>span:first-child{letter-spacing:.08em}.ac-foot>span:last-child{text-align:right;letter-spacing:0}

/* La cifra protagonista se mide y se reduce hasta caber en una sola línea */
.deep .big{white-space:nowrap;overflow-wrap:normal}
@media (max-width:360px){.brand .brand-mark{display:none}.brand h1{font-size:18px;overflow-wrap:normal}}

/* ===== Código por correo: 8 casillas ===== */
.otp{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:4px 0 2px}
.otp-b{width:100%;min-width:0;height:54px;padding:0!important;text-align:center;font-family:var(--f-display);font-size:22px!important;font-weight:800;
  border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);caret-color:var(--brand)}
.otp-b:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.otp-b:nth-child(4){margin-right:6px}
@media (max-width:360px){.otp{gap:4px}.otp-b{height:46px;font-size:19px!important;border-radius:10px}.otp-b:nth-child(4){margin-right:3px}}
.otp-exp{margin:0;font-size:13.5px;color:var(--ink-2)}
.otp-exp.late{color:var(--spend);font-weight:700}

/* ===== Etapa 3: colores de tarjeta, tipo de tasa, estado de inversiones, perfiles, filtros ===== */
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{position:relative;cursor:pointer}
.sw input{position:absolute;opacity:0;inset:0;margin:0}
.sw span{display:block;width:40px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 0 1px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--brand)}
.sw input:focus-visible+span{outline:3px solid var(--verde-b);outline-offset:3px}
.choice.rk{margin-top:8px}
.choice.three-c{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:360px){.choice.three-c{grid-template-columns:1fr}}
.st{font-weight:700;border-radius:999px;padding:1px 8px;font-size:11.5px}
.st-renovada{background:var(--brand-soft);color:var(--brand)}
.st-vencida{background:var(--debt-soft);color:var(--debt)}
.st-liquidada{background:var(--surface-2);color:var(--ink-2)}
.liq-d{margin-top:16px}
.prof-r{display:flex;align-items:center;gap:6px}
.prof-r .menu-r{flex:1}
.prof-r.on .menu-r{background:var(--brand-soft)}
.prof-ok{color:var(--brand);font-weight:800;font-size:18px;padding-right:6px}
.mvf2{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mvf2 select{width:100%}

/* ===== Etapa 4: mercado con datos verificables y administración ===== */
.mk-note.sim{background:var(--debt-soft);color:var(--ink);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start}
.mk-note.sim svg{flex:none;width:18px;height:18px;stroke:var(--debt)}
.mk-note.warn{background:var(--debt-soft);border-radius:12px;padding:10px 12px}
.mkr-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.mkr-r{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.mkr-h{display:flex;align-items:center;gap:10px}
.mkr-t{flex:1;min-width:0;display:flex;flex-direction:column}.mkr-t b{font-size:15px}.mkr-t small{color:var(--ink-2);font-size:12.5px}
.mkr-v{text-align:right;display:flex;flex-direction:column}.mkr-v b{font-family:var(--f-display);font-size:19px;font-weight:800}.mkr-v small{color:var(--ink-2);font-size:12px}
.mkr-m{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.mkr-m a{color:var(--brand);font-weight:700}
.mkr-st{font-weight:800;border-radius:999px;padding:1px 9px}
.st-real .mkr-st{background:var(--grow-soft);color:var(--grow)}
.st-por_verificar .mkr-st{background:var(--debt-soft);color:var(--debt)}
.st-simulado .mkr-st{background:var(--surface-2);color:var(--ink-2)}
.mkr-n{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.mkr-cmp{margin-top:6px}
.mkr-cmp-r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.mkr-cmp-r>span{display:flex;flex-direction:column;min-width:0}.mkr-cmp-r>span:last-child{text-align:right}
.mkr-cmp-r small{font-size:12px;color:var(--ink-2);font-weight:500}
.mkr-cmp-r .up{color:var(--grow);font-weight:800}.mkr-cmp-r .eq{color:var(--ink);font-weight:700}
.adm-h.old{opacity:.6}
.adm-a{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 0;font-size:12.5px;color:var(--ink-2)}
.adm-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 8px}
.adm-kpi>div{background:var(--surface-2);border-radius:12px;padding:10px}.adm-kpi small{display:block;font-size:11.5px;color:var(--ink-2)}.adm-kpi b{font-size:20px;font-family:var(--f-display)}
.adm-bars{display:flex;align-items:flex-end;gap:3px;height:90px;padding:6px 0;border-bottom:1px solid var(--line)}
.adm-bars span{flex:1;height:var(--h);min-height:2px;background:var(--brand);border-radius:3px 3px 0 0}
.adm-bx{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2)}
.adm-t{width:100%;border-collapse:collapse;font-size:14px}.adm-t th,.adm-t td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}.adm-t .num{text-align:right}

/* Aviso de estadísticas */
.an-bar{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:460px;margin:0 auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 16px 40px -18px rgb(14 44 68 / .5)}
.an-bar p{margin:0 0 10px;font-size:14px;line-height:1.45}
.an-bar div{display:flex;gap:8px}.an-bar .btn{flex:1;padding:10px}
@media (min-width:1000px){.an-bar{left:auto;right:24px;bottom:24px}}
.set-sw{cursor:pointer}.set-sw input{width:44px;height:26px;flex:none;accent-color:var(--brand)}

/* ===== Formularios por bloques (v3) ===== */
.fprog{display:flex;align-items:center;gap:10px;margin:2px 0 12px;font-size:13px;color:var(--ink-2)}
.fp-bar{flex:none;width:72px;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.fp-bar i{display:block;height:100%;background:var(--grow);border-radius:inherit;transition:width .25s}
.fblocks{gap:0}
.fblocks .fb{border-top:1px solid var(--line);padding:14px 0 6px;margin:0}
.fblocks .fb:first-of-type{border-top:0;padding-top:4px}
.fblocks .fb>h4{margin:0 0 10px;font-size:13.5px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.fblocks .fb .field{margin-bottom:10px}
.hlp{width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:700 12px var(--f-body);display:inline-grid;place-items:center;padding:0;margin-left:4px;vertical-align:middle;cursor:pointer}
.hlp[aria-expanded="true"]{background:var(--brand);color:var(--surface);border-color:var(--brand)}
.hlp-t{margin:6px 0 8px;padding:10px 12px;border-radius:var(--r-in,8px);background:var(--brand-soft);color:var(--ink);font-size:13.5px;line-height:1.45}
.tychips{display:flex;flex-wrap:wrap;gap:8px}
.tyc{position:relative}
.tyc input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tyc span{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-pill,999px);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink)}
.tyc svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tyc input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.tyc input:focus-visible+span{outline:3px solid var(--grow);outline-offset:2px}
.adv-d>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:4px 0 10px}
.adv-d>summary::-webkit-details-marker{display:none}
.adv-d>summary b::before{content:"+ ";color:var(--brand)}
.adv-d[open]>summary b::before{content:"− "}
.calc{margin:2px 0 8px;font-size:13.5px;color:var(--ink);background:var(--surface-2);border-radius:var(--r-in,8px);padding:9px 11px}
.calc:empty{display:none}

/* Selección de color con vista previa: los controles a un lado, la tarjeta al otro; nunca se superponen */
.cardpick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,190px);gap:14px;align-items:start}
@media (max-width:420px){.cardpick{grid-template-columns:minmax(0,1fr)}.cprev{max-width:260px}}
.cardpick .swatches{display:flex;flex-wrap:wrap;gap:8px}
.cardpick fieldset{border:0;padding:0;margin:0;min-width:0}
.cardpick legend{font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px;padding:0}
.sw span{width:36px;height:26px;display:block;border-radius:6px}
.cprev{aspect-ratio:1.586;border-radius:var(--r-card-acc,12px);padding:12px;color:#F7F9F8;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 18px -12px rgb(11 37 69 / .6);transition:background .2s}
.cp-e{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.cp-n{font-size:12px;opacity:.85}
.cp-f{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.08em}

/* Selector visual de instrumentos */
.itiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.itile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:var(--r-card-sm,12px);background:var(--surface);color:var(--ink);cursor:pointer;min-height:110px}
.itile:hover{border-color:var(--brand)}
.itile:focus-visible{outline:3px solid var(--grow);outline-offset:2px}
.itile b{font-size:14.5px}.itile small{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.itile-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--grow-soft);color:var(--grow)}
.itile-ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Fichas de bono y de cuenta */
.bd-kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:6px 0 10px;border-top:1px solid var(--line)}
.bd-kv>div{padding:10px 8px 10px 0;border-bottom:1px solid var(--line)}
.bd-kv>div:nth-child(odd){padding-right:12px}
.bd-kv dt{font-size:12.5px;color:var(--ink-2)}
.bd-kv dd{margin:2px 0 0;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.bd-kv dd small{display:block;font-weight:500;font-size:12px;color:var(--ink-2)}
.bd-kv dd.neg{color:var(--spend)}
.bd-t{width:100%;border-collapse:collapse;font-size:14px}
.bd-t th,.bd-t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.bd-t th{font-size:12.5px;color:var(--ink-2);font-weight:600}
.bd-t .num{text-align:right;font-variant-numeric:tabular-nums}
.bd-t tr.st-recibido td:last-child{color:var(--grow)}
.bd-t tr.st-por-registrar td:last-child .link-btn{color:var(--debt);font-weight:700}
.evo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:150px;padding-top:18px;border-bottom:1px solid var(--line)}
.evo-c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.evo-v{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.evo-b{width:70%;height:var(--h);min-height:3px;background:var(--brand);border-radius:3px 3px 0 0}
.evo-b.unk{background:var(--line)}
.evo-m{font-size:12px;color:var(--ink-2)}
/* ===== Componentes según la identidad: radios, texturas y navegación ===== */
body{font-family:var(--f-body)}
.deep{border-radius:var(--r-hero)}
.panel,.calbtn,.grp,.mkr-r,.conn-empty,.item,.eg2,.ent,.loan-c,.mkt-link,.adv-inv,.payq,.onb-cta,.itile,.mvp,.set-card{border-radius:var(--r-card)}
.acard,.ccard,.cprev{border-radius:var(--r-cardv)}
.seg,.cur-seg,.kind-tog,.o-cur,.seg button,.cur-seg button,.kind-tog button,.o-cur button,.tyc span,.mk-types button,.chips button,.pill span{border-radius:var(--r-pill)}
.btn,.qa-b,.grp-add,.wel-solo,.sso,.sec-add{border-radius:var(--r-btn)}
.sheet{border-radius:var(--r-sheet) var(--r-sheet) 0 0}
@media (min-width:1000px){.sheet{border-radius:var(--r-sheet)}}
.form input:not([type=checkbox]):not([type=radio]),.form select,.form textarea,.onb2 input:not([type=checkbox]):not([type=radio]),.onb2 select,.otp-b{border-radius:var(--r-inp)}
.brand h1,.sheet h3,.deep .big,.wel h2,h2.sec,.ac-bal strong,.cc-bal strong,.mkr-v b,.bd-kv dd,.otp-b{font-family:var(--f-display)}

/* Azul financiero (predeterminada): superficies planas, sin textura, filetes finos */
:root:not([data-skin]) .deep{background-image:none}
:root:not([data-skin]) .acard,:root:not([data-skin]) .ccard{background-image:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:none}
:root:not([data-skin]) nav.tabs button[aria-selected="true"] .ic{background:var(--brand-soft)!important}
:root:not([data-skin]) .panel,:root:not([data-skin]) .grp,:root:not([data-skin]) .calbtn{box-shadow:none}

/* Pasteles contemporáneos: tarjetas protagonistas en pastel con texto oscuro; barra de navegación flotante */
:root[data-skin="pastel"] .deep{background-image:none;color:var(--on-deep)}
:root[data-skin="pastel"] .deep .lbl,:root[data-skin="pastel"] .deep small,:root[data-skin="pastel"] .hrows span{color:color-mix(in srgb,var(--on-deep) 72%,transparent)}
:root[data-skin="pastel"] .acard,:root[data-skin="pastel"] .ccard{background-image:none}
:root[data-skin="pastel"] .panel,:root[data-skin="pastel"] .grp,:root[data-skin="pastel"] .calbtn{border:0;box-shadow:0 1px 0 var(--line)}
@media (max-width:999px){
  :root[data-skin="pastel"] nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:999px;background:#2B2A33;border:0;padding-bottom:0}
  :root[data-skin="pastel"] nav.tabs button{color:#B8B3C6}
  :root[data-skin="pastel"] nav.tabs button[aria-selected="true"]{color:#FFFBF5}
  :root[data-skin="pastel"] nav.tabs button[aria-selected="true"] .ic{background:rgb(255 255 255 / .12)!important}
}

/* Premium oscuro: grafito con bordes de 1 px; el esmeralda solo en lo que crece */
:root[data-skin="oscuro"] .deep{background-image:none;border:1px solid var(--line)}
:root[data-skin="oscuro"] .acard,:root[data-skin="oscuro"] .ccard{background-image:linear-gradient(150deg,#1C232D,#11161D);border:1px solid #26303C}
:root[data-skin="oscuro"] .panel,:root[data-skin="oscuro"] .grp,:root[data-skin="oscuro"] .calbtn{box-shadow:none}

/* Natural contemporáneo: anillos de madera en la tarjeta principal, esquinas casi rectas */
:root[data-skin="natural"] .acard,:root[data-skin="natural"] .ccard{background-image:repeating-radial-gradient(ellipse 140% 90% at 110% -20%,transparent 0 12px,rgb(255 255 255 / .08) 12px 13px),linear-gradient(150deg,var(--c1),var(--c2))}

/* Minimalismo editorial: sin tarjetas; filetes negros, cifras en serifa */
:root[data-skin="editorial"] .deep{background-image:none;color:var(--ink);padding-left:0;padding-right:0;border-bottom:1px solid var(--ink)}
:root[data-skin="editorial"] .deep .lbl,:root[data-skin="editorial"] .deep small,:root[data-skin="editorial"] .hrows span{color:var(--ink-2)}
:root[data-skin="editorial"] .deep .pace>div,:root[data-skin="editorial"] .deep .addb{background:none;border:1px solid var(--line);color:var(--ink)}
:root[data-skin="editorial"] .panel,:root[data-skin="editorial"] .grp,:root[data-skin="editorial"] .calbtn,:root[data-skin="editorial"] .item{box-shadow:none;border:0;border-top:1px solid var(--ink);border-radius:0}
:root[data-skin="editorial"] nav.tabs{border-top:1px solid var(--ink)}
:root[data-skin="editorial"] nav.tabs button[aria-selected="true"] .ic{background:none!important}
:root[data-skin="editorial"] nav.tabs button[aria-selected="true"]{text-decoration:underline;text-underline-offset:4px}

/* Selector de identidad en Ajustes */
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.skin{position:relative;border:1px solid var(--line);border-radius:var(--r-card);padding:10px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:88px}
.skin input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.skin:has(input:checked){border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.skin:has(input:focus-visible){outline:3px solid var(--grow);outline-offset:2px}
.skin i{display:flex;gap:3px}.skin i b{width:18px;height:18px;border-radius:50%;border:1px solid rgb(0 0 0 / .08)}
.skin span{font-size:13.5px;font-weight:700;line-height:1.25}
.skin small{font-size:12px;color:var(--ink-2)}

/* Ajustes finos por identidad */
:root[data-skin="pastel"] .deep .seg-mini,:root[data-skin="editorial"] .deep .seg-mini{background:color-mix(in srgb,var(--ink) 8%,transparent)}
:root[data-skin="pastel"] .deep .seg-mini button,:root[data-skin="editorial"] .deep .seg-mini button{color:var(--ink-2)}
:root[data-skin="pastel"] .deep .seg-mini button[aria-pressed="true"],:root[data-skin="editorial"] .deep .seg-mini button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
:root[data-skin="pastel"] .qa-b.inc{background:var(--grow-soft);color:var(--grow)}
:root[data-skin="pastel"] .qa-b.exp{background:var(--spend-soft);color:var(--spend)}
:root[data-skin="pastel"] .qa-b .qa-ic{background:rgb(255 255 255 / .6)}
:root[data-skin="oscuro"] .qa-b.exp{background:var(--surface-2);color:var(--ink)}
:root[data-skin="oscuro"] .qa-b.inc{color:#04140D}
:root[data-skin="editorial"] .qa-b.exp{background:var(--surface);color:var(--ink);border:1px solid var(--ink)}
/* ===== v3: bienvenida, menú de perfil, textos legales, soporte y novedades ===== */
html.onb-open .scrim{z-index:70}

/* Bienvenida */
.wel3{max-width:1080px;gap:22px}
.wel3 .wel-lead{max-width:46ch}
.wel-strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:4px -20px 0;padding:4px 20px 10px;scrollbar-width:none}
.wel-strip::-webkit-scrollbar{display:none}
.wv{flex:0 0 82%;scroll-snap-align:start;margin:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-card,12px);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.wv figcaption{font-weight:700;font-size:14px;color:var(--ink)}
.wv-hero{background:var(--b-resumen);color:var(--on-deep);border-radius:calc(var(--r-card,12px) - 4px);padding:12px}
.wv-hero small{display:block;font-size:12px;opacity:.8}.wv-hero b{display:block;font-family:var(--f-display);font-size:24px;letter-spacing:-.02em}
.wv-hero>span{display:flex;gap:12px;font-size:12px;opacity:.85;flex-wrap:wrap}
.wv-l{list-style:none;margin:0;padding:0}.wv-l li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}.wv-l li:first-child{border-top:0}
.wv-l span{min-width:0;display:flex;flex-direction:column}.wv-l b{font-size:13.5px}.wv-l small{font-size:12px;color:var(--ink-2)}.wv-l>li>b{white-space:nowrap}
.wel-ex{margin:0;font-size:12.5px;color:var(--ink-2)}
.wel-trust{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;font-size:13.5px;color:var(--ink-2)}
.wel-trust li{display:flex;gap:8px;align-items:flex-start}.wel-trust li::before{content:"";flex:none;width:14px;height:14px;margin-top:3px;border-radius:50%;background:var(--grow-soft);box-shadow:inset 0 0 0 4px var(--grow)}
.wel-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wel-two .wel-solo{min-height:50px;font-size:14.5px}
.wel-legal{display:flex;justify-content:center;gap:16px;margin:4px 0 0}.wel-legal .link-btn{font-size:13px;color:var(--ink-2)}
@media (min-width:900px){
  .wel3{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);align-items:center;column-gap:56px;min-height:100%}

function fmt(v,cur,dec=2){const k='n'+dec;nf[k]=nf[k]||new Intl.NumberFormat('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});const n=nf[k].format(Math.abs(v));return (v<0&&Math.abs(v)>=Math.pow(10,-dec)/2?'-':'')+(SYM[cur]||cur+' ')+n}

/* Lectura de montos tal como se escriben en RD: 1500 · 1,500 · 1,500.00 · RD$1,500 · 1.500 · 1 500 · 1.500,50 */
function money(v){
  let s=String(v==null?'':v).trim().replace(/[^\d.,-]/g,'');
  if(!/\d/.test(s))return NaN;
  const neg=s.charAt(0)==='-'; s=s.replace(/-/g,'');
  const c=s.lastIndexOf(','), d=s.lastIndexOf('.');
  if(c>-1&&d>-1){const dec=c>d?',':'.';s=s.split(dec===','?'.':',').join('').replace(dec,'.')}
  else if(c>-1){s=/^\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,''):s.replace(/,(?=[^,]*$)/,'.').replace(/,/g,'')}
  else if(d>-1){if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');else{const p=s.split('.');if(p.length>2)s=p.slice(0,-1).join('')+'.'+p[p.length-1]}}
  const n=parseFloat(s);return neg?-n:n;
}

/* Ahorro: interés simple con retención ISR opcional y renovación automática al vencer (práctica común en certificados RD) */
/* Tasa que se aplica en los cálculos. Si la persona la escribió como efectiva anual (TEA), se convierte a la nominal
   equivalente para el período en que se pagan o capitalizan los intereses. */
function nomRate(s){const r=(s.rate||0)/100;if(s.rateKind!=='efectiva'||!r)return r;const T=termMs(s)/YEAR;return T>0?(Math.pow(1+r,T)-1)/T:r}
function effRate(s){return nomRate(s)*(s.isr?0.9:1)}
/* Estado de una inversión: vigente, renovada, vencida (pasó la fecha y no se renueva) o liquidada (ya no cuenta en tu patrimonio) */
function invStatus(s,t=Date.now()){if(s.status==='liquidada')return 'liquidada';if(s.open||!s.due&&!s.months)return 'vigente';if(s.renew===false&&t>=s.start+termMs(s))return 'vencida';return s.status==='renovada'||(s.renew!==false&&t>=s.start+termMs(s))?'renovada':'vigente'}
const activeSav=()=>S.savings.filter(s=>s.status!=='liquidada');
/* Cuentas que pagan intereses: saldo registrado + intereses estimados desde el último abono del banco.
   Se calcula por tramos si la tasa cambió (historial), con la capitalización que indicó la persona.
   Los intereses que el banco acredita se suman al saldo y reinician la estimación: nunca se cuentan dos veces. */
function acctAccrued(s,t){
  const from=s.accrFrom||s.start;if(!(s.rate>0)||t<=from)return 0;
  const segs=(s.rateHist||[]).map(h=>({r:h.rate,k:h.kind,m:h.cap||12,a:h.from,b:h.to})).concat({r:s.rate,k:s.rateKind,m:s.cap||12,a:s.rateFrom||s.start,b:Infinity});
  let f=1;segs.forEach(g=>{const a=Math.max(g.a,from),b=Math.min(g.b,t);if(b<=a)return;let r=g.r/100;if(g.k==='efectiva')r=g.m*(Math.pow(1+r,1/g.m)-1);r*=s.isr?0.9:1;f*=Math.pow(1+r/g.m,g.m*(b-a)/YEAR)});
  return s.principal*(f-1);
}
function savValue(s,t){
  if(s.type==='Bono'&&s.bond)return bondValue(s,t);
  if(ACCT_TYPES.includes(s.type))return s.principal+acctAccrued(s,t);
  const r=effRate(s), term=termMs(s);let el=Math.max(0,t-s.start);if(s.renew===false&&!s.open)el=Math.min(el,term);
  const n=Math.floor(el/term), rem=el-n*term;
  return s.principal*Math.pow(1+r*term/YEAR,n)*(1+r*rem/YEAR);
}
function perSec(s,t){if(s.type==='Bono'&&s.bond)return bondPerSec(s,t);if(s.status==='liquidada'||(s.renew===false&&!s.open&&t>=s.start+termMs(s)))return 0;return savValue(s,t)*effRate(s)/(YEAR/1000)}
function totals(t){return totalsOf(activeSav(),t)}
function totalsOf(L,t){
  let v=0,p=0,ps=0;
  L.forEach(s=>{v+=conv(savValue(s,t),s.cur,S.base);p+=conv(s.principal,s.cur,S.base);ps+=conv(perSec(s,t),s.cur,S.base)});
  return {v,p,ps};
}
/* Préstamos: sistema francés (cuota fija) */
/* ---------- Préstamos: sistema francés con pagos y abonos registrados ----------
   l = {principal, rate (% anual), months (plazo original), start (desembolso), paid0 (cuotas pagadas antes de registrarlo),
        auto (las cuotas se pagan solas en su fecha), pays:[{id,date,amt,k:'cuota'|'abono',ab:'plazo'|'cuota',via}]} */
function cuota(P,rate,n){const i=rate/1200;if(!(n>0))return P;return i?P*i/(1-Math.pow(1+i,-n)):P/n}
function nper(B,rate,C){const i=rate/1200;if(B<=0.005)return 0;if(!i)return Math.ceil(B/C-1e-9);const x=1-B*i/C;if(x<=0)return Infinity;return Math.ceil(-Math.log(x)/Math.log(1+i)-1e-6)}

function loanState(l,until,extra){
  const now=until||(()=>{const d=new Date();d.setHours(23,59,59,999);return +d})(),i=l.rate/1200,P=l.principal;let B=P,C=cuota(P,l.rate,l.months),n=0,rem=l.months,ip=0,cp=0,tot=0;const hist=[];
  const p0=Math.min(l.months,Math.max(0,l.paid0||0));
  const cuotaPay=(amt,date,src)=>{const it=B*i,pay=Math.min(amt,B+it),cap=Math.max(0,pay-it);B=Math.max(0,B-cap);n++;ip+=Math.min(it,pay);cp+=cap;tot+=pay;
    rem=B<=0.005?0:Math.max(0,nper(B,l.rate,C));if(src)hist.push({...src,it:Math.min(it,pay),cap,bal:B})};
  for(let k=0;k<p0;k++)cuotaPay(C,null,null);
  const ev=[];
  if(loanAuto(l))for(let k=p0+1;k<=l.months+240;k++){const d=+addM(l.start,k);if(d>now)break;ev.push({date:d,k:'cuota',amt:null,auto:true})}
  (l.pays||[]).concat(extra?[extra]:[]).forEach(p=>{if(p.date<=now||p===extra)ev.push(p)});
  ev.sort((a,b)=>a.date-b.date||(a.k==='cuota'?-1:1));
  let autoN=0;
  for(const e of ev){if(B<=0.005)break;
    if(e.k==='cuota'){if(e.auto){autoN++;if(n>=p0+autoN)continue;cuotaPay(C,e.date,{date:e.date,k:'cuota',amt:Math.min(C,B*(1+i)),auto:true})}
      else cuotaPay(e.amt,e.date,e)}
    else{const a=Math.min(e.amt,B);B=Math.max(0,B-a);cp+=a;tot+=a;
      if(B>0.005){if(e.ab==='cuota')C=cuota(B,l.rate,Math.max(1,rem));else rem=nper(B,l.rate,C)}else rem=0;
      hist.push({...e,it:0,cap:a,bal:B})}}

  const futInt=left?Math.max(0,C*rem-left):0;
  return {B:left,left,cuota:left?Math.min(C,left*(1+i)):0,n,rem:left?rem:0,ip,cp,tot,next,hist:hist.reverse(),futInt,late:!!(next&&+next<today0)};
}

const isAcct=s=>ACCT_TYPES.includes(s.type);
const accts=()=>S.savings.filter(isAcct);
function viaObj(v){
  if(!v)return null;const i=v.indexOf(':'),k=v.slice(0,i),id=v.slice(i+1);
  if(k==='a'){const s=S.savings.find(x=>x.id===id);return s?{k,o:s}:null}
  if(k==='c'){const c=S.cards.find(x=>x.id===id);return c?{k,o:c}:null}
  return null;
}
function viaName(v){const o=viaObj(v);if(!o)return v?'Cuenta eliminada':'Efectivo';return o.o.name}
function viaColor(v){
  const o=viaObj(v);if(!o)return 'var(--c-gray)';
  const A=accts(),pal=['var(--c1)','var(--c7)','var(--c3)','var(--c6)','var(--c4)','var(--c5)','var(--c2)','var(--c8)'];
  const i=o.k==='a'?A.indexOf(o.o):A.length+S.cards.indexOf(o.o);return pal[i%pal.length];
}
/* Un gasto con tarjeta de crédito no toca tus cuentas: aumenta lo consumido de la tarjeta. Uno con cuenta, la descuenta. */
function applyVia(x,sign,kind){
  const o=viaObj(x.via);if(!o)return;const d=conv(x.amt,x.cur,o.o.cur)*sign;
  if(o.k==='a')o.o.principal+=kind==='i'?d:-d;
  else if(kind==='e')o.o.balance+=d;
}
function viaOpts(kind,val){
  const A=accts(),avail=c=>Math.max(0,c.limit-c.balance);
  const accO=A.length?`<optgroup label="${kind==='i'?'Tus cuentas':'Cuentas y tarjetas de débito'}">${A.map(s=>`<option value="a:${s.id}" ${val==='a:'+s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</optgroup>`:'';
  const cardO=kind==='e'&&S.cards.length?`<optgroup label="Tarjetas de crédito">${S.cards.map(c=>`<option value="c:${c.id}" ${val==='c:'+c.id?'selected':''}>${esc(c.name)} · disp. ${esc(fmt(avail(c),c.cur,0))}</option>`).join('')}</optgroup>`:'';
  return accO+cardO+`<option value="" ${!val?'selected':''}>${kind==='i'?'Otro (no se suma a una cuenta)':'Efectivo u otro (no descuenta de una cuenta)'}</option>`;
}

/* ---------- Vencimiento de ahorros e inversiones ---------- */
function termMs(s){if(s.open)return MONTH;if(s.due&&s.due>s.start)return s.due-s.start;return Math.max(1,s.months||1)*MONTH}
function nextMat(s,t=Date.now()){if(s.open)return null;const term=termMs(s),el=Math.max(0,t-s.start);return s.start+(Math.floor(el/term)+1)*term}
const longDate=new Intl.DateTimeFormat('es-DO',{day:'numeric',month:'short',year:'numeric'});
function matText(s){const d=nextMat(s);return d?'Vence '+longDate.format(new Date(d)):'Sin vencimiento'}
function addMonthsISO(m){const d=new Date();d.setMonth(d.getMonth()+m);return isoLocal(d)}

const PER={hoy:'Hoy',sem:'Semana',mes:'Mes',d30:'30 días',m3:'3 meses',m6:'6 meses',y1:'1 año',todo:'Todo',fechas:'Rango'};
let per={resumen:'mes',ingresos:'d30',gastos:'d30'},perC={from:'',to:''};
try{Object.assign(per,JSON.parse(localStorage.getItem(KEY+'.per')||'{}'))}catch(e){}
function perRange(k){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),sod=new Date(y,m,n.getDate()).getTime(),end=sod+DAY-1;
  switch(k){
    case 'hoy':return [sod,end];
    case 'sem':return [sod-((n.getDay()+6)%7)*DAY,end];
    case 'mes':return [new Date(y,m,1).getTime(),end];
    case 'm3':return [new Date(y,m-2,1).getTime(),end];
    case 'm6':return [new Date(y,m-5,1).getTime(),end];
    case 'y1':return [new Date(y,m-11,1).getTime(),end];
    case 'todo':{const all=[...S.expenses,...S.incomes].map(x=>x.date);const a=all.length?Math.min(...all):sod;return [new Date(new Date(a).getFullYear(),new Date(a).getMonth(),1).getTime(),Math.max(end,...all)]}
    case 'fechas':{const f=perC.from?parseDate(perC.from)-DAY/2:sod-29*DAY,t=perC.to?parseDate(perC.to)+DAY/2-1:end;return [Math.min(f,t),Math.max(f,t)]}
    default:return [sod-29*DAY,end];
  }
}
const inR=(x,R)=>x.date>=R[0]&&x.date<=R[1];
const sumB=(a,x)=>a+conv(x.amt,x.cur,S.base);
function rangeText(R){const a=new Date(R[0]),b=new Date(R[1]);return a.toDateString()===b.toDateString()?longDate.format(a):dateFmt.format(a)+(a.getFullYear()!==b.getFullYear()?' '+a.getFullYear():'')+' – '+longDate.format(b)}

  ${per[key]==='fechas'?`<div class="per-dates${dark?'':' light'}"><label>Desde<input type="date" data-pf="from" value="${esc(perC.from)}"></label><label>Hasta<input type="date" data-pf="to" value="${esc(perC.to)}"></label></div>`:''}`;
}

/* ---------- Gráficos: dona + lista de barras, y columnas en el tiempo ---------- */
const curSym={DOP:'RD$',USD:'US$',EUR:'€'};
const fmtFit=(v,cur)=>Math.abs(v)>=1e6?(v<0?'−':'')+(curSym[cur]||'')+(Math.abs(v)/1e6).toFixed(2)+' M':fmt(v,cur,0);
function compact(v,cur){const s=curSym[cur]||'',a=Math.abs(v);return (v<0?'−':'')+s+(a>=1e6?(a/1e6).toFixed(a>=1e7?0:1)+' M':a>=1e4?Math.round(a/1e3)+' mil':a>=1e3?(a/1e3).toFixed(1)+' mil':Math.round(a))}
function agg(items,keyFn,nameFn,colorFn,valFn){
  const m=new Map();items.forEach(x=>{const k=keyFn(x);m.set(k,(m.get(k)||0)+(valFn?valFn(x):conv(x.amt,x.cur,S.base)))});
  let parts=[...m.entries()].map(([k,v])=>({k,n:nameFn(k),v,c:colorFn(k)})).filter(p=>p.v>0).sort((a,b)=>b.v-a.v);
  if(parts.length>6){const rest=parts.slice(5).reduce((a,p)=>a+p.v,0);parts=parts.slice(0,5).concat({k:'_o',n:'Otros',v:rest,c:'var(--c-gray)'})}
  return parts;
}
function donutBlock(parts,label){
  const tot=parts.reduce((a,p)=>a+p.v,0);if(!tot)return '<p class="hint">Sin datos en este período.</p>';
  const R=44,C=2*Math.PI*R,gap=parts.length>1?2.2:0;let off=0;
  const arcs=parts.map(p=>{const L=p.v/tot*C,len=Math.max(.6,L-gap);const s=`<circle r="${R}" cx="58" cy="58" fill="none" stroke="${p.c}" stroke-width="15" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 58 58)"><title>${esc(p.n)}: ${esc(fmt(p.v,S.base,0))}</title></circle>`;off+=L;return s}).join('');
  return `<div class="dn"><svg class="dn-svg" viewBox="0 0 116 116" role="img" aria-label="${esc(label)}: ${parts.map(p=>esc(p.n)+' '+Math.round(p.v/tot*100)+' %').join(', ')}">${arcs}<text x="58" y="56" text-anchor="middle" class="dn-t1" style="font-size:${Math.min(12,62/(compact(tot,S.base).length*.6)).toFixed(1)}px">${esc(compact(tot,S.base))}</text><text x="58" y="72" text-anchor="middle" class="dn-t2">total</text></svg>
    <div class="ml">${parts.map(p=>`<div class="ml-row"><span class="sw" style="background:${p.c}"></span><span class="ml-n">${esc(p.n)}</span><b class="num">${esc(compact(p.v,S.base))}</b><span class="ml-t"><i style="width:${(p.v/parts[0].v*100).toFixed(1)}%;background:${p.c}"></i></span><small class="num">${Math.round(p.v/tot*100)} %</small></div>`).join('')}</div></div>`;
}
function bucketsFor(R,items){
  const span=R[1]-R[0],a=new Date(R[0]);
  const unit=span<=15*DAY?'day':span<=75*DAY?'week':span<=800*DAY?'month':'year';
  let s;if(unit==='day')s=new Date(a.getFullYear(),a.getMonth(),a.getDate());else if(unit==='week'){s=new Date(a.getFullYear(),a.getMonth(),a.getDate());s.setDate(s.getDate()-((s.getDay()+6)%7))}else if(unit==='month')s=new Date(a.getFullYear(),a.getMonth(),1);else s=new Date(a.getFullYear(),0,1);
  const B=[],wk=new Intl.DateTimeFormat('es-DO',{weekday:'narrow'}),mo=new Intl.DateTimeFormat('es-DO',{month:'short'});
  while(s.getTime()<=R[1]&&B.length<60){
    const e=unit==='day'?new Date(s.getFullYear(),s.getMonth(),s.getDate()+1):unit==='week'?new Date(s.getFullYear(),s.getMonth(),s.getDate()+7):unit==='month'?new Date(s.getFullYear(),s.getMonth()+1,1):new Date(s.getFullYear()+1,0,1);
    const v=items.filter(x=>x.date>=s.getTime()&&x.date<e.getTime()).reduce(sumB,0);
    const l=unit==='day'?(span<=8*DAY?wk.format(s)+' '+s.getDate():String(s.getDate())):unit==='week'?s.getDate()+' '+mo.format(s).replace('.',''):unit==='month'?mo.format(s).replace('.',''):String(s.getFullYear());
    const cap=unit==='day'?dayShort.format(s):unit==='week'?'Semana del '+dateFmt.format(s):unit==='month'?monthFmt.format(s):'Año '+s.getFullYear();
    B.push({l,cap,v});s=e;
  }
  return {B,unit:{day:'por día',week:'por semana',month:'por mes',year:'por año'}[unit]};
}
function colsBlock(id,bk,color){
  const B=bk.B,mx=Math.max(0,...B.map(b=>b.v)),n=B.length,every=Math.ceil(n/7);let sel=n-1;while(sel>0&&!B[sel].v)sel--;
  return `<div class="colw" data-colw="${id}"><div class="cols" style="--cc:${color}">${B.map((b,i)=>`<button type="button" class="col" data-ci="${i}" data-cap="${esc(b.cap)}" data-val="${esc(fmt(b.v,S.base,0))}" aria-label="${esc(b.cap)}: ${esc(fmt(b.v,S.base,0))}" aria-pressed="${i===sel}"><i style="height:${mx&&b.v?Math.max(2.5,b.v/mx*100).toFixed(1):0}%"></i></button>`).join('')}</div>
    <div class="col-l" aria-hidden="true">${B.map((b,i)=>`<span>${(i%every===0||i===n-1)&&(n-1-i>=every/2||i===n-1)?esc(b.l):''}</span>`).join('')}</div>
    <div class="col-cap num" aria-live="polite"><span>${esc(B[sel].cap)}</span><b>${esc(fmt(B[sel].v,S.base,0))}</b></div></div>`;
}

/* ---------- Lectores de avisos: consumos con tarjeta y acuerdos de puestos de bolsa ---------- */
const MES={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11,ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,sept:8,oct:9,nov:10,dic:11};
const DATE_RX='(\\d{1,2}[\\/\\-.]\\d{1,2}[\\/\\-.]\\d{2,4}|\\d{4}-\\d{1,2}-\\d{1,2}|\\d{1,2}\\s+de\\s+[a-záéíóú]+\\s+(?:de|del)\\s+\\d{4}|\\d{1,2}[\\-\\s][a-z]{3,4}[\\-\\s]\\d{2,4})';
function parseDateEs(s){
  if(!s)return null;s=s.trim().toLowerCase();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return new Date(+m[1],+m[2]-1,+m[3]).getTime();
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]).getTime()}
  if((m=s.match(/^(\d{1,2})\s+de\s+([a-záéíóú]+)\s+(?:de|del)\s+(\d{4})$/))&&MES[m[2]]!==undefined)return new Date(+m[3],MES[m[2]],+m[1]).getTime();
  if((m=s.match(/^(\d{1,2})[\-\s]([a-z]{3,4})[\-\s](\d{2,4})$/))&&MES[m[2]]!==undefined){let y=+m[3];if(y<100)y+=2000;return new Date(y,MES[m[2]],+m[1]).getTime()}
  return null;
}
const clean=t=>String(t||'').replace(/ /g,' ').replace(/[ \t]+/g,' ').replace(/\r/g,'');
function curOf(sym,ctx){
  const s=(sym||'').toUpperCase();
  if(/US|USD|U\$S/.test(s))return 'USD';if(/EUR|€/.test(s))return 'EUR';if(/RD|DOP/.test(s))return 'DOP';
  if(ctx&&/d[oó]lares|USD|US\$/i.test(ctx)&&!/RD\$|DOP|pesos/i.test(ctx))return 'USD';
  return 'DOP';
}
const MONEY_RX=/(RD\$|US\$|U\$S|USD|DOP|EUR|€|\$)\s*([0-9][0-9.,]*[0-9])|([0-9][0-9.,]*[0-9])\s*(DOP|USD|EUR|pesos|d[oó]lares)/gi;

/* Categoría probable según el comercio */
const CAT_RULES=[
  ['comida',/SUPERMERC|SUPER |COLMADO|NACIONAL|BRAVO|JUMBO|SIRENA|PLAZA LAMA|CARREFOUR|PRICESMART|ALMACENES|REST|PIZZA|BURGER|CAFE|COFFEE|KFC|MCDONALD|WENDY|PANADER|FOOD|DELIVERY|PEDIDOSYA|UBER ?EATS|CARNIC|POLLO/],
  ['transporte',/SHELL|TEXACO|ESSO|TOTAL|SUNIX|PETRO|GASOLIN|ESTACION|COMBUSTIBLE|UBER(?! ?EATS)|INDRIVE|CABIFY|TAXI|PEAJE|PASO RAPIDO|PARQUEO|AUTO ?PARTS|GOMER/],
  ['salud',/FARMACIA|CAROL|CLINICA|HOSPITAL|LABORAT|REFERENCIA|AMADITA|MEDIC|ODONT|DENTAL|OPTICA|GYM|GIMNASIO|SMART FIT|BODY SHOP/],
  ['ocio',/NETFLIX|SPOTIFY|CINE|CARIBBEAN CINEMAS|PALACIO DEL CINE|DISNEY|HBO|MAX\.COM|PRIME VIDEO|STEAM|PLAYSTATION|XBOX|APPLE\.COM|GOOGLE \*|BAR |LOUNGE|DISCO|HOTEL|AIRBNB|BOOKING|EXPEDIA|AEROL|ARAJET|JETBLUE|AMERICAN AIR/],
  ['servicios',/EDESUR|EDENORTE|EDEESTE|CLARO|ALTICE|VIVA|CAASD|CORAASAN|WIND|INTERNET|TELECABLE|SEGURO|SURA|MAPFRE|HUMANO|PALIC/],
  ['educacion',/COLEGIO|ESCUELA|UNIVERSIDAD|INTEC|PUCMM|UNIBE|UASD|UNAPEC|APEC|LIBRER|CUESTA|COURSERA|UDEMY|PLATZI|DUOLINGO/],
  ['vivienda',/ALQUILER|INMOBILI|CONDOMINIO|MANTENIMIENTO|FERRETER|OCHOA|HOME DEPOT|IKEA|MUEBLES/]
];
function guessCat(merchant){const m=(merchant||'').toUpperCase();for(const [c,rx] of CAT_RULES)if(rx.test(m))return c;return 'otros'}

/* Aviso de consumo con tarjeta → {amt,cur,merchant,last4} o null */
function parseCardAlert(raw){
  const t=clean(raw), one=t.replace(/\n+/g,' ');
  if(!/(consumo|compra|transacci[oó]n|cargo|autorizad|fue utilizada|uso de (su|tu) tarjeta|retiro|purchase)/i.test(one))return null;
  if(/(pago (recibido|aplicado)|hemos recibido (su|tu) pago|abono a (su|tu)|reverso|devoluci[oó]n|estado de cuenta|promoci[oó]n|oferta especial|c[oó]digo de (seguridad|verificaci[oó]n)|token|OTP)/i.test(one)&&!/(consumo|compra) (por|de)/i.test(one))return null;
  if(!/(tarjeta|card|TC\b|d[eé]bito|cr[eé]dito|\*{2,}\d{4}|x{2,}\d{4})/i.test(one))return null;
  let best=null;
  const kw=one.search(/(monto|por (un )?(valor|monto) de|importe|por RD|por US|por \$|amount)/i);
  for(const m of one.matchAll(MONEY_RX)){
    const sym=m[1]||m[4], num=money(m[2]||m[3]);
    if(!(num>0)||num>5e7)continue;
    const near=kw>=0?Math.abs(m.index-kw):9999;
    if(!best||near<best.near)best={amt:num,cur:curOf(sym,one),near};
  }
  if(!best)return null;
  let merchant='';let mm;
  if((mm=one.match(/(?:comercio|establecimiento|merchant|lugar|negocio)\s*[:\-]\s*([^\n|;]{3,45}?)(?=\s+(?:fecha|monto|hora|tarjeta|el d[ií]a|por|referencia|ciudad|pa[ií]s)\b|[.;|]|$)/i)))merchant=mm[1];
  else{for(const m of one.matchAll(/\ben\s+(?:el\s+comercio\s+)?([A-Z0-9][A-Z0-9 &'.\-*\/#]{2,40}[A-Z0-9])(?=\s+(?:el|por|con|fecha|monto|a las|en fecha|de fecha|\d)|[.,;]|$)/g)){if(/[A-Z]{2}/.test(m[1])){merchant=m[1];break}}}
  merchant=merchant.replace(/\s{2,}/g,' ').trim().replace(/^(EL|LA)\s+COMERCIO\s+/,'');
  const l4=one.match(/(?:terminad[ao]s?\s+en|termina(?:da)?\s+en|finalizad[ao]\s+en|que termina en|[uú]ltimos\s+(?:4|cuatro)\s+d[ií]gitos\s*:?|ending in|\*{2,}|x{2,}|X{2,})\s*(\d{4})\b/i);
  return {amt:best.amt,cur:best.cur,merchant:merchant.toUpperCase()||'',last4:l4?l4[1]:'',kind:/retiro/i.test(one)?'retiro':'consumo'};
}

/* Aviso de depósito o transferencia recibida → {amt,cur,last4,from} o null */
function parseDeposit(raw){
  const t=clean(raw),one=t.replace(/\n+/g,' ');
  if(!/(dep[oó]sito|transferencia recibida|recibiste una transferencia|ha recibido|cr[eé]dito a (su|tu) cuenta|acreditad[oa]|abono a (su|tu) cuenta|n[oó]mina)/i.test(one))return null;
  if(/(c[oó]digo de (seguridad|verificaci[oó]n)|token|OTP|promoci[oó]n|estado de cuenta)/i.test(one))return null;
  let best=null;const kw=one.search(/(monto|por (un )?(valor|monto) de|importe|por RD|por US|por \$|amount)/i);
  for(const m of one.matchAll(MONEY_RX)){const sym=m[1]||m[4],num=money(m[2]||m[3]);if(!(num>0)||num>5e7)continue;const near=kw>=0?Math.abs(m.index-kw):9999;if(!best||near<best.near)best={amt:num,cur:curOf(sym,one),near}}
  if(!best)return null;
  const l4=one.match(/(?:terminad[ao]s?\s+en|termina(?:da)?\s+en|cuenta\s+(?:no\.?\s*)?(?:\*+|x+)?|[uú]ltimos\s+(?:4|cuatro)\s+d[ií]gitos\s*:?|\*{2,}|x{2,}|X{2,})\s*(\d{4})\b/i);
  const fr=one.match(/(?:de parte de|enviad[ao] por|ordenante|remitente)\s*:?\s*([A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÑáéíóúñ .]{2,40}?)(?=\s+(?:por|el|en|monto|a su)\b|[.,;]|$)/);
  return {amt:best.amt,cur:best.cur,last4:l4?l4[1]:'',from:fr?fr[1].trim():''};
}
/* Acuerdo o confirmación de un puesto de bolsa → {rate,amt,cur,name,issuer,start,end,months} o null */
function parseBroker(raw,sender){
  const t=clean(raw), one=t.replace(/\n+/g,' ');
  if(!/(tasa|rendimiento|cup[oó]n|yield|ytm)/i.test(one))return null;
  const num='(\\d{1,2}(?:[.,]\\d{1,6})?)';
  const rateRx=new RegExp('(tasa(?:\\s+de)?(?:\\s+(?:rendimiento|cup[oó]n|inter[eé]s|anual|pactada|de\\s+compra|de\\s+colocaci[oó]n|efectiva))?|rendimiento(?:\\s+(?:anual|al\\s+vencimiento|a\\s+vencimiento|esperado|efectivo))?|yield|ytm)\\s*(?:\\(\\s*%\\s*\\))?\\s*(?:anual)?\\s*[:=]?\\s*'+num+'\\s*(%|por\\s*ciento)?','gi');
  let rate=null;
  for(const m of one.matchAll(rateRx)){
    const val=parseFloat(m[2].replace(',','.'));
    if(!(val>0.05&&val<40))continue;
    const lab=m[1].toLowerCase();
    const score=/rendimiento|yield|ytm|pactada|compra|colocaci|efectiva/.test(lab)?3:/cup/.test(lab)?1:2;
    if(!rate||score>rate.score)rate={val,score};
  }
  if(!rate)return null;
  const amtRx=/(monto\s+(?:a\s+liquidar|liquidado|invertido|transado|total|neto|de\s+la\s+operaci[oó]n|a\s+pagar|nominal)|monto|valor\s+(?:transado|de\s+compra|liquidado|a\s+pagar|efectivo|nominal|facial)|total\s+a\s+(?:pagar|liquidar|debitar)|importe(?:\s+total)?|capital(?:\s+invertido)?|inversi[oó]n)\s*(?:\(\s*(?:RD\$|US\$|DOP|USD)\s*\))?\s*[:=]?\s*(?:de\s+|por\s+)?(RD\$|US\$|DOP|USD|\$)?\s*([0-9][0-9.,]{2,}[0-9])/gi;
  let amt=null;
  for(const m of one.matchAll(amtRx)){
    const v=money(m[3]);if(!(v>=1000))continue;
    const lab=m[1].toLowerCase();
    const score=/liquid|pagar|transado|invertido|debitar|efectivo|neto|compra|capital|inversi/.test(lab)?3:/nominal|facial/.test(lab)?1:2;
    if(!amt||score>amt.score)amt={v,score,cur:curOf(m[2],one)};
  }
  if(!amt)return null;
  const dateAfter=lab=>{const m=one.match(new RegExp('('+lab+')\\s*[:=]?\\s*'+DATE_RX,'i'));return m?parseDateEs(m[2]):null};
  const start=dateAfter('fecha\\s+(?:valor|de\\s+liquidaci[oó]n|de\\s+operaci[oó]n|de\\s+pacto|de\\s+compra|de\\s+transacci[oó]n|de\\s+colocaci[oó]n|de\\s+emisi[oó]n)');
  const end=dateAfter('fecha\\s+de\\s+(?:vencimiento|redenci[oó]n|recompra|retroventa)|vencimiento|vence');
  let months=null;
  const pd=one.match(/plazo\s*[:=]?\s*(\d{1,4})\s*d[ií]as/i), pm=one.match(/plazo\s*[:=]?\s*(\d{1,3})\s*mes/i);
  if(start&&end&&end>start)months=Math.max(1,Math.round((end-start)/(30.44*864e5)));
  else if(pd)months=Math.max(1,Math.round(+pd[1]/30.44));else if(pm)months=+pm[1];
  const ins=one.match(/\b(bonos?\s+(?:soberanos?|corporativos?|del\s+ministerio\s+de\s+hacienda|de\s+deuda\s+subordinada)?|certificados?\s+(?:de\s+inversi[oó]n|financieros?)?|letras?\s+del\s+banco\s+central|notas?\s+de\s+renta\s+fija|papel(?:es)?\s+comercial(?:es)?|reportos?|cuotas?\s+de\s+(?:un\s+)?fondo|valores?\s+de\s+fideicomiso)/i);
  const iss=one.match(/(Ministerio\s+de\s+Hacienda|Banco\s+Central(?:\s+de\s+la\s+Rep[uú]blica\s+Dominicana)?|BCRD|Hacienda)/i);
  const yr=end?new Date(end).getFullYear():null;
  let name=(ins?ins[1].replace(/\s+/g,' ').trim():'Inversión');name=name.charAt(0).toUpperCase()+name.slice(1).toLowerCase();
  if(iss&&!/hacienda|banco central/i.test(name))name+=' · '+(/hacienda/i.test(iss[1])?'Hacienda':'Banco Central');
  name=name.replace(/ministerio de hacienda/i,'Ministerio de Hacienda').replace(/banco central/i,'Banco Central');
  if(yr)name+=' '+yr;
  return {rate:rate.val,amt:amt.v,cur:amt.cur,name,issuer:iss?iss[1]:'',entity:sender||'Puesto de bolsa',start,end,months:months||12,reporto:/reporto/i.test(one)};
}

async function pdfText(bytes,pwds){

const b64u=s=>{const bin=atob(s.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
const htmlText=h=>{try{const d=new DOMParser().parseFromString(h,'text/html');d.querySelectorAll('br,p,div,tr,li').forEach(n=>n.append('\n'));return d.body?d.body.textContent:''}catch(e){return h.replace(/<[^>]+>/g,' ')}};
function walk(p,acc){
  if(p.parts)p.parts.forEach(x=>walk(x,acc));
  else if(p.filename&&/\.pdf$/i.test(p.filename)&&p.body&&p.body.attachmentId)acc.pdfs.push(p.body.attachmentId);
  else if(p.body&&p.body.data){const txt=new TextDecoder().decode(b64u(p.body.data));if(p.mimeType==='text/plain')acc.plain+=txt;else if(p.mimeType==='text/html')acc.html+=txt}

let oCur=null,oPrevP=0;
function collectOnb(){if(oCur&&oCur.collect)try{oCur.collect()}catch(e){}}
function renderOnb(keepScroll){
  const k=OSTEPS[oStep],total=OSTEPS.length-1,st=OS[k]();oCur=st;
  const y=keepScroll&&$('.onb')?$('.onb').scrollTop:0,last=k==='listo',p=last?1:(oStep+1)/(total+1);
  const tree=treeSVG(p,keepScroll?p:oPrevP,last?'o-tree big':'o-tree');oPrevP=p;
  $('#onbLayer').innerHTML=`<div class="onb onb2" role="dialog" aria-modal="true" aria-label="Organiza tus finanzas"><div class="onb-in">
    <div class="o-top">${last?'<span></span>':`<button class="o-back" type="button" id="oBack" aria-label="Atrás">${oic('back')}</button>`}<div class="o-grow" role="progressbar" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${Math.min(oStep+1,total)}" aria-label="Paso ${Math.min(oStep+1,total)} de ${total}">${tree}</div>${last?'<span></span>':'<button class="o-link" type="button" id="oLater">Salir</button>'}</div>

function friendlyAuth(e){

function payOccs(p){
  const n=new Date(),sod=new Date(n.getFullYear(),n.getMonth(),n.getDate()),L=[];
  for(const mo of [-1,0]){const y=n.getFullYear(),m=n.getMonth()+mo,last=new Date(y,m+1,0).getDate();
    p.days.forEach(d=>{const dt=new Date(y,m,Math.min(d,last),12);if(dt<=new Date(+sod+DAY-1)&&dt.getTime()>=(p.start||0)-DAY&&!p.done[isoLocal(dt)])L.push(dt)})}
  return L.sort((a,b)=>a-b);
}

/* ---------- Retiro de efectivo y transferencias entre cuentas ---------- */
function applyTr(x,sign){const a=viaObj(x.from),b=viaObj(x.to);if(a)a.o.principal-=x.amt*sign;if(b)b.o.principal+=conv(x.amt,x.cur,b.o.cur)*sign}
function openTransfer(id,pre={}){
  const ed=id?(S.transfers||[]).find(x=>x.id===id):null,A=accts(),cash=A.find(s=>s.type==='Efectivo');
  const bank=A.filter(s=>s.type!=='Efectivo');
  if(!ed&&!bank.length){sheet(`<h3>Retiro o transferencia</h3><p class="lead-s">Primero agrega la cuenta de banco de donde sale el dinero.</p><div class="form" style="margin-top:14px"><button class="btn" type="button" id="trAcc" style="--accent:var(--brand)">Agregar cuenta</button></div>`,'var(--brand)');$('#trAcc').onclick=()=>openSaving({type:'Cuenta de ahorro'});return}

      push(d,{k:'in',g:'inv',ic:'int',title:(s.type==='Bono'?'Cupón · ':'Intereses · ')+s.name,sub:(s.vr?'Aproximado · ':'')+(f===1?'Cada mes':'Cada '+f+' meses'),amt:s.principal*r*f/12,cur:s.cur,approx:true,go:'sav:'+s.id})}}

const HOLD_MS=5000;
function hasRealData(){return !S.example&&['savings','expenses','incomes','cards','loans','recurring','goals','transfers','paydays'].some(k=>(S[k]||[]).length)}
function lossList(){const n=k=>(S[k]||[]).length,p=(c,a,b)=>c+' '+(c===1?a:b);const L=[];
  if(n('savings'))L.push(p(n('savings'),'cuenta o inversión','cuentas e inversiones'));
  if(n('expenses')+n('incomes'))L.push(p(n('expenses')+n('incomes'),'movimiento','movimientos')+' (gastos e ingresos)');
  if(n('cards'))L.push(p(n('cards'),'tarjeta de crédito','tarjetas de crédito'));
  if(n('loans'))L.push(p(n('loans'),'préstamo','préstamos'));
  if(n('recurring'))L.push(p(n('recurring'),'pago fijo','pagos fijos'));
  return L}
function holdConfirm(o){
  const L=o.list||lossList(),MS=o.ms||HOLD_MS;
  sheet(`<div class="hc"><span class="hc-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg></span>
    <h3>${o.title}</h3><p class="lead-s">${o.detail}</p>
    ${L.length?`<ul class="hc-list">${L.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    <div id="hcStage"><button type="button" class="hc-hold" id="hcHold" aria-describedby="hcHint"><i class="hc-fill" aria-hidden="true"></i><span id="hcTxt">Mantén presionado para confirmar</span></button>
    <p class="hint hc-hint" id="hcHint">Deja el dedo sobre el botón ${MS/1000} segundos. Si lo sueltas antes, no pasa nada.</p></div>
    <button type="button" class="btn ghost hc-no" id="hcNo">${o.keep||'No, conservar mis datos'}</button></div>`,'var(--spend)');
  const b=$('#hcHold'),fill=b.querySelector('.hc-fill'),txt=$('#hcTxt');let t0=0,raf=0,done=false;
  const reset=()=>{if(done)return;cancelAnimationFrame(raf);t0=0;fill.style.transform='scaleX(0)';txt.textContent='Mantén presionado para confirmar';b.classList.remove('on')};
  const step=()=>{const p=Math.min(1,(performance.now()-t0)/MS);fill.style.transform=`scaleX(${p})`;
    txt.textContent=p<1?`Sigue presionando… ${Math.ceil((1-p)*MS/1000)}`:'';if(p<1)raf=requestAnimationFrame(step);else ready()};
  const start=e=>{if(done||t0)return;if(e&&e.cancelable)e.preventDefault();t0=performance.now();b.classList.add('on');raf=requestAnimationFrame(step)};
  const ready=()=>{done=true;try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
    $('#hcStage').innerHTML=`<p class="hc-last" role="alert">Último paso. Esto no se puede deshacer después de unos segundos.</p><button type="button" class="btn hc-yes" id="hcYes">${o.confirm||'Sí, borrar todo'}</button>`;
    $('#hcYes').focus();$('#hcYes').onclick=()=>{close();o.onConfirm()}};
  b.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,reset));
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)start(e)});b.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')reset()});

/* ---------- Analítica de uso (etapa 6) ----------
   Solo con tu permiso. Se cuentan pantallas y acciones (por ejemplo «pantalla: mercado» o «gasto registrado»)
   con un identificador aleatorio del dispositivo. Nunca se envían montos, nombres, cuentas, correos,
   contraseñas ni lo que escribes en los formularios. Los eventos van a la tabla usage_events de Supabase,
   que solo el administrador puede leer. */
const AN_OK=/^[a-z0-9_]{2,40}$/;
const anGet=k=>{try{return localStorage.getItem(KEY+'.'+k)}catch(e){return null}};
const anSet=(k,v)=>{try{if(v==null)localStorage.removeItem(KEY+'.'+k);else localStorage.setItem(KEY+'.'+k,v)}catch(e){}};
const rid=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>(b%36).toString(36)).join('');
let anQ=[],anT=null;const anSession=rid(12);
const anConsent=()=>anGet('consent');
function anPlatform(){if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())return Capacitor.getPlatform()==='ios'?'ios':'android';return matchMedia('(display-mode: standalone)').matches||navigator.standalone?'pwa':'web'}
function track(event,props,screen){
  if(anConsent()!=='si'||!AN_OK.test(event)||!canCloud())return;
  let aid=anGet('aid');if(!aid){aid=rid(16);anSet('aid',aid)}
  const P={};if(props)for(const k in props){const v=props[k];if(/^[a-z_]{1,20}$/.test(k)&&(typeof v==='boolean'||typeof v==='number'&&Math.abs(v)<1000||typeof v==='string'&&/^[a-z0-9_]{0,30}$/.test(v)))P[k]=v}
  anQ.push({anon_id:aid,session_id:anSession,event,screen:(screen||view||'').replace(/[^a-z0-9_]/g,'').slice(0,30),platform:anPlatform(),app_version:String(APP_VER).slice(0,20),props:Object.keys(P).length?P:null});
  clearTimeout(anT);anT=setTimeout(anFlush,anQ.length>=20?0:8000);
}
async function anFlush(){
  if(!anQ.length||!navigator.onLine)return;const batch=anQ.splice(0,50);
  try{const r=await fetch(SUPABASE_URL+'/rest/v1/usage_events',{method:'POST',keepalive:true,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(batch)});if(!r.ok&&r.status>=500)anQ.unshift(...batch)}catch(e){anQ.unshift(...batch.slice(0,50))}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')anFlush()});addEventListener('pagehide',anFlush);
let anLastView='';
function trackView(){if(view+movSeg+cuSeg===anLastView)return;anLastView=view+movSeg+cuSeg;track('pantalla',{sub:view==='movimientos'?movSeg:view==='cuentas'?cuSeg:''})}
/* Aviso de consentimiento: no bloquea la app y no se vuelve a mostrar después de responder */
function askConsent(){
  if(anConsent()||$('#anBar')||!canCloud())return;
  const d=document.createElement('div');d.id='anBar';d.className='an-bar';d.setAttribute('role','region');d.setAttribute('aria-label','Estadísticas de uso');
  d.innerHTML=`<p><b>¿Nos ayudas a mejorar Caoba?</b> Contaríamos qué pantallas se usan, de forma anónima. Nunca montos, nombres ni datos de tus cuentas.</p><div><button type="button" class="btn" id="anYes">Sí, ayudar</button><button type="button" class="btn ghost" id="anNo">No, gracias</button></div>`;
  document.body.appendChild(d);
  $('#anYes').onclick=()=>{anSet('consent','si');d.remove();track('consentimiento_aceptado');track('app_abierta');trackView()};
  $('#anNo').onclick=()=>{anSet('consent','no');d.remove()};
}
function setConsent(on){anSet('consent',on?'si':'no');if(!on){anQ=[];anSet('aid',null)}}

    data.forEach(r=>{tot+=+r.n;byDay[r.day]=byDay[r.day]||{n:0,d:0};byDay[r.day].n+=+r.n;byDay[r.day].d=Math.max(byDay[r.day].d,+r.devices);byEv[r.event]=(byEv[r.event]||0)+(+r.n);if(r.event==='pantalla'&&r.screen)bySc[r.screen]=(bySc[r.screen]||0)+(+r.n);if(r.platform)byPl[r.platform]=(byPl[r.platform]||0)+(+r.n)});

/* ---------- Perfiles financieros: Personal, Familiar, Compartido o Negocio ----------
   Una sola cuenta de acceso con varios conjuntos de finanzas. El perfil activo vive en S como siempre;
   los demás se guardan completos en S.profiles.store y viajan con la misma sincronización.
   Los datos que existían antes de esta versión pasan a ser el perfil «Personal», sin cambios. */
const FIN_KEYS=['savings','loans','cards','expenses','incomes','paydays','transfers','catBudget','recurring','goals','pending','pendingInv','reminders','onboarded','onbDraft','emTarget','lastVia'];
const PROF_KINDS={personal:'Personal',familiar:'Familiar',compartido:'Compartido',negocio:'Negocio'};
function ensureProfiles(){
  if(!S.profiles||!Array.isArray(S.profiles.list)||!S.profiles.list.length)S.profiles={active:'p1',list:[{id:'p1',name:'Personal',kind:'personal'}],store:{}};
  S.profiles.store=S.profiles.store||{};
  if(!S.profiles.list.find(p=>p.id===S.profiles.active))S.profiles.active=S.profiles.list[0].id;
}
const activeProfile=()=>{ensureProfiles();return S.profiles.list.find(p=>p.id===S.profiles.active)};
function switchProfile(id){
  ensureProfiles();if(id===S.profiles.active||!S.profiles.list.find(p=>p.id===id))return;
  const cur={};FIN_KEYS.forEach(k=>{if(S[k]!==undefined)cur[k]=S[k]});
  S.profiles.store[S.profiles.active]=JSON.parse(JSON.stringify(cur));
  const nx=S.profiles.store[id]||{},b=blank();
  FIN_KEYS.forEach(k=>{S[k]=nx[k]!==undefined?nx[k]:b[k]});
  if(nx.onboarded===undefined)S.onboarded=false;
  delete S.profiles.store[id];S.profiles.active=id;

}

   Sirve para pasar los datos de la web a la app Android sin crear cuenta, y como copia de seguridad.
   El archivo contiene tus finanzas: guárdalo en un lugar seguro. */
function backupJSON(){const d=JSON.parse(JSON.stringify(S));delete d.onbDraft;delete d._owner;delete d._synced;return JSON.stringify({app:'caoba',formato:1,exportado:new Date().toISOString(),datos:d},null,1)}
async function exportBackup(){
  if(S.example){toast('Estás viendo datos de ejemplo: no hay nada que respaldar');return}
  const name='caoba-respaldo-'+isoLocal(new Date())+'.json',txt=backupJSON();
  if(isNative()){try{await cwPlugin().shareFile({text:txt,name});track('respaldo_exportado')}catch(e){toast('No se pudo crear el respaldo')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Respaldo descargado: '+name);track('respaldo_exportado');
}
function importBackup(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;if(f.size>5e6){toast('Ese archivo es demasiado grande para ser un respaldo de Caoba');return}

      sheet(`<div class="confirm"><h3>¿Restaurar este respaldo?</h3><p class="lead-s">Creado el ${esc(dtFmt.format(new Date(o.exportado)))}: ${n} cuentas, tarjetas, préstamos e inversiones, y ${m} movimientos.</p>

        <div class="form"><button class="btn" type="button" id="bkYes">Sí, restaurar</button><button class="btn ghost" type="button" id="bkNo">Cancelar</button></div></div>`,'var(--brand)');

        normalizeS();S._upd=Date.now();save();close();closeOnbLayer();setView('resumen');render();track('respaldo_importado');
        if(prev){const t=document.createElement('div');t.className='toast';t.innerHTML='Respaldo restaurado <button type="button" class="link-btn" id="bkUndo">Deshacer</button>';document.body.appendChild(t);

    r.readAsText(f)};

/* ---------- Bonos (v3) ----------
   s.bond = {face (valor nominal por bono), qty, price (% del nominal al comprar), mkt (% de mercado, opcional),
             cpn (tasa cupón anual %), rt (fija|variable|indexada), freq (meses entre cupones: 1,3,6,12; 0 = sin cupones; 'c' = calendario propio),
             dates (calendario propio, ms), basis ('30/360'|'act/365'|'act/360'|'act/act'), issue, isin, itype (gobierno|empresa|otro), country,
             ytm (% si la persona lo conoce), pays:[{d: fecha del cupón, amt, recv, via}] }
   Conceptos separados: tasa cupón, rendimiento al vencimiento (YTM), intereses devengados, ganancia de capital y flujo recibido.
   El valor en el patrimonio = nominal × precio + intereses devengados desde el último cupón. Los cupones cobrados van a la cuenta
   donde se depositan y no se suman al bono, para no contar dos veces el mismo dinero. */
const BASIS=[['30/360','30/360'],['act/365','Real/365'],['act/360','Real/360'],['act/act','Real/Real']];
const FREQS=[[6,'Semestral'],[3,'Trimestral'],[1,'Mensual'],[12,'Anual'],['c','Calendario propio'],[0,'Sin pagos periódicos']];
const bN=b=>(+b.face||0)*(+b.qty||1);
const addMo=(t,m)=>{const d=new Date(t),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return +d};
function d360(a,b){const A=new Date(a),B=new Date(b);return ((B.getFullYear()-A.getFullYear())*360+(B.getMonth()-A.getMonth())*30+(Math.min(B.getDate(),30)-Math.min(A.getDate(),30)))}
/* Fechas de cupón del bono, ascendentes: las que caen después de la emisión (o del período anterior a la compra) y hasta el vencimiento */
function bondDates(s){const b=s.bond;if(!b)return [];
  if(b.freq==='c')return (b.dates||[]).slice().sort((x,y)=>x-y);
  const f=+b.freq;if(!f||!s.due)return [];const stop=b.issue||addMo(s.start,-f),out=[];
  for(let d=s.due,i=0;d>stop+DAY/2&&i<1200;i++,d=addMo(s.due,-f*(i+1)))out.unshift(d);return out}
function prevCpn(s,D,t){let p=null;for(const d of D){if(d<=t)p=d;else break}if(p)return p;const b=s.bond;return b.freq==='c'?(b.issue||s.start):(D.length?addMo(D[0],-(+b.freq)):(b.issue||s.start))}
/* Cupón de un período según la base de días */
function cpnAmt(s,a,c){const b=s.bond,N=bN(b),r=(+b.cpn||0)/100,f=+b.freq;
  if(b.basis==='act/365')return N*r*(c-a)/(365*DAY);if(b.basis==='act/360')return N*r*(c-a)/(360*DAY);
  if(f&&b.freq!=='c')return N*r*f/12;return N*r*d360(a,c)/360}
/* Intereses devengados desde el último cupón hasta t (sin cobrar todavía) */
function bondAccrued(s,t){const b=s.bond;if(!b||!(+b.cpn>0)||(s.due&&t>=s.due))return 0;const D=bondDates(s);if(!D.length)return 0;
  const L=Math.max(prevCpn(s,D,t),b.freq==='c'&&!b.issue?s.start:-Infinity),C=D.find(d=>d>t);if(!C)return 0;
  const full=cpnAmt(s,L,C);let fr;if(b.basis==='30/360')fr=d360(L,t)/Math.max(1,d360(L,C));else fr=(t-L)/Math.max(1,C-L);
  return full*Math.max(0,Math.min(1,fr))*(s.isr?0.9:1)}
function bondValue(s,t){const b=s.bond,N=bN(b);if(s.status==='liquidada')return 0;if(s.due&&t>=s.due)return N;return N*((+b.mkt||+b.price||100)/100)+bondAccrued(s,t)}
function bondPerSec(s,t){const b=s.bond;if(!(+b.cpn>0)||(s.due&&t>=s.due)||s.status==='liquidada')return 0;return bN(b)*(+b.cpn/100)*(s.isr?0.9:1)/(YEAR/1000)}
/* Calendario de cupones con su estado: recibido, por registrar o próximo */
function bondSchedule(s){const b=s.bond,D=bondDates(s),buy=s.start,pays=b.pays||[];let prev=prevCpn(s,D,buy);
  return D.filter(d=>d>buy).map(d=>{const exp=cpnAmt(s,prev,d)*(s.isr?0.9:1),p=pays.find(x=>Math.abs(x.d-d)<DAY/2),o={d,exp,pay:p,st:p?'recibido':d<Date.now()?'por registrar':'próximo'};prev=d;return o})}
/* Rendimiento al vencimiento estimado (por 100 de nominal, capitalización según la frecuencia), desde la fecha y el precio de compra */
function bondYTM(s){const b=s.bond,P=+b.price,f=+b.freq,c=+b.cpn||0;if(!(P>0)||!s.due||s.due<=s.start)return null;
  const yrs=(s.due-s.start)/YEAR;if(!f||b.freq==='c'){return (Math.pow(100/P*(1+c/100*yrs),1/yrs)-1)*100}
  const per=12/f,D=bondDates(s).filter(d=>d>s.start);if(!D.length)return null;const L=prevCpn(s,bondDates(s),s.start),tau=(D[0]-s.start)/Math.max(1,D[0]-L),cp=c/per;

const capName=m=>(CAPS.find(c=>c[0]===(m||12))||[0,'Cada mes'])[1].toLowerCase();
/* Saldo al cierre de cada uno de los últimos meses, reconstruido hacia atrás con los movimientos registrados de esa cuenta */
function acctHistory(s,months=6){
  const via='a:'+s.id,ev=[];
  S.incomes.forEach(x=>{if(x.via===via)ev.push([x.date,conv(x.amt,x.cur,s.cur)])});
  S.expenses.forEach(x=>{if(x.via===via)ev.push([x.date,-conv(x.amt,x.cur,s.cur)])});
  (S.transfers||[]).forEach(x=>{if(x.to===via)ev.push([x.date,conv(x.amt,x.cur,s.cur)]);if(x.from===via)ev.push([x.date,-conv(x.amt,x.cur,s.cur)])});
  (s.credits||[]).forEach(c=>ev.push([c.date,c.amt]));
  const now=new Date(),out=[];let bal=s.principal;
  for(let k=0;k<months;k++){const end=+new Date(now.getFullYear(),now.getMonth()-k+1,0,23,59);
    if(k>0){const nextEnd=+new Date(now.getFullYear(),now.getMonth()-k+2,0,23,59);ev.forEach(([d,a])=>{if(d>end&&d<=nextEnd)bal-=a})}
    out.unshift({m:new Date(now.getFullYear(),now.getMonth()-k,1),bal:Math.max(0,k===0?s.principal:bal),known:end>=s.start});}
  return out;
}

    <div><dt>Al año, con el saldo actual</dt><dd>≈ ${esc(fmt(s.principal*tea/100*(s.isr?.9:1),s.cur,0))}<small>Estimado${s.isr?', neto de ISR':''}</small></dd></div>`

function openExport(pre){

      <div class="xl-all"><button type="button" class="link-btn" id="xlAll">Todo</button><button type="button" class="link-btn" id="xlNone">Nada</button></div></fieldset>
    <div class="field"><label for="xlP">Período de movimientos y pagos</label><select id="xlP"><option value="all">Todo el historial</option><option value="m">Este mes</option><option value="y">Este año</option><option value="12">Últimos 12 meses</option><option value="r">Elegir fechas</option></select></div>

  $('#xlAll').onclick=()=>document.querySelectorAll('[name=xlS]').forEach(c=>c.checked=true);$('#xlNone').onclick=()=>document.querySelectorAll('[name=xlS]').forEach(c=>c.checked=false);
  $('#f').onsubmit=async e=>{e.preventDefault();if(S.example)return $('#err').textContent='Estás viendo datos de ejemplo: el Excel se crea con tus propios datos.';
    const keys=[...document.querySelectorAll('[name=xlS]:checked')].map(c=>c.value);if(!keys.length)return $('#err').textContent='Elige al menos una sección.';

    track('excel_exportado',{hojas:keys.length});
