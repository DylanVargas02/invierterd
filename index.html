.pace div{padding:8px}
.pace strong{font-size:12.5px;letter-spacing:-.01em}
.hero .pace strong{font-size:12px}


/* ---- Guía inicial ---- */
html.onb-open,html.onb-open body{overflow:hidden}
.onb{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.onb-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.onb-top{display:flex;align-items:center;gap:12px;min-height:36px}
.onb-brand{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.02em;flex:1}
.onb-skip{border:0;background:none;color:var(--ink-2);font-weight:700;font-size:14px;padding:8px 2px}
.onb-prog{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.onb-prog i{display:block;height:100%;background:var(--grow);border-radius:99px;transition:width .35s ease}
.onb-step{font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.onb-main{flex:1}
.onb h2{font-family:var(--f-display);font-weight:800;font-size:clamp(25px,7vw,31px);letter-spacing:-.025em;line-height:1.1;margin:22px 0 8px;text-wrap:balance;outline:none}
.onb .lead{color:var(--ink-2);margin:0 0 18px;font-size:15px;max-width:52ch}
.onb-body{display:flex;flex-direction:column;gap:12px}
.onb-body.bud-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.onb-foot{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 75%,color-mix(in srgb,var(--bg) 0%,transparent));padding:18px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:10px;display:flex;gap:8px}
.onb-foot .btn{flex:1}
.onb-foot .btn.ghost{flex:0 0 auto;padding-inline:16px}
.onb-hero{margin-top:18px}
.onb-hero p{margin:6px 0 0;color:color-mix(in srgb,var(--on-deep) 80%,transparent);max-width:34ch}
.onb-big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,11vw,46px);letter-spacing:-.03em;line-height:1.05;margin-top:6px;color:var(--glow)}
.onb-list{margin:0 0 16px;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.onb-list li::marker{color:var(--grow);font-weight:800}
.onb .hint{margin:0 0 12px}
.chk-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.chk-row .check{color:var(--ink);font-weight:600;font-size:15px;align-items:center}
.rowcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px}
.rowcard-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em}
.add-row{border:1.5px dashed var(--line);background:none;border-radius:var(--r-md);padding:13px;font-weight:700;font-size:14px;color:var(--grow)}
fieldset.field{border:0;padding:0;margin:0;min-width:0}
fieldset.field legend{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px;padding:0}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice.two-c{grid-template-columns:1fr 1fr}
.pill{position:relative;display:block}
.pill input{position:absolute;opacity:0;inset:0;margin:0}
.pill span{display:block;text-align:center;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 6px;font-weight:700;font-size:14px;color:var(--ink-2)}
.pill input:checked+span{border-color:var(--grow);background:var(--grow-soft);color:var(--grow)}
.pill input:focus-visible+span{outline:2px solid var(--market);outline-offset:2px}
.sub-h{margin:8px 0 0;font-size:12px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em}
.opt{font-weight:500;color:var(--ink-2);text-transform:none;letter-spacing:0}
.onb-feat{display:flex;flex-direction:column;gap:10px}
.onb-feat div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.onb-feat b{display:block;font-size:15px}
.onb-feat span{font-size:13.5px;color:var(--ink-2)}
.onb-cta{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:var(--r-md);padding:13px 16px;margin-bottom:12px;background:var(--grow);color:var(--surface)}
.onb-cta b{display:block;font-size:15px}
.onb-cta small{display:block;font-size:12.5px;opacity:.85;margin-top:1px}
.onb-cta>span:last-child{margin-left:auto;font-size:22px;line-height:1}
/* ---- Correo y documentos ---- */
.form textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;resize:vertical}
.mail-st{display:flex;flex-direction:column;gap:2px;border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.mail-st.on{background:var(--grow-soft)}
.mail-st b{font-size:15px}
.mail-st span{font-size:13px;color:var(--ink-2)}
details.adv{border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.adv summary{cursor:pointer;font-weight:700;font-size:14px;padding:12px 0;list-style-position:inside}
.adv-in{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.mail-out{font-size:13.5px;color:var(--ink-2)}
.mail-out b{color:var(--ink)}
.inv-amt{flex:1;min-width:0;font-size:13px;font-weight:700}
.hit{color:var(--grow)}


/* ---- Íconos de gastos fijos y avisos de la guía ---- */
.fx-ic{width:34px;height:34px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.fx-ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chk-row .check{gap:12px}
.chk-row .check input{flex-shrink:0}
.fx-h{display:flex;align-items:center;gap:10px}
.fx-h .fx-ic{width:28px;height:28px;border-radius:9px}
.fx-h .fx-ic svg{width:16px;height:16px}
.tx .fx-ic{width:36px;height:36px;border-radius:12px}
.onb-note{display:flex;gap:12px;align-items:flex-start;background:var(--debt-soft);border-radius:var(--r-md);padding:12px 14px;margin:0 0 16px;font-size:14px;line-height:1.45}
.onb-note svg{width:22px;height:22px;flex-shrink:0;margin-top:1px;fill:none;stroke:var(--debt);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.onb-note b{color:var(--ink)}
.field label.pill,.pill{display:block}
.choice{align-items:stretch}
.choice .pill span{height:100%;display:flex;align-items:center;justify-content:center;padding:10px 4px;line-height:1.2}


/* ---- Cuenta ---- */
#accBtn{position:relative}
#accBtn.in{background:var(--grow);border-color:var(--grow)}
.acc-ini{color:var(--surface);font-weight:800;font-size:14px;font-family:var(--f-display);line-height:1}
#accBtn[data-sync="pend"]::after,#accBtn[data-sync="sync"]::after,#accBtn[data-sync="error"]::after{content:"";position:absolute;right:-2px;top:-2px;width:11px;height:11px;border-radius:50%;background:var(--debt);border:2px solid var(--bg)}
#accBtn[data-sync="error"]::after{background:var(--spend)}
.lead-s{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.5}
.lead-s b{color:var(--ink)}
.link-btn.danger{color:var(--spend);align-self:flex-start}
.del-box{background:var(--spend-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.del-box p{margin:0;font-size:13.5px}
.priv p{margin:0;font-size:14px;line-height:1.55;color:var(--ink-2)}
.priv b{color:var(--ink)}
.onb-login{border:0;background:none;color:var(--grow);font-weight:700;font-size:14px;padding:10px 0;text-decoration:underline;align-self:flex-start;display:block}
a.btn{display:block;text-align:center;text-decoration:none}


/* ---- Versión 2: identidad dominicana, pestañas nuevas y gráficos ---- */
:root{
  --rd-blue:#002D62; --rd-red:#CE1126;
  --brand:#0B4A9E; --brand-soft:#E2EBF8; --brand-deep:#061D42; --brand-deep2:#0E3F86; --brand-glow:#A8C8FF;
  --inv:#08748F; --inv-soft:#D6F0F6; --inv-deep:#05313B; --inv-deep2:#0A6378; --inv-glow:#8AE4F3;
  --goal:#B0418F; --goal-soft:#F7E0F0; --i-bolsa:#A84A16;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c-gray:#8A9691;
  --widget:#05313B; --widget-accent:#8AE4F3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#86AEFF; --brand-soft:#15233F; --brand-deep:#08193A; --brand-deep2:#123A78; --brand-glow:#A8C8FF;
  --inv:#4CC8E4; --inv-soft:#0D2D35; --inv-deep:#052930; --inv-deep2:#0A5464; --inv-glow:#8AE4F3;
  --goal:#E77BCB; --goal-soft:#381730; --i-bolsa:#A84A16;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c-gray:#7C8B86;
  --widget:#052930; --widget-accent:#8AE4F3}}
:root[data-theme="dark"]{
  --brand:#86AEFF; --brand-soft:#15233F; --brand-deep:#08193A; --brand-deep2:#123A78; --brand-glow:#A8C8FF;
  --inv:#4CC8E4; --inv-soft:#0D2D35; --inv-deep:#052930; --inv-deep2:#0A5464; --inv-glow:#8AE4F3;
  --goal:#E77BCB; --goal-soft:#381730; --i-bolsa:#A84A16;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c-gray:#7C8B86;
  --widget:#052930; --widget-accent:#8AE4F3}

/* Marca */
.brand-mark{background:none;border-radius:9px;overflow:hidden;width:32px;height:32px;box-shadow:0 2px 6px -2px rgb(0 45 98 / .45)}
.brand-mark svg{width:32px;height:32px;stroke:none;display:block}
.brand small .rd{color:var(--rd-red)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand small .rd{color:#FF5A6A}}
:root[data-theme="dark"] .brand small .rd{color:#FF5A6A}

/* Tarjetas protagonistas por sección */
.hero.brandc{--d1:var(--brand-deep);--d2:var(--brand-deep2);--glow:var(--brand-glow)}
.hero.brandc.neg{--d1:var(--debt-deep);--d2:var(--debt-deep2);--glow:var(--debt-glow)}
.inv-card{--d1:var(--inv-deep);--d2:var(--inv-deep2);--glow:var(--inv-glow)}
.addb{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:var(--glow);color:var(--d1);box-shadow:0 4px 12px -4px rgb(0 0 0 / .4)}
.addb svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.hero-r{display:flex;align-items:center;gap:12px}
.hero-sub{font-size:13px;color:color-mix(in srgb,var(--on-deep) 72%,transparent);margin-top:4px}
.hero-seg{display:inline-flex;margin-top:12px}

/* Períodos */
.per{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:14px;padding-bottom:2px}
.per::-webkit-scrollbar{display:none}
.per button{flex-shrink:0;border:1px solid color-mix(in srgb,var(--on-deep) 22%,transparent);background:none;color:color-mix(in srgb,var(--on-deep) 82%,transparent);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700}
.per button[aria-pressed="true"]{background:var(--on-deep);border-color:var(--on-deep);color:var(--d1)}
.per.light{margin-top:0}
.per.light button{border-color:var(--line);color:var(--ink-2);background:var(--surface)}
.per.light button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.per-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.per-dates label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:color-mix(in srgb,var(--on-deep) 75%,transparent)}
.per-dates input{border:1px solid color-mix(in srgb,var(--on-deep) 25%,transparent);background:color-mix(in srgb,var(--on-deep) 10%,transparent);color:var(--on-deep);border-radius:10px;padding:8px;font-size:15px;color-scheme:dark;min-width:0}
.per-dates.light label{color:var(--ink-2)}
.per-dates.light input{border-color:var(--line);background:var(--bg);color:var(--ink);color-scheme:inherit}

/* Paneles */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-top:12px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;min-height:30px}
.panel-h>b{font-size:15px;font-weight:800}
.panel-s{font-size:12px;color:var(--ink-2);font-weight:600;text-align:right}
.seg.tiny{padding:3px;border-radius:10px;margin:0;flex-shrink:0}
.seg.tiny button{padding:5px 9px;font-size:12px;border-radius:8px;flex:0 0 auto}
.io{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.io>*{min-width:0;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px}
.io small{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.io strong{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pos{color:var(--grow)} .negc{color:var(--spend)}
.sw{display:inline-block;width:8px;height:8px;border-radius:3px;flex-shrink:0}
.flow2{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;margin-top:12px}
.flow2 i{display:block;min-width:3px}
.sec-tot{margin-left:auto;font-size:14px;letter-spacing:-.01em;text-transform:none;color:var(--ink);font-weight:800}
h2.sec button{margin-left:auto}
.rowbtn{width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left;font:inherit;color:inherit}
.tx-group .rowbtn:last-child{border-bottom:0}
.mbar{display:block;height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;max-width:150px}
.mbar i{display:block;height:100%;border-radius:99px}
.empty.sm{padding:16px 14px;font-size:13.5px}

/* Dona + lista de barras */
.dn{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:center}
.dn-svg{width:112px;height:112px;display:block}
.dn-svg circle{transition:opacity .15s}
.dn-t1{font-family:var(--f-display);font-weight:800;font-size:12px;fill:var(--ink);letter-spacing:-.02em}
.dn-t2{font-size:10px;font-weight:700;fill:var(--ink-2)}
.ml{display:flex;flex-direction:column;gap:9px;min-width:0}
.ml-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;column-gap:7px;row-gap:4px;align-items:center;font-size:12.5px}
.ml-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:600}
.ml-row b{font-weight:800;white-space:nowrap}
.ml-t{grid-column:2/3;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.ml-t i{display:block;height:100%;border-radius:99px}
.ml-row small{font-size:11px;font-weight:700;color:var(--ink-2);text-align:right}
@media (max-width:350px){.dn{grid-template-columns:1fr;justify-items:center}.ml{width:100%}}

/* Columnas en el tiempo */
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);padding-top:4px}
.col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;border:0;background:none;padding:0 1px;border-radius:6px 6px 0 0}
.col i{display:block;width:100%;max-width:28px;background:var(--cc);opacity:.55;border-radius:4px 4px 0 0;transition:opacity .15s}
.col[aria-pressed="true"] i{opacity:1}
.col:hover i{opacity:.85}
.col-l{display:flex;gap:3px;margin-top:6px}
.col-l span{flex:1;min-width:0;text-align:center;font-size:10.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:visible}
.col-cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2)}
.col-cap span::first-letter{text-transform:uppercase}
.col-cap b{color:var(--ink);font-size:15px;font-weight:800}

/* Barras por entidad */
.hb{display:flex;flex-direction:column;gap:11px}
.hb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center;font-size:13px}
.hb-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hb-row b{font-weight:800}
.hb-t{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:4px;background:var(--inv)}

/* Desglose por entidad */
.eg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.eg-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:color-mix(in srgb,var(--inv) 6%,var(--surface))}
.eg-h .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eg-h .mid span{font-size:12px;color:var(--ink-2)}
.eg-v{text-align:right}
.eg-v b{display:block;font-size:16px;font-weight:800;white-space:nowrap}
.eg-v small{font-size:11.5px;color:var(--ink-2);font-weight:600}
.eg-r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.eg-r .mid b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eg-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:3px}
.ty{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.soonc{color:var(--debt);font-weight:700}
.eg-a{text-align:right;font-weight:700;font-size:14.5px;white-space:nowrap}
.eg-a small{display:block;font-size:11.5px;font-weight:700;color:var(--grow)}
.inst.bolsa{--ic:var(--i-bolsa);border-radius:4px 14px 4px 14px}

/* Formularios */
.ent-o{margin-top:8px}
.form select optgroup{font-weight:700}

/* Próximamente */
.soonv{position:relative;text-align:center;padding:42px 20px 28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-top:6px;overflow:hidden}
.soonv::before{content:"";position:absolute;inset:0 0 auto;height:120px;background:radial-gradient(80% 100% at 50% 0%,var(--ss),transparent 70%);pointer-events:none}
.soonv>*{position:relative}
.soon-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sc);background:var(--ss);border-radius:99px;padding:4px 10px}
.soon-ic{display:grid;place-items:center;width:72px;height:72px;margin:18px auto 6px;border-radius:24px;background:var(--sc);color:var(--surface);box-shadow:0 10px 24px -10px var(--sc)}
.soon-ic svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.soonv h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:10px 0 6px}
.soonv>p{margin:0 auto;color:var(--ink-2);max-width:32ch;font-size:15px}
.soonv ul{list-style:none;padding:0;margin:20px auto 0;max-width:300px;text-align:left;display:flex;flex-direction:column;gap:10px}
.soonv li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;font-weight:600}
.soonv li svg{width:20px;height:20px;flex-shrink:0;fill:none;stroke:var(--sc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.soon-note{margin:20px auto 0;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;max-width:34ch}

/* Barra inferior de 7 pestañas */
nav.tabs .inner{grid-template-columns:repeat(7,1fr)}
nav.tabs button{font-size:10.5px;padding:7px 0 8px;gap:2px;min-width:0}
nav.tabs .ic{width:40px;height:27px}
nav.tabs svg{width:20px;height:20px}
@media (max-width:360px){nav.tabs button{font-size:9.5px;letter-spacing:-.01em}nav.tabs .ic{width:34px}}
.fab{display:none!important}
.app{padding-bottom:110px}
.brand h1{text-wrap:balance}
.brand h1.long{font-size:20px;line-height:1.02}
.io strong{font-size:14.5px}
header.top{gap:8px}.brand{min-width:0;flex:1}.brand>div{min-width:0}.top-actions{flex-shrink:0}
@media (max-width:360px){.brand{gap:8px}.brand h1{font-size:20px}.brand h1.long{font-size:16.5px}.top-actions{gap:5px}.icon-btn{width:32px;height:32px}.chip-btn{padding:5px 9px}.brand-mark,.brand-mark svg{width:28px;height:28px}}


/* ---- Versión 2.1: barra más limpia, resumen interactivo, edición ---- */
nav.tabs{background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px -14px rgb(0 0 0 / .25)}
nav.tabs .inner{grid-template-columns:repeat(6,1fr)}
nav.tabs button{font-size:11px;font-weight:600;padding:8px 0 9px;gap:3px;color:var(--ink-2)}
nav.tabs .ic{width:44px;height:28px}
nav.tabs svg{width:21px;height:21px;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{font-weight:800}
@media (max-width:360px){nav.tabs button{font-size:10px}nav.tabs .ic{width:38px}}

/* Acciones rápidas */
.qa{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:12px}
.qa-b{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 14px;font-weight:800;font-size:15px;color:var(--surface)}
.qa-b.inc{background:var(--grow)}
.qa-b.exp{background:var(--spend)}
.qa-b.more{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding-inline:14px}
.qa-ic{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--surface) 22%,transparent)}
.qa-b.more .qa-ic{background:var(--surface-2)}
.qa-ic svg{width:15px;height:15px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round}
.qa-b.more .qa-ic svg{fill:currentColor;stroke:none}

/* Saldo: filas con cifras completas */
.hrows{margin-top:14px;border-top:1px solid color-mix(in srgb,var(--on-deep) 16%,transparent)}
.hrows div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--on-deep) 10%,transparent)}
.hrows div:last-child{border-bottom:0;padding-bottom:0}
.hrows span{font-size:13px;color:color-mix(in srgb,var(--on-deep) 74%,transparent);font-weight:600}
.hrows b{font-size:16px;font-weight:800;color:var(--on-deep);white-space:nowrap}

/* Ingresos y gastos en filas */
.iol{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.iol-r{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;align-items:center;gap:10px;width:100%;padding:12px 12px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;font:inherit;color:inherit}
.iol-r:last-child{border-bottom:0}
.iol-r>span:first-child{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.iol-r b{font-size:16px;font-weight:800;white-space:nowrap}
.iol-r.tot{grid-template-columns:minmax(0,1fr) auto 14px;background:var(--bg)}
.chev{color:var(--ink-2);font-size:20px;line-height:1;font-weight:500;justify-self:end}
.per button{display:inline-flex;align-items:center;gap:5px}
.per .cal{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* Gráfico doble */
.dual .col{gap:2px;padding:0 2px}
.dual .col i{max-width:11px;flex:1;opacity:.5}
.dual .col[aria-pressed="true"] i{opacity:1}
.dual .ci{background:var(--grow)} .dual .ce{background:var(--spend)}
.col-cap2{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2)}
.col-cap2>span{display:flex;align-items:center;gap:6px;min-width:0}
.col-cap2 .cc-cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-cap2 .cc-cap::first-letter{text-transform:uppercase}
.col-cap2 b{color:var(--ink);font-size:14px;font-weight:800}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink-2);font-weight:600}
.leg>span{display:flex;align-items:center;gap:6px}
.leg-h{margin-left:auto;font-weight:500}

/* Secciones del resumen */
.sec-add{border:0;background:var(--surface-2)!important;color:var(--ink)!important;border-radius:99px;padding:5px 11px!important;font-size:12.5px!important;font-weight:700!important;margin-left:10px}
h2.sec .sec-tot+.sec-add{margin-left:10px}
.sec-note{margin-left:auto;font-size:11.5px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--ink-2)}
.rowbtn{cursor:pointer}
.rowbtn:active{background:var(--surface-2)}
.tx.rowbtn{gap:10px}
.tx .chev{margin-left:-2px}
.hint.center{text-align:center;margin:18px 0 0}

/* Inversiones desplegables */
details.acc{border-bottom:1px solid var(--line)}
details.acc:last-child{border-bottom:0}
details.acc>summary{list-style:none;cursor:pointer;border-bottom:0}
details.acc>summary::-webkit-details-marker{display:none}
.chev.rot{transition:transform .2s;transform:rotate(90deg)}
details.acc[open] .chev.rot{transform:rotate(-90deg)}
.acc-in{padding:0 0 8px 48px;display:flex;flex-direction:column}
.acc-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-top:1px dashed var(--line);background:none;padding:10px 0;text-align:left;font:inherit;color:inherit}
.acc-r .mid b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-r .mid span{font-size:12px;color:var(--ink-2)}
.acc-v{font-weight:700;font-size:13.5px;white-space:nowrap}

/* Menús de opciones */
.menu{display:flex;flex-direction:column;gap:8px}
.menu-r{display:grid;grid-template-columns:auto minmax(0,1fr) 14px;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:12px 14px;font:inherit;color:inherit}
.menu-r b{display:block;font-size:15px}
.menu-r small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.menu-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--mc) 15%,transparent);color:var(--mc)}
.menu-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Confirmación de borrado */
.confirm{text-align:center;padding-top:4px}
.confirm-ic{display:grid;place-items:center;width:56px;height:56px;border-radius:18px;margin:0 auto 12px;background:var(--spend-soft);color:var(--spend)}
.confirm-ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.confirm h3{text-wrap:balance}
.confirm .lead-s{margin:0 auto 16px;max-width:34ch}
.link-btn.del-link{align-self:center;margin-top:6px;padding:8px}
.widgets{opacity:.95}
.qa-b{min-width:0}
@media (max-width:370px){.qa{gap:6px}.qa-b{padding:11px 8px;font-size:14px;gap:6px}.qa-b.more{padding-inline:10px}h2.sec{flex-wrap:wrap;row-gap:6px}h2.sec .sec-tot{font-size:13px}.sec-add{padding:4px 9px!important}}


/* ---- Versión 2.2: resumen agrupado, filtros y registro más amable ---- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Moneda de referencia: solo RD$ y US$ */
.cur-seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.cur-seg button{border:0;background:none;border-radius:999px;padding:5px 9px;font-size:12.5px;font-weight:800;color:var(--ink-2);line-height:1.1}
.cur-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
@media (max-width:360px){.cur-seg button{padding:5px 7px;font-size:12px}}

/* Mes y año */
.ym{display:flex;align-items:center;gap:4px}
.ym-arr{border:0;background:var(--surface-2);width:30px;height:32px;border-radius:10px;font-size:18px;line-height:1;color:var(--ink);padding:0}
.ym-arr:disabled{opacity:.35}
.ym-sel{position:relative;display:block}
.ym-sel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 24px 6px 10px;font-size:13.5px;font-weight:700;height:32px}
.ym-sel::after{content:"";position:absolute;right:9px;top:50%;width:6px;height:6px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.panel-h:has(.ym){flex-wrap:wrap;row-gap:10px}
.iol{margin-top:2px}
.flow-t{margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.flow-t b{color:var(--ink)}

/* Filtros del gráfico */
.chart-f{display:flex;flex-direction:column;gap:8px;margin:-2px 0 12px}
.chart-f .per{margin:0}
.leg-t{display:flex;gap:6px}
.leg-t button{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:none;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.leg-t button[aria-pressed="true"]{border-style:solid;color:var(--ink);background:var(--surface)}
.leg-t button[aria-pressed="false"] .sw{opacity:.3}
.dual.dense .col{padding:0 .5px;gap:1px}
.dual.dense .col i{max-width:6px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sum3 div{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.sum3 small{display:block;font-size:11px;color:var(--ink-2);font-weight:600}
.sum3 b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Dinero por moneda */
.cmix{display:grid;grid-template-columns:80px minmax(0,1fr);gap:16px;align-items:center}
.cmix-svg{width:80px;height:80px;display:block}
.cmix-t{font-family:var(--f-display);font-weight:800;font-size:15px;fill:var(--ink)}
.cmix-l{display:flex;flex-direction:column;gap:10px}
.cmix-r{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center}
.cmix-r .sw{width:10px;height:10px}
.cmix-n{font-size:13.5px;font-weight:700;min-width:0}
.cmix-n small{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.cmix-v{text-align:right;white-space:nowrap}
.cmix-v b{display:block;font-size:15px;font-weight:800}
.cmix-v small{font-size:11.5px;color:var(--ink-2);font-weight:600}

/* Grupos desplegables: grupo → entidad → cuenta */
.grps{display:flex;flex-direction:column;gap:10px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.grp>summary,.ent>summary{list-style:none;cursor:pointer}
.grp>summary::-webkit-details-marker,.ent>summary::-webkit-details-marker{display:none}
.grp-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto 14px;column-gap:12px;row-gap:6px;align-items:center;padding:14px}
.grp-h{grid-template-columns:auto minmax(0,1fr) 14px!important}
.grp-h .grp-ic{grid-row:1/3;align-self:start}
.grp-h .grp-v{grid-column:2/4;grid-row:2;text-align:left;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.grp-h .grp-v b{font-size:20px;font-family:var(--f-display);letter-spacing:-.02em}
.grp-h .cpills{margin:0;justify-content:flex-start}
.grp-v.card{flex-direction:column;align-items:flex-start;gap:3px}
.grp-k{font-size:11.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.grp-owe{font-size:13px;color:var(--ink-2);font-weight:600}
.grp-owe b{display:inline!important;font-family:var(--f-body)!important;font-size:13.5px!important;color:var(--spend);letter-spacing:0!important}
.owe-s{font-size:11.5px!important;color:var(--spend)!important;font-weight:700}
.it-k{display:none}
.last2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;min-width:0;display:flex;flex-direction:column}
.lcol.exp{border-top:3px solid var(--spend)}
.lcol.inc{border-top:3px solid var(--grow)}
.lcol-h{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px;font:inherit;font-size:13.5px;font-weight:800;color:var(--ink)}
.lcol-h>span{display:flex;align-items:center;gap:7px}
.lrow{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;font:inherit;color:inherit;min-width:0}
.lrow:last-child{border-bottom:0}
.lrow:active{background:var(--surface-2)}
.lrow b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow span{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow strong{font-size:14px;font-weight:800;margin-top:2px}
.lcol.exp .lrow strong{color:var(--spend)}
.lcol.inc .lrow strong{color:var(--grow)}
.lcol.inc{text-align:right}
.lcol.inc .lrow{align-items:flex-end;text-align:right}
.lrow b,.lrow span{max-width:100%}
.lempty{margin:0;padding:14px 12px;font-size:12.5px;color:var(--ink-2)}
.field label.via,.field label.cp{display:block;font-size:inherit;font-weight:inherit;color:var(--ink)}
.via-t b{color:var(--ink)}
.grp-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 15%,transparent);color:var(--gc)}
.grp-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.grp-t{min-width:0}
.grp-t b{display:block;font-size:15.5px;font-weight:800}
.grp-t span{font-size:12.5px;color:var(--ink-2)}
.grp-v{text-align:right;min-width:0}
.grp-v b{display:block;font-size:16px;font-weight:800;white-space:nowrap}
.cpills{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;margin-top:3px}
.cpill{font-size:11px;font-weight:700;white-space:nowrap;border-radius:6px;padding:1px 6px;color:var(--ink);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.grp[open]>.grp-h{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--gc) 5%,var(--surface))}
.grp[open]>summary .chev.rot,.ent[open]>summary .chev.rot{transform:rotate(-90deg)}
.grp-in{padding:4px 12px 12px}
.ent{border-bottom:1px dashed var(--line)}
.ent-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto 14px;gap:10px;align-items:center;padding:11px 2px}
.ent-t{min-width:0}
.ent-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent-t span{font-size:12px;color:var(--ink-2)}
.ent-v{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ent-in{margin:0 0 10px 44px;border-left:2px solid var(--line);padding-left:10px}
.it-r{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;padding:9px 0;border-top:1px solid var(--line)}
.it-r:first-child{border-top:0}
.it-t b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-t span{font-size:11.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:3px 6px;align-items:center;margin-top:2px}
.it-v{text-align:right;white-space:nowrap}
.it-v b{display:block;font-size:13.5px;font-weight:800}
.it-v small{font-size:11px;color:var(--ink-2)}
.it-r .chev{font-size:17px}
.grp-add{display:block;width:100%;margin-top:10px;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px;font-weight:700;font-size:13.5px;color:var(--gc)}
.grp-empty{margin:10px 2px 0}

/* Registro de gasto o ingreso */
.mv-top{margin-bottom:12px}
.kind-tog{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px}
.kind-tog button{border:0;background:none;border-radius:11px;padding:10px;font-weight:800;font-size:15px;color:var(--ink-2)}
.kind-tog button[data-kind="gasto"][aria-pressed="true"]{background:var(--spend);color:var(--surface)}
.kind-tog button[data-kind="ingreso"][aria-pressed="true"]{background:var(--grow);color:var(--surface)}
.form.mv{gap:16px}
.amt-box{border-radius:16px;padding:14px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1.5px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.amt-box>label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
.amt-row{display:flex;gap:8px;align-items:center}
.form .amt-row input{flex:1;min-width:0;border:0!important;background:none!important;font-family:var(--f-display);font-size:34px!important;font-weight:800;letter-spacing:-.02em;padding:2px 0!important;color:var(--ink);outline:none}
.cur-pick{display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.cur-pick button{border:0;background:none;border-radius:7px;padding:4px 8px;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.cur-pick button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.amt-echo{display:block;min-height:1.2em;margin-top:6px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.amt-echo .bad{color:var(--spend)}
.vias{display:flex;flex-direction:column}
.via-g{display:flex;align-items:center;gap:8px;margin:10px 0 6px;font-size:12px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.via-g:first-child{margin-top:0}
.cflag{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--surface);background:var(--cc);border-radius:5px;padding:2px 5px}
.via-list{display:flex;flex-direction:column;gap:6px}
.via{position:relative;display:block}
.via input{position:absolute;opacity:0;inset:0;margin:0}
.via-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto 22px;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;cursor:pointer}
.via-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.via-t small{font-size:12px;color:var(--ink-2)}
.via-a{text-align:right;white-space:nowrap}
.via-a b{display:block;font-size:13.5px;font-weight:800}
.via-a small{font-size:11px;color:var(--ink-2)}
.via-ok{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.via-ok svg{width:14px;height:14px;fill:none;stroke:var(--surface);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.via input:checked+.via-in{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.via input:checked+.via-in .via-ok{background:var(--accent);border-color:var(--accent)}
.via input:checked+.via-in .via-ok svg{opacity:1}
.via input:focus-visible+.via-in{outline:2px solid var(--market);outline-offset:2px}
.via-cash{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.via-cash svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.via-h{margin:8px 2px 0;font-size:12.5px;color:var(--ink-2)}
.cat-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cp{position:relative;display:block}
.cp input{position:absolute;opacity:0;inset:0;margin:0}
.cp span{display:flex;flex-direction:column;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 2px 8px;font-size:11.5px;font-weight:700;color:var(--ink-2);text-align:center;line-height:1.15;cursor:pointer;height:100%}
.cp i{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--cc)}
.cp input:checked+span{border-color:var(--cc);color:var(--ink);background:color-mix(in srgb,var(--cc) 8%,var(--surface))}
.cp input:focus-visible+span{outline:2px solid var(--market);outline-offset:2px}
.date-pick{display:grid;grid-template-columns:auto auto 1fr;gap:6px}
.date-pick button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;font-weight:700;font-size:14px;color:var(--ink-2)}
.date-pick button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.mv-save{position:sticky;bottom:0;box-shadow:0 -10px 16px 4px var(--surface)}
@media (max-width:360px){.cat-pick{grid-template-columns:repeat(3,1fr)}}


/* ---- Versión 2.3: crema, varios meses, evolución por moneda y lista única ---- */
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:2px}
.mgrid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0;font-size:13px;font-weight:700;color:var(--ink-2);text-transform:capitalize}
.mgrid button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.mgrid button:disabled{opacity:.35}
.mg-f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 12px}
.mg-l{font-size:13.5px;font-weight:800;color:var(--ink)}
.mg-all{border:0;background:none;color:var(--brand);font-weight:700;font-size:13px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.stk{padding:0 3px}
.stk-in{display:flex;flex-direction:column-reverse;gap:2px;width:100%;max-width:26px;border-radius:5px 5px 0 0;overflow:hidden;opacity:.6;transition:opacity .15s}
.stk[aria-pressed="true"] .stk-in{opacity:1}
.stk-in i{display:block;min-height:2px}
.mix-cap{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2)}
.mix-cap .mc-a{color:var(--ink)}
.mix-cap .mc-c{text-transform:capitalize}
.mix-note{margin:10px 0 0;font-size:13px;color:var(--ink-2);line-height:1.45}
.mix-note b{color:var(--ink)}
.mvp .per{margin:0}
.mv-pl{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}
.mv-per{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mv-per button{justify-content:center;padding-inline:6px}
.mvf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.mv-ent{flex:1;min-width:150px}
.mv-ent select{width:100%}
.mv-sum{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:12px 0 4px;padding:10px 12px;background:var(--bg);border-radius:12px;font-weight:800;font-size:14.5px}
.mv-sum .pos{text-align:right}
.mv-sum>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:370px){.mv-sum{font-size:13px;padding:9px 10px;gap:6px}.mv-per button{font-size:12px;padding-inline:4px}}
.mv-sum{grid-template-columns:1fr 1fr!important;row-gap:2px!important}
.mv-sum .mv-n{grid-column:1/-1;grid-row:1}
.mv-n{font-size:12px;font-weight:600;color:var(--ink-2);text-align:center}
.mv-list{display:flex;flex-direction:column;gap:6px}
.mv-day{display:flex;justify-content:center;margin:8px 0 2px}
.mv-day span{font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:99px;padding:3px 10px;text-transform:capitalize}
.mvr{display:flex;flex-direction:column;gap:1px;width:84%;border:0;border-radius:14px;padding:9px 12px;font:inherit;color:inherit}
.mvr.out{align-self:flex-start;align-items:flex-start;text-align:left;background:color-mix(in srgb,var(--spend) 9%,var(--surface));border-left:3px solid var(--spend);border-bottom-left-radius:4px}
.mvr.in{align-self:flex-end;align-items:flex-end;text-align:right;background:color-mix(in srgb,var(--grow) 10%,var(--surface));border-right:3px solid var(--grow);border-bottom-right-radius:4px}
.mvr b{font-size:14px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvr small{font-size:11.5px;color:var(--ink-2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvr strong{font-size:15.5px;font-weight:800;margin-top:2px}
.mvr.out strong{color:var(--spend)}
.mvr.in strong{color:var(--grow)}
.mvr:active{filter:brightness(.97)}


/* ---- Versión 2.4: selector de meses compacto y globo en el gráfico ---- */
.ym-pill{display:inline-flex;align-items:center;gap:7px;max-width:62%;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink)}
.ym-pill svg{width:15px;height:15px;flex-shrink:0;fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round}
.ym-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ym-pill i{flex-shrink:0;width:6px;height:6px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:translateY(-2px) rotate(45deg)}
.mp-y{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0 12px}
.mp-y b{font-family:var(--f-display);font-size:22px;font-weight:800;min-width:64px;text-align:center}
.mgrid{grid-template-columns:repeat(4,1fr)}
.mgrid button{padding:11px 0;font-size:14px}
.mp-q{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.mp-q button{border:0;background:var(--surface-2);border-radius:10px;padding:9px 4px;font-size:13px;font-weight:700;color:var(--ink)}
#mpOk:disabled{opacity:.4}
.dual{position:relative}
.dual .cols{padding-top:58px;height:180px}
.dual.few .col i{max-width:22px}
.dtip{position:absolute;top:0;left:0;display:flex;flex-direction:column;gap:2px;min-width:132px;background:var(--ink);color:var(--bg);border-radius:12px;padding:7px 10px;font-size:12.5px;font-weight:700;box-shadow:0 8px 20px -10px rgb(0 0 0 / .5);pointer-events:none;transition:left .15s}
.dtip::after{content:"";position:absolute;bottom:-5px;left:calc(var(--ax,50%) - 5px);width:10px;height:10px;background:var(--ink);transform:rotate(45deg)}
.dtip .dt-c{font-size:11.5px;font-weight:600;opacity:.75}
.dtip .dt-c::first-letter{text-transform:uppercase}
.dtip span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.dtip i{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.dguide{position:absolute;top:62px;height:118px;width:0;border-left:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent);pointer-events:none;transition:left .15s}
.dnote{margin:8px 0 0;font-size:12px}
.dempty{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:28px 12px;border:1.5px dashed var(--line);border-radius:12px;background:var(--bg)}
.dempty b{font-size:14.5px}
.panel:has(.dempty) .chart-f,.panel:has(.dempty) .panel-h .seg{display:none}
.dempty span{font-size:13px;color:var(--ink-2);max-width:30ch}


/* ---- Globos de los gráficos: solo al tocar ---- */
.tipc{position:relative}
.tipc .cols{padding-top:66px;height:190px}
.dual .col i,.stk-in{opacity:1}
.tipc.picked .col:not([aria-pressed="true"]) i,.tipc.picked .stk:not([aria-pressed="true"]) .stk-in{opacity:.38}
.dguide{top:70px;height:120px}
/* ---- Nombres completos ---- */
.it-t b,.ent-t b,.grp-t b,.via-t b,.acc-r .mid b,.eg-h .mid b,.eg-r .mid b,.tx-main b,.mvr b,.cc-id b{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.25}
.it-t span{line-height:1.35}
.mvr b{max-width:100%}
/* ===== Guía inicial v2: neutra, un solo color de acción (azul = confianza) ===== */
.onb2{--accent:var(--brand)}
.onb2 .o-top{display:flex;align-items:center;gap:12px;min-height:44px}
.onb2 .o-back{width:44px;height:44px;margin-left:-10px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex-shrink:0}
.onb2 .o-back svg,.onb2 .o-why svg,.onb2 .o-opt-ic svg,.onb2 .o-tick svg,.onb2 .o-done-ic svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.onb2 .o-back svg{width:24px;height:24px}
.onb2 .o-prog{flex:1;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.onb2 .o-prog i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .35s ease}
.onb2 .o-link{border:0;background:none;color:var(--ink-2);font-weight:600;font-size:15px;padding:12px 4px;min-height:44px}
.onb2 .o-top .o-link{margin-left:auto}
.onb2 .o-step{margin:22px 0 0;font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.onb2 h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,7.4vw,32px);letter-spacing:-.02em;line-height:1.12;margin:6px 0 8px;text-wrap:balance;outline:none;color:var(--ink)}
.onb2 .o-lead{color:var(--ink-2);margin:0 0 22px;font-size:16px;line-height:1.5;max-width:42ch}
.onb2 .form{gap:16px}
.onb2 .field label,.onb2 legend{font-size:14px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0}
.onb2 legend{margin-bottom:8px;padding:0}
.onb2 fieldset{border:0;margin:0;padding:0;min-width:0}
.onb2 input:not([type=checkbox]):not([type=radio]),.onb2 select{font-size:16px;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;width:100%}
.onb2 input:focus,.onb2 select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.onb2 input.o-big{font-size:22px;font-weight:600;min-height:60px}
.onb2 .pill span{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;min-height:48px;border-radius:12px}
.onb2 .pill input:checked+span{border-color:var(--brand);background:var(--brand-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--brand)}
.onb2 .pill input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.onb2 .o-chips{display:flex;flex-wrap:wrap;gap:8px}
.onb2 .o-chips .pill span{padding:0 16px;display:flex;align-items:center;min-height:44px;border-radius:99px}
/* Monto + moneda */
.onb2 .o-amt{display:flex;gap:8px;align-items:stretch}
.onb2 .o-amt input{flex:1;min-width:0;font-size:20px!important;font-weight:600;font-variant-numeric:tabular-nums}
.onb2 .o-cur{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:2px;flex-shrink:0}
.onb2 .o-cur button{border:0;background:none;border-radius:9px;padding:0 12px;font-weight:600;font-size:14px;color:var(--ink-2);min-width:52px}
.onb2 .o-cur button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
/* Bienvenida */
.onb2 .o-hello{padding-top:min(8vh,56px)}
.onb2 .o-logo{display:block;width:56px;height:56px;border-radius:16px;overflow:hidden;margin-bottom:22px}
.onb2 .o-logo svg{width:100%;height:100%}
.onb2 .o-hello h2{font-size:clamp(30px,8.4vw,36px);margin-top:0}
.onb2 .o-why{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.onb2 .o-why li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.onb2 .o-why li:last-child{border-bottom:1px solid var(--line)}
.onb2 .o-why svg{width:22px;height:22px;color:var(--ink-2);flex-shrink:0;margin-top:1px}
.onb2 .o-why b{display:block;font-size:15.5px;font-weight:600}
.onb2 .o-why span{font-size:14.5px;color:var(--ink-2);line-height:1.4}
.onb2 .o-alt{display:flex;flex-direction:column;align-items:center;gap:0;margin-top:14px}
.onb2 .o-alt .o-link{color:var(--brand);font-size:15px}
/* Pregunta Sí / No */
.onb2 .o-gate{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.onb2 .o-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:16px;min-height:64px;font-size:17px}
.onb2 .o-opt b{font-weight:600}
.onb2 .o-opt:active{border-color:var(--brand);background:var(--brand-soft)}
.onb2 .o-opt:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.onb2 .o-opt-ic{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.onb2 .o-opt-ic svg{width:20px;height:20px}
/* Elementos repetibles */
.onb2 .o-item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.onb2 .o-item-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.onb2 .o-item-h b{font-size:15.5px;font-weight:600}
.onb2 .o-rm{border:0;background:none;color:var(--ink-2);font-size:14px;font-weight:600;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.onb2 .o-add{border:1.5px dashed var(--line);background:none;border-radius:14px;min-height:52px;font-weight:600;font-size:15px;color:var(--brand);width:100%}
.onb2 .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.onb2 .opt{font-weight:500;color:var(--ink-2)}
/* Pagos fijos */
.onb2 .o-fx{display:flex;flex-direction:column;gap:8px}
.onb2 .o-fx-r{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;transition:border-color .15s}
.onb2 .o-fx-r.on{border-color:var(--brand)}
.onb2 .o-fx-h{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;cursor:pointer;position:relative}
.onb2 .o-fx-h input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.onb2 .o-fx-h input:focus-visible~.o-fx-n{text-decoration:underline}
.onb2 .o-fx-ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.onb2 .o-fx-ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.onb2 .o-fx-r.on .o-fx-ic{background:var(--brand-soft);color:var(--brand)}
.onb2 .o-fx-n{flex:1;font-size:15.5px;font-weight:500}
.onb2 .o-tick{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;flex-shrink:0}
.onb2 .o-tick svg{width:16px;height:16px;stroke-width:2.6}
.onb2 .o-fx-r.on .o-tick{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.onb2 .o-fx-in{padding:0 14px 14px}
/* Final */
.onb2 .o-done{padding-top:min(6vh,40px)}
.onb2 .o-done-ic{width:56px;height:56px;border-radius:50%;background:var(--grow-soft);color:var(--grow);display:grid;place-items:center;margin-bottom:18px}
.onb2 .o-done-ic svg{width:28px;height:28px;stroke-width:2.4}
.onb2 .o-done h2{margin-top:0}
.onb2 .o-sum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:12px}
.onb2 .o-sum div{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:12px 0;font-size:15.5px}
.onb2 .o-sum div+div{border-top:1px solid var(--line)}
.onb2 .o-sum span{color:var(--ink-2)}
.onb2 .o-sum b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.onb2 .o-sum .tot b{font-size:18px;font-weight:700}
/* Pie fijo */
.onb2 .o-foot{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 80%,transparent);padding:20px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:14px;display:flex;flex-direction:column;align-items:stretch;gap:2px}
.onb2 .o-next{background:var(--brand);color:var(--surface);min-height:54px;font-size:16.5px;font-weight:700;border-radius:14px}
.onb2 .o-skip{align-self:center}
.onb2 .err:empty{display:none}
.onb2 .o-amt{flex-wrap:wrap}
.onb2 .o-amt .echo{order:3;flex-basis:100%}
.onb2 .echo{color:var(--ink-2);font-weight:500;font-size:13.5px}
.onb2 .echo.bad{color:var(--spend)}

/* ===== Confirmación de 5 segundos ===== */
.hc{text-align:center;padding-top:4px}
.hc-ic{display:grid;place-items:center;width:56px;height:56px;border-radius:18px;margin:0 auto 12px;background:var(--spend-soft);color:var(--spend)}
.hc-ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hc h3{text-wrap:balance}
.hc .lead-s{margin:0 auto 14px;max-width:36ch}
.hc-list{list-style:none;margin:0 auto 18px;padding:12px 16px;max-width:340px;text-align:left;background:var(--surface-2);border-radius:14px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.hc-list li::before{content:"·";font-weight:800;margin-right:8px;color:var(--ink-2)}
.hc-hold{position:relative;overflow:hidden;width:100%;min-height:58px;border-radius:14px;border:2px solid var(--spend);background:var(--surface);color:var(--spend);font-weight:700;font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hc-hold .hc-fill{position:absolute;inset:0;background:var(--spend-soft);transform:scaleX(0);transform-origin:left;pointer-events:none}
.hc-hold.on{color:var(--ink)}
.hc-hold span{position:relative;font-variant-numeric:tabular-nums}
.hc-hint{margin:8px 0 14px}
.hc-last{margin:0 0 10px;font-size:14.5px;font-weight:600;color:var(--spend)}
.hc-yes{width:100%;background:var(--spend);min-height:54px;margin-bottom:10px}
.hc-no{width:100%;min-height:50px}

/* ===== Ajustes ===== */
.set-g{margin:0 0 18px}
.set-g h4{margin:0 0 8px 4px;font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.set-card{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:12px 14px;min-height:60px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.set-ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.set-ic svg,.set-go svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.set-t{flex:1;min-width:0}
.set-t b{display:block;font-size:15.5px;font-weight:600;overflow-wrap:anywhere}
.set-t small{display:block;font-size:13.5px;color:var(--ink-2);margin-top:1px}
.set-go{color:var(--ink-2);opacity:.7;display:flex}
.set-row.danger b{color:var(--spend)}
.set-row.danger .set-ic{background:var(--spend-soft);color:var(--spend)}
.set-form{padding:4px 14px}
.set-f{padding:12px 0;display:flex;flex-direction:column;gap:8px}
.set-f+.set-f{border-top:1px solid var(--line)}
.set-f>label,.set-l{font-size:14px;font-weight:600;color:var(--ink)}

function fmt(v,cur,dec=2){const k='n'+dec;nf[k]=nf[k]||new Intl.NumberFormat('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});const n=nf[k].format(Math.abs(v));return (v<0&&Math.abs(v)>=Math.pow(10,-dec)/2?'-':'')+(SYM[cur]||cur+' ')+n}

/* Lectura de montos tal como se escriben en RD: 1500 · 1,500 · 1,500.00 · RD$1,500 · 1.500 · 1 500 · 1.500,50 */
function money(v){
  let s=String(v==null?'':v).trim().replace(/[^\d.,-]/g,'');
  if(!/\d/.test(s))return NaN;
  const neg=s.charAt(0)==='-'; s=s.replace(/-/g,'');
  const c=s.lastIndexOf(','), d=s.lastIndexOf('.');
  if(c>-1&&d>-1){const dec=c>d?',':'.';s=s.split(dec===','?'.':',').join('').replace(dec,'.')}
  else if(c>-1){s=/^\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,''):s.replace(/,(?=[^,]*$)/,'.').replace(/,/g,'')}
  else if(d>-1){if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');else{const p=s.split('.');if(p.length>2)s=p.slice(0,-1).join('')+'.'+p[p.length-1]}}
  const n=parseFloat(s);return neg?-n:n;
}

/* Ahorro: interés simple con retención ISR opcional y renovación automática al vencer (práctica común en certificados RD) */
function effRate(s){return s.rate/100*(s.isr?0.9:1)}
function savValue(s,t){
  const r=effRate(s), term=termMs(s), el=Math.max(0,t-s.start);
  const n=Math.floor(el/term), rem=el-n*term;
  return s.principal*Math.pow(1+r*term/YEAR,n)*(1+r*rem/YEAR);
}
function perSec(s,t){return savValue(s,t)*effRate(s)/(YEAR/1000)}
function totals(t){
  let v=0,p=0,ps=0;
  S.savings.forEach(s=>{v+=conv(savValue(s,t),s.cur,S.base);p+=conv(s.principal,s.cur,S.base);ps+=conv(perSec(s,t),s.cur,S.base)});
  return {v,p,ps};
}
/* Préstamos: sistema francés (cuota fija) */
function cuota(P,rate,n){const i=rate/1200;return i?P*i/(1-Math.pow(1+i,-n)):P/n}
function paid(l){const a=new Date(l.start),b=new Date();let k=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());if(b.getDate()<a.getDate())k--;return Math.min(Math.max(k,0),l.months)}
function balance(P,rate,n,k){const i=rate/1200;if(!i)return P-P/n*k;const c=cuota(P,rate,n);return Math.max(0,P*Math.pow(1+i,k)-c*(Math.pow(1+i,k)-1)/i)}
function nextPay(l){const a=new Date(l.start);const k=paid(l)+1;return new Date(a.getFullYear(),a.getMonth()+k,a.getDate())}

function nextMat(s,t=Date.now()){if(s.open)return null;const term=termMs(s),el=Math.max(0,t-s.start);return s.start+(Math.floor(el/term)+1)*term}

function perRange(k){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),sod=new Date(y,m,n.getDate()).getTime(),end=sod+DAY-1;
  switch(k){
    case 'hoy':return [sod,end];
    case 'sem':return [sod-((n.getDay()+6)%7)*DAY,end];
    case 'mes':return [new Date(y,m,1).getTime(),end];
    case 'm3':return [new Date(y,m-2,1).getTime(),end];
    case 'm6':return [new Date(y,m-5,1).getTime(),end];
    case 'y1':return [new Date(y,m-11,1).getTime(),end];
    case 'todo':{const all=[...S.expenses,...S.incomes].map(x=>x.date);const a=all.length?Math.min(...all):sod;return [new Date(new Date(a).getFullYear(),new Date(a).getMonth(),1).getTime(),Math.max(end,...all)]}
    case 'fechas':{const f=perC.from?parseDate(perC.from)-DAY/2:sod-29*DAY,t=perC.to?parseDate(perC.to)+DAY/2-1:end;return [Math.min(f,t),Math.max(f,t)]}
    default:return [sod-29*DAY,end];
  }
}

const curSym={DOP:'RD$',USD:'US$',EUR:'€'};
const fmtFit=(v,cur)=>Math.abs(v)>=1e6?(v<0?'−':'')+(curSym[cur]||'')+(Math.abs(v)/1e6).toFixed(2)+' M':fmt(v,cur,0);
function compact(v,cur){const s=curSym[cur]||'',a=Math.abs(v);return (v<0?'−':'')+s+(a>=1e6?(a/1e6).toFixed(a>=1e7?0:1)+' M':a>=1e4?Math.round(a/1e3)+' mil':a>=1e3?(a/1e3).toFixed(1)+' mil':Math.round(a))}
function agg(items,keyFn,nameFn,colorFn,valFn){
  const m=new Map();items.forEach(x=>{const k=keyFn(x);m.set(k,(m.get(k)||0)+(valFn?valFn(x):conv(x.amt,x.cur,S.base)))});
  let parts=[...m.entries()].map(([k,v])=>({k,n:nameFn(k),v,c:colorFn(k)})).filter(p=>p.v>0).sort((a,b)=>b.v-a.v);
  if(parts.length>6){const rest=parts.slice(5).reduce((a,p)=>a+p.v,0);parts=parts.slice(0,5).concat({k:'_o',n:'Otros',v:rest,c:'var(--c-gray)'})}
  return parts;
}
function donutBlock(parts,label){
  const tot=parts.reduce((a,p)=>a+p.v,0);if(!tot)return '<p class="hint">Sin datos en este período.</p>';
  const R=44,C=2*Math.PI*R,gap=parts.length>1?2.2:0;let off=0;
  const arcs=parts.map(p=>{const L=p.v/tot*C,len=Math.max(.6,L-gap);const s=`<circle r="${R}" cx="58" cy="58" fill="none" stroke="${p.c}" stroke-width="15" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 58 58)"><title>${esc(p.n)}: ${esc(fmt(p.v,S.base,0))}</title></circle>`;off+=L;return s}).join('');
  return `<div class="dn"><svg class="dn-svg" viewBox="0 0 116 116" role="img" aria-label="${esc(label)}: ${parts.map(p=>esc(p.n)+' '+Math.round(p.v/tot*100)+' %').join(', ')}">${arcs}<text x="58" y="56" text-anchor="middle" class="dn-t1">${esc(compact(tot,S.base))}</text><text x="58" y="72" text-anchor="middle" class="dn-t2">total</text></svg>

}
function bucketsFor(R,items){
  const span=R[1]-R[0],a=new Date(R[0]);
  const unit=span<=15*DAY?'day':span<=75*DAY?'week':span<=800*DAY?'month':'year';
  let s;if(unit==='day')s=new Date(a.getFullYear(),a.getMonth(),a.getDate());else if(unit==='week'){s=new Date(a.getFullYear(),a.getMonth(),a.getDate());s.setDate(s.getDate()-((s.getDay()+6)%7))}else if(unit==='month')s=new Date(a.getFullYear(),a.getMonth(),1);else s=new Date(a.getFullYear(),0,1);
  const B=[],wk=new Intl.DateTimeFormat('es-DO',{weekday:'narrow'}),mo=new Intl.DateTimeFormat('es-DO',{month:'short'});
  while(s.getTime()<=R[1]&&B.length<60){
    const e=unit==='day'?new Date(s.getFullYear(),s.getMonth(),s.getDate()+1):unit==='week'?new Date(s.getFullYear(),s.getMonth(),s.getDate()+7):unit==='month'?new Date(s.getFullYear(),s.getMonth()+1,1):new Date(s.getFullYear()+1,0,1);
    const v=items.filter(x=>x.date>=s.getTime()&&x.date<e.getTime()).reduce(sumB,0);

  let ess=ESSENTIAL.reduce((a,k)=>a+conv(+(S.catBudget||{})[k]||0,'DOP',S.base),0);

  S.cards.forEach(c=>ess+=conv(minPay(c),c.cur,S.base));
  return {liquid,ess,months:ess>0?liquid/ess:0,target:S.emTarget||6};
}
function homeBalance(){ /* > 0: la otra persona te debe; < 0: le debes */
  if(!S.home||!S.home.on)return 0;
  return S.expenses.filter(x=>x.shared).reduce((a,x)=>a+(x.payer==='otro'?-1:1)*conv(x.amt,x.cur,S.base)/2,0)+conv(S.home.adj||0,'DOP',S.base);
}

/* ---- Plan para salir de deudas ---- */
let planExtra=5000; /* en RD$ */
function debtsNow(){
  const d=[];
  S.loans.forEach(l=>{const k=paid(l);if(k>=l.months)return;const b=conv(balance(l.principal,l.rate,l.months,k),l.cur,S.base);if(b<1)return;
    d.push({name:l.name,bal:b,r:l.rate/1200,apr:l.rate,min:conv(cuota(l.principal,l.rate,l.months),l.cur,S.base),card:false})});
  S.cards.forEach(c=>{if(c.balance<=0)return;d.push({name:c.name,bal:conv(c.balance,c.cur,S.base),r:c.rate/1200,apr:c.rate,floor:conv(c.cur==='DOP'?500:10,c.cur,S.base),card:true})});
  return d;
}
const debtMin=x=>x.card?Math.min(x.bal,Math.max(x.bal*.05,x.floor)):Math.min(x.bal,x.min);
function runPlan(extra,method){ /* avalancha · bola · min */
  const D=debtsNow().map(x=>({...x,out:null}));if(!D.length)return null;
  const budget=D.reduce((a,x)=>a+debtMin(x),0)+extra;let m=0,int=0;
  while(m<600&&D.some(x=>x.bal>.5)){
    m++;D.forEach(x=>{if(x.bal>0){const i=x.bal*x.r;x.bal+=i;int+=i}});
    let pay=method==='min'?Infinity:budget;
    D.forEach(x=>{if(x.bal<=0)return;const p=Math.min(debtMin(x),pay);x.bal-=p;pay-=p});
    if(method!=='min'){const order=D.filter(x=>x.bal>0).sort(method==='avalancha'?(a,b)=>b.apr-a.apr||a.bal-b.bal:(a,b)=>a.bal-b.bal||b.apr-a.apr);
      for(const x of order){if(pay<=0)break;const p=Math.min(x.bal,pay);x.bal-=p;pay-=p}}
    D.forEach(x=>{if(x.bal<=.5&&x.out===null){x.bal=0;x.out=m}});
  }
  return {months:m,int,done:!D.some(x=>x.bal>.5),budget,order:[...D].sort((a,b)=>(a.out??1e9)-(b.out??1e9))};
}
function planOut(){
  const X0=conv(planExtra,'DOP',S.base),A=runPlan(X0,'avalancha'),B=runPlan(X0,'bola'),M=runPlan(0,'min');
  const fin=n=>{const d=new Date();d.setMonth(d.getMonth()+n);return monthShort.format(d)};
  const best=A.int<=B.int+.5?A:B, bestKey=best===A?'avalancha':'bola';
  const card=(key,R,title,tag)=>`<article class="plan${bestKey===key?' best':''}">${bestKey===key?'<span class="badge">Menos intereses</span>':'<span class="badge soft">Más motivación</span>'}<h3>${title}</h3><p class="pl-t">${tag}</p>
    <div class="kv2 num"><div><small>Sin deudas en</small><strong>${R.done?fin(R.months):'+50 años'}</strong></div><div><small>Intereses</small><strong>${esc(fmt(R.int,S.base,0))}</strong></div></div>
    <ol>${R.order.map(x=>`<li>${esc(x.name)} <span class="num">· ${x.out?fin(x.out):'—'}</span></li>`).join('')}</ol></article>`;
  const gain=M.done?`Comparado con pagar solo los mínimos, ahorras <b class="num">${esc(fmt(M.int-best.int,S.base,0))}</b> en intereses y terminas <b class="num">${Math.max(0,M.months-best.months)} meses</b> antes.`
    :`Pagando solo los mínimos, las tarjetas no se terminan de pagar en 50 años.`;
  return `<p class="hint num plan-tot">Pagarías <b>${esc(fmt(A.budget,S.base,0))}</b> al mes: los mínimos más el extra. Cuando terminas una deuda, ese dinero pasa a la siguiente.</p>
  <div class="plans">${card('avalancha',A,'Avalancha','Primero la tasa más alta.')}${card('bola',B,'Bola de nieve','Primero el saldo más pequeño.')}</div>
  <p class="base-note">${gain}</p>`;
}
function planHTML(){
  if(!debtsNow().length)return `<div class="empty" style="margin-top:14px">No tienes deudas activas.</div>`;
  return `<section class="plan-x"><div class="field"><label for="planX">Pago extra al mes <output class="num" id="planXo">${esc(fmt(conv(planExtra,'DOP',S.base),S.base,0))}</output></label><input type="range" id="planX" min="0" max="50000" step="500" value="${planExtra}"></div>
  <div id="planOut">${planOut()}</div></section>`;
}

const MES={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11,ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,sept:8,oct:9,nov:10,dic:11};
const DATE_RX='(\\d{1,2}[\\/\\-.]\\d{1,2}[\\/\\-.]\\d{2,4}|\\d{4}-\\d{1,2}-\\d{1,2}|\\d{1,2}\\s+de\\s+[a-záéíóú]+\\s+(?:de|del)\\s+\\d{4}|\\d{1,2}[\\-\\s][a-z]{3,4}[\\-\\s]\\d{2,4})';
function parseDateEs(s){
  if(!s)return null;s=s.trim().toLowerCase();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return new Date(+m[1],+m[2]-1,+m[3]).getTime();
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]).getTime()}
  if((m=s.match(/^(\d{1,2})\s+de\s+([a-záéíóú]+)\s+(?:de|del)\s+(\d{4})$/))&&MES[m[2]]!==undefined)return new Date(+m[3],MES[m[2]],+m[1]).getTime();
  if((m=s.match(/^(\d{1,2})[\-\s]([a-z]{3,4})[\-\s](\d{2,4})$/))&&MES[m[2]]!==undefined){let y=+m[3];if(y<100)y+=2000;return new Date(y,MES[m[2]],+m[1]).getTime()}
  return null;
}
const clean=t=>String(t||'').replace(/ /g,' ').replace(/[ \t]+/g,' ').replace(/\r/g,'');
function curOf(sym,ctx){
  const s=(sym||'').toUpperCase();
  if(/US|USD|U\$S/.test(s))return 'USD';if(/EUR|€/.test(s))return 'EUR';if(/RD|DOP/.test(s))return 'DOP';
  if(ctx&&/d[oó]lares|USD|US\$/i.test(ctx)&&!/RD\$|DOP|pesos/i.test(ctx))return 'USD';
  return 'DOP';
}
const MONEY_RX=/(RD\$|US\$|U\$S|USD|DOP|EUR|€|\$)\s*([0-9][0-9.,]*[0-9])|([0-9][0-9.,]*[0-9])\s*(DOP|USD|EUR|pesos|d[oó]lares)/gi;

/* Categoría probable según el comercio */
const CAT_RULES=[
  ['comida',/SUPERMERC|SUPER |COLMADO|NACIONAL|BRAVO|JUMBO|SIRENA|PLAZA LAMA|CARREFOUR|PRICESMART|ALMACENES|REST|PIZZA|BURGER|CAFE|COFFEE|KFC|MCDONALD|WENDY|PANADER|FOOD|DELIVERY|PEDIDOSYA|UBER ?EATS|CARNIC|POLLO/],
  ['transporte',/SHELL|TEXACO|ESSO|TOTAL|SUNIX|PETRO|GASOLIN|ESTACION|COMBUSTIBLE|UBER(?! ?EATS)|INDRIVE|CABIFY|TAXI|PEAJE|PASO RAPIDO|PARQUEO|AUTO ?PARTS|GOMER/],
  ['salud',/FARMACIA|CAROL|CLINICA|HOSPITAL|LABORAT|REFERENCIA|AMADITA|MEDIC|ODONT|DENTAL|OPTICA|GYM|GIMNASIO|SMART FIT|BODY SHOP/],
  ['ocio',/NETFLIX|SPOTIFY|CINE|CARIBBEAN CINEMAS|PALACIO DEL CINE|DISNEY|HBO|MAX\.COM|PRIME VIDEO|STEAM|PLAYSTATION|XBOX|APPLE\.COM|GOOGLE \*|BAR |LOUNGE|DISCO|HOTEL|AIRBNB|BOOKING|EXPEDIA|AEROL|ARAJET|JETBLUE|AMERICAN AIR/],
  ['servicios',/EDESUR|EDENORTE|EDEESTE|CLARO|ALTICE|VIVA|CAASD|CORAASAN|WIND|INTERNET|TELECABLE|SEGURO|SURA|MAPFRE|HUMANO|PALIC/],
  ['educacion',/COLEGIO|ESCUELA|UNIVERSIDAD|INTEC|PUCMM|UNIBE|UASD|UNAPEC|APEC|LIBRER|CUESTA|COURSERA|UDEMY|PLATZI|DUOLINGO/],
  ['vivienda',/ALQUILER|INMOBILI|CONDOMINIO|MANTENIMIENTO|FERRETER|OCHOA|HOME DEPOT|IKEA|MUEBLES/]
];
function guessCat(merchant){const m=(merchant||'').toUpperCase();for(const [c,rx] of CAT_RULES)if(rx.test(m))return c;return 'otros'}

/* Aviso de consumo con tarjeta → {amt,cur,merchant,last4} o null */
function parseCardAlert(raw){
  const t=clean(raw), one=t.replace(/\n+/g,' ');
  if(!/(consumo|compra|transacci[oó]n|cargo|autorizad|fue utilizada|uso de (su|tu) tarjeta|retiro|purchase)/i.test(one))return null;
  if(/(pago (recibido|aplicado)|hemos recibido (su|tu) pago|abono a (su|tu)|reverso|devoluci[oó]n|estado de cuenta|promoci[oó]n|oferta especial|c[oó]digo de (seguridad|verificaci[oó]n)|token|OTP)/i.test(one)&&!/(consumo|compra) (por|de)/i.test(one))return null;
  if(!/(tarjeta|card|TC\b|d[eé]bito|cr[eé]dito|\*{2,}\d{4}|x{2,}\d{4})/i.test(one))return null;
  let best=null;
  const kw=one.search(/(monto|por (un )?(valor|monto) de|importe|por RD|por US|por \$|amount)/i);
  for(const m of one.matchAll(MONEY_RX)){
    const sym=m[1]||m[4], num=money(m[2]||m[3]);
    if(!(num>0)||num>5e7)continue;
    const near=kw>=0?Math.abs(m.index-kw):9999;
    if(!best||near<best.near)best={amt:num,cur:curOf(sym,one),near};
  }
  if(!best)return null;
  let merchant='';let mm;
  if((mm=one.match(/(?:comercio|establecimiento|merchant|lugar|negocio)\s*[:\-]\s*([^\n|;]{3,45}?)(?=\s+(?:fecha|monto|hora|tarjeta|el d[ií]a|por|referencia|ciudad|pa[ií]s)\b|[.;|]|$)/i)))merchant=mm[1];
  else{for(const m of one.matchAll(/\ben\s+(?:el\s+comercio\s+)?([A-Z0-9][A-Z0-9 &'.\-*\/#]{2,40}[A-Z0-9])(?=\s+(?:el|por|con|fecha|monto|a las|en fecha|de fecha|\d)|[.,;]|$)/g)){if(/[A-Z]{2}/.test(m[1])){merchant=m[1];break}}}
  merchant=merchant.replace(/\s{2,}/g,' ').trim().replace(/^(EL|LA)\s+COMERCIO\s+/,'');
  const l4=one.match(/(?:terminad[ao]s?\s+en|termina(?:da)?\s+en|finalizad[ao]\s+en|que termina en|[uú]ltimos\s+(?:4|cuatro)\s+d[ií]gitos\s*:?|ending in|\*{2,}|x{2,}|X{2,})\s*(\d{4})\b/i);
  return {amt:best.amt,cur:best.cur,merchant:merchant.toUpperCase()||'',last4:l4?l4[1]:'',kind:/retiro/i.test(one)?'retiro':'consumo'};
}

/* Acuerdo o confirmación de un puesto de bolsa → {rate,amt,cur,name,issuer,start,end,months} o null */
function parseBroker(raw,sender){
  const t=clean(raw), one=t.replace(/\n+/g,' ');
  if(!/(tasa|rendimiento|cup[oó]n|yield|ytm)/i.test(one))return null;
  const num='(\\d{1,2}(?:[.,]\\d{1,6})?)';
  const rateRx=new RegExp('(tasa(?:\\s+de)?(?:\\s+(?:rendimiento|cup[oó]n|inter[eé]s|anual|pactada|de\\s+compra|de\\s+colocaci[oó]n|efectiva))?|rendimiento(?:\\s+(?:anual|al\\s+vencimiento|a\\s+vencimiento|esperado|efectivo))?|yield|ytm)\\s*(?:\\(\\s*%\\s*\\))?\\s*(?:anual)?\\s*[:=]?\\s*'+num+'\\s*(%|por\\s*ciento)?','gi');
  let rate=null;
  for(const m of one.matchAll(rateRx)){
    const val=parseFloat(m[2].replace(',','.'));
    if(!(val>0.05&&val<40))continue;
    const lab=m[1].toLowerCase();
    const score=/rendimiento|yield|ytm|pactada|compra|colocaci|efectiva/.test(lab)?3:/cup/.test(lab)?1:2;
    if(!rate||score>rate.score)rate={val,score};
  }
  if(!rate)return null;
  const amtRx=/(monto\s+(?:a\s+liquidar|liquidado|invertido|transado|total|neto|de\s+la\s+operaci[oó]n|a\s+pagar|nominal)|monto|valor\s+(?:transado|de\s+compra|liquidado|a\s+pagar|efectivo|nominal|facial)|total\s+a\s+(?:pagar|liquidar|debitar)|importe(?:\s+total)?|capital(?:\s+invertido)?|inversi[oó]n)\s*(?:\(\s*(?:RD\$|US\$|DOP|USD)\s*\))?\s*[:=]?\s*(?:de\s+|por\s+)?(RD\$|US\$|DOP|USD|\$)?\s*([0-9][0-9.,]{2,}[0-9])/gi;
  let amt=null;
  for(const m of one.matchAll(amtRx)){
    const v=money(m[3]);if(!(v>=1000))continue;
    const lab=m[1].toLowerCase();
    const score=/liquid|pagar|transado|invertido|debitar|efectivo|neto|compra|capital|inversi/.test(lab)?3:/nominal|facial/.test(lab)?1:2;
    if(!amt||score>amt.score)amt={v,score,cur:curOf(m[2],one)};
  }
  if(!amt)return null;
  const dateAfter=lab=>{const m=one.match(new RegExp('('+lab+')\\s*[:=]?\\s*'+DATE_RX,'i'));return m?parseDateEs(m[2]):null};
  const start=dateAfter('fecha\\s+(?:valor|de\\s+liquidaci[oó]n|de\\s+operaci[oó]n|de\\s+pacto|de\\s+compra|de\\s+transacci[oó]n|de\\s+colocaci[oó]n|de\\s+emisi[oó]n)');
  const end=dateAfter('fecha\\s+de\\s+(?:vencimiento|redenci[oó]n|recompra|retroventa)|vencimiento|vence');
  let months=null;
  const pd=one.match(/plazo\s*[:=]?\s*(\d{1,4})\s*d[ií]as/i), pm=one.match(/plazo\s*[:=]?\s*(\d{1,3})\s*mes/i);
  if(start&&end&&end>start)months=Math.max(1,Math.round((end-start)/(30.44*864e5)));
  else if(pd)months=Math.max(1,Math.round(+pd[1]/30.44));else if(pm)months=+pm[1];
  const ins=one.match(/\b(bonos?\s+(?:soberanos?|corporativos?|del\s+ministerio\s+de\s+hacienda|de\s+deuda\s+subordinada)?|certificados?\s+(?:de\s+inversi[oó]n|financieros?)?|letras?\s+del\s+banco\s+central|notas?\s+de\s+renta\s+fija|papel(?:es)?\s+comercial(?:es)?|reportos?|cuotas?\s+de\s+(?:un\s+)?fondo|valores?\s+de\s+fideicomiso)/i);
  const iss=one.match(/(Ministerio\s+de\s+Hacienda|Banco\s+Central(?:\s+de\s+la\s+Rep[uú]blica\s+Dominicana)?|BCRD|Hacienda)/i);
  const yr=end?new Date(end).getFullYear():null;
  let name=(ins?ins[1].replace(/\s+/g,' ').trim():'Inversión');name=name.charAt(0).toUpperCase()+name.slice(1).toLowerCase();
  if(iss&&!/hacienda|banco central/i.test(name))name+=' · '+(/hacienda/i.test(iss[1])?'Hacienda':'Banco Central');
  name=name.replace(/ministerio de hacienda/i,'Ministerio de Hacienda').replace(/banco central/i,'Banco Central');
  if(yr)name+=' '+yr;
  return {rate:rate.val,amt:amt.v,cur:amt.cur,name,issuer:iss?iss[1]:'',entity:sender||'Puesto de bolsa',start,end,months:months||12,reporto:/reporto/i.test(one)};
}
